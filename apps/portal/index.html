<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fortbildungen</title>
    <!--
      The widget, loaded as its own module rather than bundled into this app.

      It has to be the artifact `apps/widget` produced: its Tailwind is scoped
      under `.ds-lms-root` and inlined as a string for the shadow root, and
      re-compiling it with this app's Tailwind config would style it
      differently here than in WordPress. See scripts/bundle-widget.mjs.
    -->
    <script type="module" src="/ds-lms.js"></script>
    <!--
      Runtime configuration: which API to call, which project, and (in the
      portal) which Keycloak client. Written when the container starts by
      infra/nginx/ds-runtime-config.sh, so one image runs in any environment —
      see apps/portal/src/config.ts. Classic script, not a module: it must have
      executed before the app's module runs, and `type="module"` is deferred.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
