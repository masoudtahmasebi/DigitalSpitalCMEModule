# The production stack (P10-04).
#
# One Hetzner host, in Germany (CLAUDE.md §4). Everything is a container and
# the whole thing comes up with `infra/deploy/deploy.sh`.
#
# ## Why Caddy rather than nginx + certbot
#
# Let's Encrypt certificates: Caddy obtains and renews them automatically from
# the `tls` directive and the hostnames in the Caddyfile, with no cron job, no
# renewal hook and no separate ACME client to forget about. The failure mode of
# certbot on a host nobody logs into is an expired certificate at 03:00 on a
# Sunday; the failure mode here is a container restart.
#
# ## Why not Traefik
#
# Traefik's distinguishing feature is *dynamic* discovery: containers announce
# their own routes through labels, and the proxy reconfigures itself as they
# come and go. That is worth a great deal when the set of services changes
# without anybody editing a file — autoscaling, ephemeral preview environments,
# a platform team that does not own the app.
#
# None of that describes this. There are four services, their names are fixed,
# and the routing table changes when somebody edits this repository. Against
# that, dynamic discovery is a cost rather than a benefit:
#
#   * the routes move from one reviewable file into labels spread across the
#     service definitions, where "what is exposed publicly?" stops being a
#     question you can answer by reading one thing;
#   * a mislabelled container publishes itself, so the failure mode of a typo
#     changes from "this service is unreachable" to "this service is reachable";
#   * the CSP and the body-size rules in the Caddyfile — which are compliance
#     surface, not plumbing — become label strings.
#
# The Caddyfile is four site blocks and reads top to bottom. If this ever grows
# containers that appear without a commit, revisit it; until then, swapping
# would be work with a security cost and no functional gain.
#
# ## What is and is not exposed
#
# Only Caddy publishes ports. Postgres, Redis and the API are reachable on the
# internal network and nowhere else — `ports:` is deliberately absent from all
# three. A database published on 5432 "just for migrations" is how a database
# ends up on Shodan.
#
# ## Secrets
#
# Everything sensitive comes from `~/ds-education/secrets.env` on the host,
# generated by the deploy script and never committed. The compose file names
# variables; it never contains values.
#
# ## Images are built here, on the host (ADR-0013)
#
# There is no registry. One small host, one deployment, and a `build:` that
# takes four minutes with a warm layer cache — against which a registry adds an
# account, a token on the server, a login step, and a build artefact that the
# person debugging at 22:00 cannot reproduce because it was made somewhere else.
#
# The tag is the commit, so `docker images` is a deployment history and a
# rollback is `--rollback <sha>` against an image that is already on the disk.

name: ds-education

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Harmless if the firewall drops it; a real improvement on mobile
      # networks, which is where a physician watches a 25-minute video.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Optional extra site blocks, written by deploy.sh into the state
      # directory — outside the git clone, so a `git checkout` cannot touch
      # them. Mounted whether or not a block exists: Caddy's `import` of a glob
      # matching nothing is fine, but a bind mount of a missing directory is
      # created root-owned by Docker and then cannot be written by `deploy`.
      - ${DS_SITES_DIR}:/etc/caddy/sites:ro
      # The certificate store. Losing this volume means re-issuing every
      # certificate, and Let's Encrypt rate-limits that — so it is named, not
      # anonymous.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      # The portal's own hostname. Absent, Caddy parses a site block with an
      # empty address — which is not a warning, it is a different site.
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
      WIDGET_DOMAIN: ${WIDGET_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Both of these land inside a Content-Security-Policy `connect-src`.
      # Unset, the directive collapses to `'self'` and the console can no
      # longer reach the API at all — a failure that looks like the API being
      # down and is actually a header.
      API_DOMAIN_URL: ${API_DOMAIN_URL}
      # The portal's CSP connect-src. Derived from KEYCLOAK_ISSUER by
      # domains.sh — the origin of the realm the portal signs learners in
      # against — rather than being a second place to write the same host.
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, internal]

  api:
    image: ds-education/api:${DS_COMMIT}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # The commit the image was built from, so a running process can be asked
      # what it is rather than only the deploy log saying so once (P42-03).
      # Surfaced as `ds_build_info` on /metrics, which the edge does not route.
      DS_COMMIT: ${DS_COMMIT}
      # `_URL` — the percent-encoded form. `openssl rand -base64 32` emits `/`,
      # and a `/` in a URL's userinfo terminates the authority component, so the
      # raw value produces a connection string the client rejects as invalid.
      # `ds_url_encode` in infra/deploy/secrets.sh, exported by deploy.sh.
      DATABASE_URL: postgres://ds_app:${DS_APP_PASSWORD_URL}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # No Keycloak configuration. Which realm a learner's token is validated
      # against is a property of the project the request names, read from
      # `projects.keycloak_issuer` per request — which is what lets one
      # installation serve several customers with separate realms (P17-02).
      # The variable the API actually reads is ALLOWED_ORIGINS. This line said
      # CORS_ALLOWED_ORIGINS, which the config schema does not define — so the
      # allow-list arrived empty and every cross-origin call from the MEDICE
      # WordPress site was refused. The host-side name is kept as-is so an
      # existing `.env` on the server still works.
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # The parent domain the staff session cookie is scoped to — ".cme.example.de"
      # — so the console at verwaltung.… and the API at api.… are same-site and
      # the browser attaches it (ADR-0012).
      #
      # **Required in production and easy to miss**, because development has
      # both on localhost where the value must be empty. Unset here, the API
      # sets a host-only cookie on api.…, the console never receives it, and
      # every staff sign-in appears to succeed and then immediately reports the
      # session as expired.
      STAFF_COOKIE_DOMAIN: ${STAFF_COOKIE_DOMAIN}

      # Two limits, because the font upload is genuinely different — see the
      # note in the Caddyfile. Caddy refuses an oversized body before it is
      # buffered; these are the API's own enforcement of the same rule.
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-1mb}
      MAX_FONT_BODY_SIZE: ${MAX_FONT_BODY_SIZE:-3mb}

      # Certificate delivery (P8-03). These were configurable in the example
      # env and read by the API, and were not passed here — so the worker ran
      # on its defaults whatever the deployment said.
      CERTIFICATE_DELIVERY_ENABLED: ${CERTIFICATE_DELIVERY_ENABLED:-yes}
      CERTIFICATE_DELIVERY_INTERVAL_SEC: ${CERTIFICATE_DELIVERY_INTERVAL_SEC:-300}
      CERTIFICATE_DELIVERY_BATCH_SIZE: ${CERTIFICATE_DELIVERY_BATCH_SIZE:-25}

      # Encryption at rest for the VNR password and SMTP credentials. Without
      # it the API refuses to start in production, by design — there is no
      # plaintext fallback (shared/secret-cipher.ts).
      SECRETS_KMS_KEY: ${SECRETS_KMS_KEY:?SECRETS_KMS_KEY is required — openssl rand -base64 32}

      # Where the download link in a certificate email points. Empty means a
      # broken link in the one email a learner is told to expect.
      PORTAL_BASE_URL: ${PORTAL_BASE_URL}

      # An EIV submission approaching its statutory deadline raises an alert
      # rather than failing silently (CLAUDE.md §4 invariant 8). Unset, the
      # alert has nowhere to go.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

      EIV_BASE_URL: ${EIV_BASE_URL:-http://127.0.0.1:4010}
      # `:-` because empty is the *correct* value until ÄKWL has answered — and
      # a bare `${EIV_ALLOW_LIVE}` makes compose warn about it on every deploy,
      # which teaches everybody to skim compose's warnings.
      EIV_ALLOW_LIVE: ${EIV_ALLOW_LIVE:-}
      # Exactly one submitter, whatever the API scales to. Two workers racing
      # for the same submission is a duplicate Punktemeldung, which cannot be
      # withdrawn after the correction window closes.
      EIV_WORKER_ENABLED: ${EIV_WORKER_ENABLED:-yes}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-yes}
      S3_URL_TTL_SEC: ${S3_URL_TTL_SEC:-3600}
      S3_UPLOAD_TTL_SEC: ${S3_UPLOAD_TTL_SEC:-1800}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # `/health` is public precisely so a probe can reach it without a token.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [internal]

  # The console and the portal are configured at **runtime**, not at build time
  # (P16-02). Their entrypoint writes /config.js from these before nginx starts,
  # so one image runs in any environment and the API base can never drift from
  # the API_DOMAIN Caddy is actually serving — deploy.sh derives both from the
  # same BASE_DOMAIN.
  #
  # A missing DS_API_BASE stops the container rather than producing a console
  # that loads and then fails every request.
  admin:
    image: ds-education/admin:${DS_COMMIT}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: admin
    restart: unless-stopped
    environment:
      DS_API_BASE: ${DS_ADMIN_API_BASE}
    networks: [internal]

  # The platform's own learner frontend. A host adapter like the WordPress
  # plugin, not a privileged one (ADR-0007): it holds no credential the API
  # trusts, and serves its own copy of the widget bundle so a learner's browser
  # makes no cross-origin request to load it.
  portal:
    image: ds-education/portal:${DS_COMMIT}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: portal
    restart: unless-stopped
    environment:
      DS_API_BASE: ${DS_PORTAL_API_BASE}
      # The portal's own Keycloak client — a learner-facing public client, not
      # the console's. The console has not spoken to Keycloak since P12-06
      # (ADR-0012), which is why only this service gets these three.
    networks: [internal]

  widget:
    image: ds-education/widget:${DS_COMMIT}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: widget
    restart: unless-stopped
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by init-roles.sql via psql's `\getenv`. Without these the login
      # roles would be created with the development passwords that are in the
      # repository, and the API would fail to connect with the ones from the
      # deployment secrets — which somebody would then "fix" the wrong way.
      DS_MIGRATOR_PASSWORD: ${DS_MIGRATOR_PASSWORD}
      DS_APP_PASSWORD: ${DS_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates ds_migrator, ds_app and ds_binding_resolver. ds_app is NOT
      # BYPASSRLS — the whole of ADR-0002 depends on that.
      - ../postgres/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # Runs on a timer, not on a port (P23-03).
  #
  # `profiles:` keeps it out of `docker compose up`: it has nothing to serve and
  # a container that took a backup every time the stack started would take one
  # in the middle of every deploy. It is invoked explicitly:
  #
  #   ./dsc run --rm backup database   # dump, encrypt, upload, prune
  #   ./dsc run --rm backup objects    # mirror course media
  #   ./dsc run --rm backup verify     # is there a recent backup? — exit 1 if not
  #
  # See `infra/deploy/backup.timer` for the schedule and
  # `docs/runbook-backup.md` for the restore.
  backup:
    image: ds-education/backup:${DS_COMMIT}
    profiles: [tools]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: backup
    environment:
      # **Not** the API's `ds_app` credential. A logical dump taken as ds_app is
      # silently partial — FORCE ROW LEVEL SECURITY applies to it too — and
      # exits 0, which is the worst possible combination. This is the superuser,
      # and it is the reason the backup is a separate container: the API must
      # not hold this.
      BACKUP_DATABASE_URL: postgres://${POSTGRES_SUPERUSER}:${POSTGRES_SUPERUSER_PASSWORD_URL}@postgres:5432/${POSTGRES_DB}

      # 32 bytes, base64. Generated by `ds_ensure_secrets` if absent, and
      # **deliberately not `SECRETS_KMS_KEY`**: that one decrypts the VNR
      # password and the SMTP credentials *inside* the dump, so sharing them
      # would mean one stolen key opens both.
      #
      # Losing it makes every stored backup permanently unreadable. It belongs
      # in the password manager, beside the KMS key and not in the same entry.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}

      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-yes}

      # A different bucket, ideally with its own credentials that cannot delete
      # from the primary. A "backup" in the same bucket is a copy of the thing
      # that is about to be deleted.
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}

      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      BACKUP_WORK_DIR: /var/tmp/ds-backup
    volumes:
      # The dump is written here before it is uploaded, then deleted. On a
      # named volume rather than the container's writable layer so a large
      # database does not depend on the storage driver's overlay limits.
      - backup-work:/var/tmp/ds-backup
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters and cache only — nothing here needs to survive a
    # restart, and an AOF on a small host is cost without benefit.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks: [internal]

networks:
  # Only Caddy is on both. Nothing else can be reached from outside the host.
  edge:
  internal:
    internal: true

volumes:
  postgres-data:
  backup-work:
  caddy-data:
  caddy-config:
