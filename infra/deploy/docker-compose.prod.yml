# The production stack (P10-04).
#
# One Hetzner host, in Germany (CLAUDE.md §4). Everything is a container and
# the whole thing comes up with `infra/deploy/deploy.sh`.
#
# ## Why Caddy rather than nginx + certbot
#
# Let's Encrypt certificates: Caddy obtains and renews them automatically from
# the `tls` directive and the hostnames in the Caddyfile, with no cron job, no
# renewal hook and no separate ACME client to forget about. The failure mode of
# certbot on a host nobody logs into is an expired certificate at 03:00 on a
# Sunday; the failure mode here is a container restart.
#
# ## What is and is not exposed
#
# Only Caddy publishes ports. Postgres, Redis and the API are reachable on the
# internal network and nowhere else — `ports:` is deliberately absent from all
# three. A database published on 5432 "just for migrations" is how a database
# ends up on Shodan.
#
# ## Secrets
#
# Everything sensitive comes from `.env.production` on the host, which is
# written by the deploy script from GitHub secrets and is never committed. The
# compose file names variables; it never contains values.

name: ds-education

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Harmless if the firewall drops it; a real improvement on mobile
      # networks, which is where a physician watches a 25-minute video.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Optional extra site blocks, written by deploy.sh. Today that is only
      # the bare domain's redirect; the directory is mounted either way,
      # because Caddy's `import` of a glob matching nothing is fine but a bind
      # mount of a directory that does not exist is not.
      - ./sites:/etc/caddy/sites:ro
      # The certificate store. Losing this volume means re-issuing every
      # certificate, and Let's Encrypt rate-limits that — so it is named, not
      # anonymous.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      # The portal's own hostname. Absent, Caddy parses a site block with an
      # empty address — which is not a warning, it is a different site.
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
      WIDGET_DOMAIN: ${WIDGET_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Both of these land inside a Content-Security-Policy `connect-src`.
      # Unset, the directive collapses to `'self'` and the console can no
      # longer reach the API at all — a failure that looks like the API being
      # down and is actually a header.
      API_DOMAIN_URL: ${API_DOMAIN_URL}
      # The portal's CSP connect-src. Derived from KEYCLOAK_ISSUER by
      # domains.sh — the origin of the realm the portal signs learners in
      # against — rather than being a second place to write the same host.
      KEYCLOAK_ORIGIN: ${KEYCLOAK_ORIGIN}
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, internal]

  api:
    image: ${IMAGE_API}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://ds_app:${DS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
      # The variable the API actually reads is ALLOWED_ORIGINS. This line said
      # CORS_ALLOWED_ORIGINS, which the config schema does not define — so the
      # allow-list arrived empty and every cross-origin call from the MEDICE
      # WordPress site was refused. The host-side name is kept as-is so an
      # existing `.env` on the server still works.
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # The parent domain the staff session cookie is scoped to — ".cme.example.de"
      # — so the console at verwaltung.… and the API at api.… are same-site and
      # the browser attaches it (ADR-0012).
      #
      # **Required in production and easy to miss**, because development has
      # both on localhost where the value must be empty. Unset here, the API
      # sets a host-only cookie on api.…, the console never receives it, and
      # every staff sign-in appears to succeed and then immediately reports the
      # session as expired.
      STAFF_COOKIE_DOMAIN: ${STAFF_COOKIE_DOMAIN}

      # Two limits, because the font upload is genuinely different — see the
      # note in the Caddyfile. Caddy refuses an oversized body before it is
      # buffered; these are the API's own enforcement of the same rule.
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-1mb}
      MAX_FONT_BODY_SIZE: ${MAX_FONT_BODY_SIZE:-3mb}

      # Certificate delivery (P8-03). These were configurable in the example
      # env and read by the API, and were not passed here — so the worker ran
      # on its defaults whatever the deployment said.
      CERTIFICATE_DELIVERY_ENABLED: ${CERTIFICATE_DELIVERY_ENABLED:-yes}
      CERTIFICATE_DELIVERY_INTERVAL_SEC: ${CERTIFICATE_DELIVERY_INTERVAL_SEC:-300}
      CERTIFICATE_DELIVERY_BATCH_SIZE: ${CERTIFICATE_DELIVERY_BATCH_SIZE:-25}

      # Encryption at rest for the VNR password and SMTP credentials. Without
      # it the API refuses to start in production, by design — there is no
      # plaintext fallback (shared/secret-cipher.ts).
      SECRETS_KMS_KEY: ${SECRETS_KMS_KEY:?SECRETS_KMS_KEY is required — openssl rand -base64 32}

      # Where the download link in a certificate email points. Empty means a
      # broken link in the one email a learner is told to expect.
      PORTAL_BASE_URL: ${PORTAL_BASE_URL}

      # An EIV submission approaching its statutory deadline raises an alert
      # rather than failing silently (CLAUDE.md §4 invariant 8). Unset, the
      # alert has nowhere to go.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

      EIV_BASE_URL: ${EIV_BASE_URL}
      EIV_ALLOW_LIVE: ${EIV_ALLOW_LIVE}
      # Exactly one submitter, whatever the API scales to. Two workers racing
      # for the same submission is a duplicate Punktemeldung, which cannot be
      # withdrawn after the correction window closes.
      EIV_WORKER_ENABLED: ${EIV_WORKER_ENABLED:-yes}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-yes}
      S3_URL_TTL_SEC: ${S3_URL_TTL_SEC:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # `/health` is public precisely so a probe can reach it without a token.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [internal]

  # The console and the portal are configured at **runtime**, not at build time
  # (P16-02). Their entrypoint writes /config.js from these before nginx starts,
  # so one image runs in any environment and the API base can never drift from
  # the API_DOMAIN Caddy is actually serving — deploy.sh derives both from the
  # same BASE_DOMAIN.
  #
  # A missing DS_API_BASE stops the container rather than producing a console
  # that loads and then fails every request.
  admin:
    image: ${IMAGE_ADMIN}
    restart: unless-stopped
    environment:
      DS_API_BASE: ${DS_ADMIN_API_BASE}
      DS_PROJECT_SLUG: ${DS_ADMIN_PROJECT_SLUG}
    networks: [internal]

  # The platform's own learner frontend. A host adapter like the WordPress
  # plugin, not a privileged one (ADR-0007): it holds no credential the API
  # trusts, and serves its own copy of the widget bundle so a learner's browser
  # makes no cross-origin request to load it.
  portal:
    image: ${IMAGE_PORTAL}
    restart: unless-stopped
    environment:
      DS_API_BASE: ${DS_PORTAL_API_BASE}
      DS_PROJECT_SLUG: ${DS_PORTAL_PROJECT_SLUG}
      # The portal's own Keycloak client — a learner-facing public client, not
      # the console's. The console has not spoken to Keycloak since P12-06
      # (ADR-0012), which is why only this service gets these three.
      DS_KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      DS_KEYCLOAK_CLIENT_ID: ${PORTAL_KEYCLOAK_CLIENT_ID}
      DS_REDIRECT_URI: ${DS_PORTAL_REDIRECT_URI}
    networks: [internal]

  widget:
    image: ${IMAGE_WIDGET}
    restart: unless-stopped
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by init-roles.sql via psql's `\getenv`. Without these the login
      # roles would be created with the development passwords that are in the
      # repository, and the API would fail to connect with the ones from the
      # deployment secrets — which somebody would then "fix" the wrong way.
      DS_MIGRATOR_PASSWORD: ${DS_MIGRATOR_PASSWORD}
      DS_APP_PASSWORD: ${DS_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates ds_migrator, ds_app and ds_binding_resolver. ds_app is NOT
      # BYPASSRLS — the whole of ADR-0002 depends on that.
      - ../postgres/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters and cache only — nothing here needs to survive a
    # restart, and an AOF on a small host is cost without benefit.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks: [internal]

networks:
  # Only Caddy is on both. Nothing else can be reached from outside the host.
  edge:
  internal:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
