# Serving the widget bundle cross-origin (P10-04).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The bundle is fetched by a <script type="module"> on somebody else's
    # origin, so it needs CORS. `*` is correct here and is not a weakening:
    # this is public JavaScript with no credentials and no cookies. The
    # sensitive surface is the API, which has its own, much narrower policy.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The filename is stable (`ds-lms.js`), so it cannot be cached immutably —
    # a fix has to reach a customer's visitors without them clearing anything.
    # Five minutes plus revalidation keeps that quick without hammering.
    location / {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    gzip on;
    gzip_types application/javascript;
}
