# Serving the widget bundle cross-origin (P10-04).
#
# ## The nginx rule this file is shaped around
#
# `add_header` is **not** additive across configuration levels. nginx inherits
# headers from the enclosing block *only if the current block declares none of
# its own* — a single `add_header` inside a `location` silently discards every
# header set on the `server`.
#
# The first version of this file set the CORS and security headers on the
# `server` and then set `Cache-Control` inside `location /`. All three were
# dropped for exactly the requests that matter: the bundle went out with no
# `Access-Control-Allow-Origin`, so a browser on the customer's origin refused
# to execute it, and with no `X-Content-Type-Options`. nginx returned 200, the
# file arrived, and the widget simply never appeared.
#
# So every header is declared in the one block that serves anything, and there
# is deliberately no `add_header` at server level — a reader would have no way
# to tell whether it was in effect.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        # The bundle is fetched by a <script type="module"> on somebody else's
        # origin, so it needs CORS. `*` is correct here and is not a weakening:
        # this is public JavaScript with no credentials and no cookies. The
        # sensitive surface is the API, which has its own, much narrower policy.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;

        # The filename is stable (`ds-lms.js`), so it cannot be cached
        # immutably — a fix has to reach a customer's visitors without them
        # clearing anything. Five minutes plus revalidation keeps that quick
        # without hammering.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    gzip on;
    gzip_types application/javascript;
}
