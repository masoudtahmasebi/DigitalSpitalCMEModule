# Serving the admin console (P10-04).
#
# Two things matter here and the rest is boilerplate.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 1. A single-page app owns its own routes. Any path that is not a real
    #    file has to return index.html, or a reload on /courses/adhs is a 404
    #    — and the OIDC redirect lands on a path the server has never heard of.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Hashed assets are immutable; index.html must never be cached, or a
    #    deploy leaves browsers loading an old bundle that references assets
    #    that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The console holds a bearer token in memory; a framed copy of it is a
    # clickjacking target.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
