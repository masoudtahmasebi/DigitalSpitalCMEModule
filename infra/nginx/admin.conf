# Serving the admin console (P10-04).
#
# ## `add_header` does not accumulate
#
# nginx inherits headers from an enclosing block **only if the current block
# declares none of its own**. One `add_header` inside a `location` discards
# everything set on the `server`.
#
# This file used to set the security headers on the `server` and `Cache-Control`
# inside two `location` blocks — so `/assets/…` and `/index.html`, which is
# every request that returns anything, went out with no `X-Frame-Options`, no
# `nosniff` and no `Referrer-Policy`. In the deployed topology Caddy adds them
# again at the edge, so the console was never actually exposed; but a defence
# that works only because something in front repeats it is not a defence, and
# this image is meant to be runnable on its own.
#
# Hence one `location` and a `map` for the one header that varies. The
# alternative — repeating four `add_header` lines in three blocks — is how the
# next one gets forgotten.

map $uri $ds_cache_control {
    # Hashed asset filenames change whenever their content does, so they can be
    # cached for a year. `index.html` must never be, or a deploy leaves
    # browsers loading an old bundle that references assets that are gone.
    default    "no-store, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        # A single-page app owns its own routes. Any path that is not a real
        # file has to return index.html, or a reload on /courses/adhs is a 404
        # — and the OIDC redirect lands on a path nginx has never heard of.
        try_files $uri $uri/ /index.html;

        # The console holds a bearer token in memory; a framed copy of it is a
        # clickjacking target.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $ds_cache_control always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
