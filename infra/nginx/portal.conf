# Serving the standalone portal (P11-01).
#
# ## `add_header` does not accumulate
#
# nginx inherits headers from an enclosing block **only if the current block
# declares none of its own** — one `add_header` inside a `location` discards
# everything set on the `server`. That defect shipped once in `admin.conf` and
# is the reason both files now declare every header inside a single `location`
# and use a `map` for the one that varies.
#
# ## Three cache classes, not two
#
# The portal serves one file the admin console does not: `ds-lms.js`, the widget
# bundle, copied in by `scripts/bundle-widget.mjs`. Its name carries no content
# hash — the WordPress plugin references it by a fixed name and both hosts must
# load the same artifact — so it cannot be cached like a hashed asset. But it is
# 300 kB and does not change between deploys, so `no-store` would re-download it
# on every page view. `no-cache` is the right middle: the browser keeps it and
# revalidates, and nginx's ETag turns that into a 304.

map $uri $ds_cache_control {
    # index.html must never be cached, or a deploy leaves browsers loading an
    # old bundle that references assets that are gone.
    default        "no-store, must-revalidate";

    # Hashed filenames change whenever their content does.
    ~^/assets/     "public, max-age=31536000, immutable";

    # Unhashed but stable: keep it, but check every time.
    ~^/ds-lms\.js$ "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        # A single-page app owns its own routes. Any path that is not a real
        # file has to return index.html, or a reload on /kurs/adhs-akademie is
        # a 404 — and the OIDC redirect lands on a path nginx never heard of.
        try_files $uri $uri/ /index.html;

        # The portal holds a learner's bearer token in memory; a framed copy of
        # it is a clickjacking target. Note this is the opposite of the widget,
        # which exists to be embedded in somebody else's page — see widget.conf.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $ds_cache_control always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
