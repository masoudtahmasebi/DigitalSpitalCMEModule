            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: adminDeleteModule
      summary: Delete a module
      description: |
        Refused with 409 if any learner record points into it. That row is the
        evidence behind a CME point that may already have been reported to an
        Ärztekammer.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/modules/{id}/chapters:
    post:
      tags: [admin]
      operationId: adminCreateChapter
      summary: Append a chapter
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
