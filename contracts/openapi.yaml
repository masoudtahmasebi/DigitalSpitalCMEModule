# The API contract (P0-06 / P2-06). Written before implementation for new
# surface, and the single source the SDK generates from — CI fails if
# packages/sdk/src/generated drifts from this file.
#
# Scope: exactly what the API implements. Endpoints land here first, then in
# code; nothing lands here speculatively. The learner-progress, quiz,
# evaluation and certificate paths arrive with their phases (P3–P8).
#
# Conventions (CLAUDE.md §5):
# - Errors are RFC 7807 problem documents, application/problem+json.
# - Percentages are integers 0–100. Durations are integer seconds.
# - Timestamps are ISO 8601 UTC. German local time is presentation only.
# - 404 for "not visible in this tenant" — existence is never disclosed.

openapi: 3.1.0

info:
  title: DS Education Platform API
  version: 0.1.0
  description: |
    Headless learner API for the DS Education Platform (CME).

    Every request carries two credentials:
    - a **bearer token**, validated server-side against the project's own
      Keycloak realm (signature, issuer, audience, expiry — ADR-0003), and
    - the **X-DS-Project header**, identifying which host surface is calling
      (ADR-0007). The project binding decides the Keycloak realm and pins the
      tenant; a token from another realm is rejected regardless of validity.

    All compliance decisions are server-side. The client renders; it is never
    the source of truth for anything affecting a CME point.

servers:
  - url: /
    description: Relative to wherever the API is deployed.

security:
  - bearerAuth: []

tags:
  - name: health
  - name: catalog
  - name: learning
  - name: assessment
  - name: completion
  - name: certificate
  - name: admin

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness/readiness probe
      description: Public — a load balancer cannot present a bearer token.
      security: []
      responses:
        "200":
          description: The API and its database are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /branding:
    get:
      tags: [catalog]
      operationId: getBranding
      summary: White-label branding for a project
      description: |
        Logo, colours and typeface for the project named in `X-DS-Project`.

        **Public**, and one of only two routes that are. The widget renders
        branded loading, session-expired and misconfiguration states before it
        holds a token, and the admin console's login screen never holds one.

        What it discloses is what the customer's public website already shows
        every visitor. It returns no id, no Keycloak binding and no SMTP
        settings even though those live on the same row — enforced in SQL by a
        narrow SECURITY DEFINER function, not by this handler.

        An unknown slug returns **empty branding with 200**, identical to a
        known-but-unbranded project: a 404 here would be a project-slug oracle
        (ADR-0007).

        `fontFamily` is a CSS font stack, never a URL. The platform loads no
        third-party font — a German healthcare site transmitting visitor IPs to
        a font CDN is a GDPR exposure, not a convenience. When the customer has
        uploaded their own typeface, `fontFamilyName` and `fontVersion` name it
        and the file itself comes from `GET /branding/font` on this same origin.
      security: []
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      responses:
        "200":
          description: The branding, possibly empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }

  /branding/font:
    get:
      tags: [catalog]
      operationId: getBrandingFont
      summary: The project's uploaded webfont
      description: |
        The font file for the project named in `X-DS-Project`, as uploaded by a
        customer admin.

        **Public, and that is the GDPR position.** Serving the typeface from
        this origin means a learner's browser never contacts a font CDN, no IP
        address reaches a third party, and there is nothing here for a consent
        banner or a processing record to cover.

        `woff2` or `woff` only, and which one is decided by the file's own
        container signature rather than by anything the uploader declared. The
        response is immutable and cached for a year; callers append
        `?v=<fontVersion>` from `GET /branding`, so replacing a font changes
        the URL rather than needing a purge.

        A project with no font — or no such project — returns 404. A font is
        evidence of nothing, so this one does not need ADR-0007's silence.
      security: []
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: project
          in: query
          required: false
          description: |
            The project slug, for callers that cannot set a header. This is the
            one route a **browser** requests on its own behalf — from an
            `@font-face` rule, where the CSS engine sends no custom headers and
            there is no hook to add one. The header wins when both are given.
          schema: { type: string }
        - name: v
          in: query
          required: false
          description: Cache-busting token; ignored by the server.
          schema: { type: string }
      responses:
        "200":
          description: The font file.
          content:
            font/woff2:
              schema: { type: string, format: binary }
            font/woff:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /courses:
    get:
      tags: [catalog]
      operationId: listCourses
      summary: List the tenant's courses
      description: |
        Backs the course list screen: the delivery-type tabs, the Thema and
        Altersgruppe filters with their facet counts, pagination, and the card
        metadata line ("5 CME Punkte | 5 Module | 2 Stunden 30 Minuten").
        Rows are scoped to the caller's tenant by PostgreSQL RLS (ADR-0002).
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: thema
          in: query
          schema: { type: string }
        - name: altersgruppe
          in: query
          schema: { type: string }
        - name: deliveryType
          in: query
          description: |
            A comma-separated **set** of delivery types, e.g. `live,praesenz`.

            The catalogue's tabs are functions rather than delivery types — the
            layout draws `On Demand` and `Weitere` — so one tab has to be able
            to name several. Comma-separated in a single parameter rather than
            the parameter repeated, because repeated query parameters have
            several incompatible serialisations and none of these values can
            contain a comma.

            Omitted means every delivery type.
          schema:
            type: string
            pattern: "^(on_demand|live|praesenz)(,(on_demand|live|praesenz))*$"
          example: "live,praesenz"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: One page of courses plus facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseListResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}:
    get:
      tags: [catalog]
      operationId: getCourseBySlug
      summary: One course with its full module tree
      description: |
        The whole tree in one response — modules, chapters, contents, experts —
        so the detail view does not waterfall. Quiz contents carry no options
        and no answers here; the assessment endpoints (P4) own those, and the
        answer key never appears in any learner-facing shape.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The course detail tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /courses/{slug}/enrolment:
    put:
      tags: [learning]
      operationId: enrol
      summary: Start (or resume) this course
      description: |
        Idempotent: PUT again and the existing enrolment comes back unchanged.
        On first call the course's compliance settings — required watch
        percentage, pass threshold, CME points, VNR — are **snapshotted onto
        the enrolment**, so a later edit to the course record cannot
        retroactively invalidate work already done (P3-01).
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The enrolment state, existing or newly created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    get:
      tags: [learning]
      operationId: getEnrolment
      summary: Progress, gating and resume point
      description: |
        The single resource the player screen renders from: the "Ihr
        Fortschritt — X von Y" ring, each module's and chapter's lock state,
        the resume target for "Fortbildung fortsetzen", and the outstanding
        conditions still standing between the learner and their CME points.

        Every value here is computed server-side from stored progress
        (`@ds/domain`); the client never supplies a percentage or a lock state.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The current enrolment state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No enrolment yet, or the course is not visible.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /courses/{slug}/contents/{contentId}:
    get:
      tags: [learning]
      operationId: getLesson
      summary: Open a lesson
      description: |
        The lesson payload — the video URL or the text body — served **only
        after the sequence gate agrees**.

        This is why `CourseDetail` carries no `videoUrl`: a browse response
        listing every video URL in the course would make the padlock on a later
        chapter decorative, since the URL would already be readable while the
        first chapter is unfinished. Here the gate is checked before anything
        is produced, by the same `requireReachableContent` the progress and
        quiz endpoints use.

        A quiz is not openable here — it has its own endpoint whose response
        shape cannot carry a correct answer.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: The lesson.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonContent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            The sequence gate refuses: an earlier chapter is still outstanding.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}/contents/{contentId}/progress:
    post:
      tags: [learning]
      operationId: recordProgress
      summary: Report watched intervals for a video
      description: |
        The client reports **which intervals it played**, never a percentage.
        The server merges them into the stored union and recomputes coverage
        (`CLAUDE.md` §4 invariant 5) — a maximum-position implementation would
        make the gate skippable by dragging the scrub bar.

        Segments claiming more playback than wall-clock time elapsed since the
        last report are rejected and named in `rejected`, so tampering is
        visible rather than silently discarded. The response always carries
        the server's own recomputed figures.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressReport" }
      responses:
        "200":
          description: Progress after merging the accepted intervals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            The content is locked — everything before it is not yet complete.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}/contents/{contentId}/quiz:
    get:
      tags: [assessment]
      operationId: getQuiz
      summary: The Lernerfolgskontrolle questions
      description: |
        Questions and options with **no correctness marker of any kind** — the
        shape has nowhere to put one (P4-01). Scoring happens exclusively
        server-side.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: The quiz, without answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quiz" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Locked until the preceding content is complete.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [assessment]
      operationId: submitQuiz
      summary: Submit an attempt
      description: |
        Scored server-side against the enrolment's snapshotted pass threshold.
        The response reports the score and pass/fail; per-question correctness
        is recorded in the attempt but only returned when the course sets
        `revealCorrectAnswers`, which a CME-certified course never does.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizSubmission" }
      responses:
        "200":
          description: The scored attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizAttemptResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Locked, or the attempt limit is exhausted.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}/materials:
    get:
      tags: [learning]
      operationId: getMaterials
      summary: The Mediathek — downloadable material, grouped by module
      description: |
        Backs the Mediathek tab. Material belonging to a module the learner has
        not finished is returned **locked and without its download URL** — the
        padlocked section in the layout, with "Wird nach Abschluss der Module
        freigeschaltet".

        Withholding the URL rather than only a flag is the point: a `locked:
        true` the client is trusted to honour is not a gate, it is a
        suggestion.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: Material grouped by module, with lock state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialLibrary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /courses/{slug}/evaluation:
    get:
      tags: [completion]
      operationId: getEvaluation
      summary: The evaluation questionnaire
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The questionnaire and whether it is already submitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [completion]
      operationId: submitEvaluation
      summary: Submit the evaluation
      description: |
        Required for completion (the Anerkennungsbescheid makes it a condition
        of the Punktemeldung). Free-text answers are personal data and never
        reach a log (ADR-0004).
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationSubmission" }
      responses:
        "200":
          description: Enrolment state after recording the evaluation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already submitted.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}/certificate:
    get:
      tags: [certificate]
      operationId: getCertificate
      summary: The certificate's fields
      description: |
        The assembled Teilnahmebescheinigung data, for rendering a preview
        before download. Available only once the course is complete.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The certificate data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not enrolled, or the course is not complete.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /courses/{slug}/certificate/pdf:
    get:
      tags: [certificate]
      operationId: downloadCertificate
      summary: Download the Teilnahmebescheinigung as a PDF
      description: |
        Renders the ÄKWL Muster: participant, course, both VNR barcodes
        (Code 39 and Datamatrix), the participation date, the creditability
        sentence, and the stamp and signature of the course's Wissenschaftliche
        Leitung.

        Refuses with 409 if the course has no stamp or signature configured —
        the Bescheid makes a certificate without them invalid, and issuing an
        invalid-looking document to a physician who has earned their points is
        worse than telling the admin their course is incomplete.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The certificate.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Not complete, or the course is missing its signing assets.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /admin/courses:
    get:
      tags: [admin]
      operationId: adminListCourses
      summary: The tenant's courses, with their authoring status
      description: |
        Scoped by PostgreSQL RLS to the caller's customer (ADR-0002), like
        everything else. `certificateReady` and `missingCertificateFields` are
        computed with the **same rule the certificate endpoint enforces**, so
        the console cannot report a course as ready that would then refuse to
        issue.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      responses:
        "200":
          description: The courses this admin may see.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCourseSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminCreateCourse
      summary: Create a course
      description: |
        Deliberately minimal. Everything a certificate needs — VNR, points,
        Veranstalter, the Wissenschaftliche Leitung — is set afterwards on the
        settings screen, which already refuses a pass threshold below the
        accredited minimum and reports which certificate fields are missing.
        Duplicating those rules into a creation form would be a second place to
        get them wrong.
      parameters: [{ $ref: "#/components/parameters/ProjectHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseCreate" }
      responses:
        "201":
          description: The new course's (empty) structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/courses/{slug}:
    get:
      tags: [admin]
      operationId: adminGetCourse
      summary: One course's settings
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The course.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCourseDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [admin]
      operationId: adminUpdateCourse
      summary: Edit a course's compliance and certificate fields
      description: |
        Every field is optional — an absent field means "leave alone", so
        editing the issue place does not require resending the VNR password.

        **Lowering `passThresholdPercent` below the accredited minimum is
        refused** unless `acknowledgeAccreditationRisk` is true. The 70 %
        threshold is a condition of the Anerkennungsbescheid, not a difficulty
        setting: below it the Ärztekammer does not credit the points, so every
        point awarded afterwards is unearned. The check is server-side because
        a confirmation a client can skip is not a confirmation.

        Changes never apply retroactively — an enrolment carries the thresholds
        snapshotted when it was created (P3-01).
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCourseUpdate" }
      responses:
        "200":
          description: The updated course.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCourseDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The pass threshold would fall below the accredited minimum and the
            risk was not acknowledged.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

    delete:
      tags: [admin]
      operationId: adminDeleteCourse
      summary: Delete an empty course
      description: |
        Refused with 409 while it still contains modules, and permanently
        refused once anybody has enrolled — an enrolment is the record behind a
        CME point that may already have been reported to an Ärztekammer, and
        removing it would leave the point credited with nothing to show what
        earned it.

        Enrolments and not watch progress: a learner who enrolled and never
        pressed play has no progress rows and still has a record worth keeping.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/courses/{slug}/certificate-assets:
    put:
      tags: [admin]
      operationId: adminSetCertificateAssets
      summary: Upload the stamp and signature of the Wissenschaftliche Leitung
      description: |
        The Bescheid requires the Teilnahmebescheinigung to carry the stamp of,
        and be signed by, the Wissenschaftliche Leitung — and those belong to
        the **course**, supplied by whoever creates it, not to the platform.

        PUT because it replaces: a certificate carries one stamp, so "add
        another" has no meaning. Base64 in JSON rather than multipart — these
        are a few kilobytes, and a multipart parser would add a file-upload
        surface for one endpoint.

        PNG and JPEG only, 512 KB each, and the **magic bytes are checked
        rather than the declared type**. SVG is deliberately excluded: it is
        executable markup, and this asset is customer-uploaded and rendered by
        the server into a PDF.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateAssetUpload" }
      responses:
        "200":
          description: The updated course.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCourseDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/branding/font:
    get:
      tags: [admin]
      operationId: adminGetFont
      summary: What font the project has on file
      description: |
        Metadata only: the family name, the version, and the size in bytes.
        Never the file — the console previews it by pointing an `@font-face` at
        `GET /branding/font`, exactly as a learner's browser does. A second code
        path to the same bytes would mean the one that matters is the one
        nobody tested.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      responses:
        "200":
          description: The stored font, or nulls if there is none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FontState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: adminSetFont
      summary: Upload the project's webfont
      description: |
        White-labelling: the platform is sold to more than one customer, so the
        typeface is data on the project, not a constant in a stylesheet
        (P10-08).

        `woff2` or `woff`, up to 2 MB, base64 in JSON. **The bytes decide the
        format** — the container signature is read and the file must be exactly
        as long as its own header claims, which rejects a font with a payload
        appended to it. The declared `fontMime` is only cross-checked against
        that; it can permit nothing.

        **SVG fonts are impossible.** An SVG font is executable markup, and this
        file is served from the API's own origin to a page holding a bearer
        token.

        `fontFamilyName` is emitted inside an `@font-face` block, so it is
        restricted to letters, digits, spaces, hyphen and underscore in
        `@ds/domain`, in this schema, and in a database CHECK.

        Which project is written comes from `X-DS-Project`, and the write runs
        under RLS: a slug belonging to another customer updates nothing and
        returns 404.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FontUpload" }
      responses:
        "200":
          description: The stored font.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FontState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: adminClearFont
      summary: Remove the project's webfont
      description: |
        Learners fall back to the configured `fontFamily` stack, which is always
        valid — a project without an uploaded font is the normal state, not a
        degraded one.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      responses:
        "200":
          description: The now-empty font state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FontState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Authoring (P9-02, P9-04, P9-05)
  #
  # Every mutating route returns the whole structure it changed. An authoring
  # screen re-renders after each edit and the edit is rarely local — creating a
  # module appends it, deleting one renumbers what follows, a reorder moves
  # several things at once. Returning the tree makes the client's state the
  # server's answer rather than a local edit that has to agree with it.
  # ---------------------------------------------------------------------------

  /admin/learners:
    get:
      tags: [admin]
      operationId: adminListLearners
      summary: Every enrolment in this tenant, with its progress
      description: |
        The per-learner progress view. Carries a **masked** EFN — the last four
        digits — and never the whole value: an operator confirming they have the
        right person needs to recognise it, not to read it (ADR-0004).
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: course
          in: query
          required: false
          description: Restrict to one course's slug. Absent means all courses.
          schema: { type: string }
      responses:
        "200":
          description: The enrolments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearnerRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/participants:
    get:
      tags: [admin]
      operationId: adminListParticipantAccounts
      summary: The people who learn with this customer
      description: |
        Deliberately **not** the same list as `/admin/learners`. That one is a
        row per enrolment — a person per course — and can only ever show
        somebody who has already started something. This is a row per *person*,
        including one created two minutes ago who has enrolled in nothing,
        which is exactly when an administrator most needs to find them.

        Scoped by `user_customers` under RLS: a person with no membership in the
        caller's customer is not listed, whatever else is true of them.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: q
          in: query
          required: false
          description: Substring of the name or e-mail address. Absent means all.
          schema: { type: string }
      responses:
        "200":
          description: The participants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParticipantAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [admin]
      operationId: adminCreateParticipant
      summary: Create a participant, and receive their one-time password
      description: |
        The customer is taken from the authenticated session, never from the
        body — accepting it would let one edited request plant a participant
        inside another tenant.

        **The response carries the only copy of the password.** It is stored as
        an Argon2id hash and no endpoint returns it again; a caller that
        discards this response has to reset it rather than look it up. The
        account is created with `mustChangePassword` set, because a password an
        administrator read off a screen is a password an administrator knows.

        Not self-service: the caller is an authenticated member of staff.
        `CLAUDE.md` §3 defers open registration and this does not undo it.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                # Both required. A Teilnahmebescheinigung prints a name and
                # cannot be issued without one, so a nameless participant is
                # somebody who finishes a course and cannot be given the point.
                firstName: { type: string, minLength: 1, maxLength: 100 }
                lastName: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201":
          description: Created. The password is shown here and nowhere else.
          content:
            application/json:
              schema:
                type: object
                required: [userId, temporaryPassword]
                properties:
                  userId: { type: string, format: uuid }
                  temporaryPassword: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/participants/{userId}/reset-password:
    post:
      tags: [admin]
      operationId: adminResetParticipantPassword
      summary: Issue a new temporary password and end every session
      description: |
        Both halves matter. Replacing the password while leaving a twelve-hour
        session open means a compromised account stays usable for the rest of
        the day, which is the window this call exists to close.

        A participant of another customer answers **404**, not 403 — a 403
        would confirm the id names somebody, turning this into an oracle for
        enumerating another tenant's participants one uuid at a time.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The new password, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [temporaryPassword]
                properties:
                  temporaryPassword: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        # A federated participant: their password lives at the customer's
        # Keycloak, and pretending we could reset it would be a button that
        # silently does nothing.
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/participants/{userId}/disabled:
    post:
      tags: [admin]
      operationId: adminSetParticipantDisabled
      summary: Stop, or restore, a participant account
      description: |
        Distinct from the automatic lockout, which expires on its own. This is a
        deliberate administrative act and nothing but another one clears it.

        Disabling also revokes every live session. Re-enabling does **not**
        restore them — those are precisely the sessions the disable was aimed
        at.

        The account is never deleted: enrolments, certificates and EIV
        submissions all hang off the person, and none of them may lose their
        owner because somebody left a job.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        "204": { description: Applied. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/participants/merge/preview:
    post:
      tags: [admin]
      operationId: adminPreviewParticipantMerge
      summary: What merging two credentials onto one person would do
      description: |
        Reads only. Always called before `adminMergeParticipants`, because a
        merge cannot be undone in any way a physician would accept and the
        operator has to be shown both sides before confirming.

        `super_admin` only. A merge routinely spans two customers — a MEDICE
        learner given a DS portal login is the case P21-05 was written for — and
        a customer-scoped administrator is correctly unable to see the other
        side, so they would be confirming against a record they cannot read.

        The response says **whether** each side has an EFN, never which: no
        endpoint returns an EFN (ADR-0004), and the operator does not need the
        digits to decide.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParticipantMergeRequest" }
      responses:
        "201":
          description: What the merge would move, and whether it is allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantMergePreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/participants/merge:
    post:
      tags: [admin]
      operationId: adminMergeParticipants
      summary: Merge two credentials onto one person — irreversible
      description: |
        Moves every credential, membership, grant, enrolment and EFN from the
        source person onto the target, ends every session on both sides, and
        deletes the now-empty source person. Written to `admin_audit_log` in the
        same transaction, because an audit row for a merge that rolled back
        would send somebody looking for records that never moved.

        Refused with `409` when the merge would have to **choose** something:
        two different EFNs on file, or a course both sides are enrolled on.
        Neither is a rule this platform can settle on a physician's behalf.

        `confirm` must equal `targetUserId`. An irreversible operation should
        take two decisions, and typing the id back is the cheapest second one
        that cannot be made by a mis-click.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ParticipantMergeRequest"
                - type: object
                  required: [confirm]
                  properties:
                    confirm:
                      type: string
                      description: Must equal `targetUserId`.
      responses:
        "204": { description: Merged. }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/participant/sign-in:
    post:
      tags: [auth]
      operationId: participantSignIn
      summary: Sign a participant in with an e-mail and a password
      description: |
        Only for a project whose `identity_provider` is `local`. One whose
        learners are federated is refused here with the same 401 as a wrong
        password — telling a caller "this customer uses a different identity
        provider" describes their infrastructure to anybody who asks.

        On success the session arrives as an **httpOnly cookie**, never in the
        body: a token script can read is a token an XSS bug can exfiltrate.

        Every failure — wrong address, wrong password, locked account, disabled
        account, federated project, malformed body — is the same 401 with the
        same German message. Any distinction is an account-enumeration oracle,
        and the list it would build is a list of physicians.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Signed in. The session is in the `Set-Cookie` header.
          content:
            application/json:
              schema:
                type: object
                required: [mustChangePassword]
                properties:
                  mustChangePassword:
                    type: boolean
                    description: |
                      The participant has not yet chosen their own password —
                      an administrator created or reset it. The portal shows
                      the change screen and refuses to go further until it is
                      done. Re-derived on every `GET me`, so a reload cannot
                      skip it.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429":
          description: |
            Too many attempts. The tightest limit in the platform — this is the
            only unauthenticated write on the learner plane.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /auth/participant/sign-out:
    post:
      tags: [auth]
      operationId: participantSignOut
      summary: End a participant session
      description: |
        Revokes the row, not merely the cookie. A sign-out that only cleared the
        browser would leave a live session behind for anybody who had captured
        it — which on a shared clinic computer is the case it exists for.

        Public, and succeeds whether or not a session was found: a client asking
        to be signed out should end up signed out, not told it already was.
      responses:
        "204": { description: Signed out, and the cookie cleared. }

  /auth/participant/me:
    get:
      tags: [auth]
      operationId: getParticipantSession
      summary: Who the caller is, and whether they owe a password change
      description: |
        The portal's "am I still signed in?" on load. The session cookie is
        `httpOnly`, so a round trip is the only way to ask.

        `mustChangePassword` is re-derived from the database here rather than
        remembered from the sign-in response, and that is what makes the
        requirement a requirement: otherwise a participant shown the change
        screen could press F5 and land in the catalogue, because the session is
        already perfectly valid.

        Omitted entirely for a federated participant — there is no local
        password, and reporting `false` would imply there is one and it is fine.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                type: object
                required: [userId, customerId, role]
                properties:
                  userId: { type: string, format: uuid }
                  customerId: { type: string, format: uuid }
                  role: { type: string }
                  mustChangePassword: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/participant/password-reset:
    post:
      tags: [auth]
      operationId: requestParticipantPasswordReset
      summary: Ask for a password-reset link
      description: |
        **Answers 202 in every case** — an unknown address, a project whose
        participants sign in through a customer's Keycloak, a project with no
        SMTP settings, and a link that actually went out.

        That is not politeness. Asking whether a given physician has an account
        with a named pharmaceutical company is close enough to health-adjacent
        information about a named person that this form must not answer it. The
        service behaves the same way on its side: no token is minted when there
        is nowhere to send one, so there is no difference in work done either.

        The link points at the tenant's own path, built from the request's
        `Origin` when the deployment allows it and from the first configured
        origin otherwise — **never** from the body. A reset flow that lets the
        caller name the link's host delivers a real token to a real inbox
        pointing at a page the attacker controls.

        Rate-limited per IP rather than per address: a per-address limit would
        itself answer "is this address being asked about a lot".
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 320 }
      responses:
        "202": { description: Accepted. Says nothing about whether an account exists. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/participant/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmParticipantPasswordReset
      summary: Spend a reset link and set a password
      description: |
        Public, because the token **is** the credential — whoever holds it has
        by definition no session.

        The password policy is checked before the token is spent, so a rejected
        password does not consume a single-use link and strand somebody.

        One answer for a link that expired, one already spent and one that never
        existed: a distinguishable "already used" would confirm to somebody
        holding a forwarded link that it was once real. The lifetime is
        `RESET_VALID_MINUTES` (60) and it is enforced on redemption — see
        P39-01, which is the record of what happens when it is not.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, maxLength: 512 }
                newPassword: { type: string, maxLength: 256 }
      responses:
        "204": { description: Set. The link is spent. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/participant/password:
    post:
      tags: [auth]
      operationId: changeParticipantPassword
      summary: A participant chooses their own password
      description: |
        Requires the **current** password even though the caller already holds a
        valid session. A session is a bearer credential: without this, a cookie
        captured on a shared clinic computer would be enough to lock a physician
        out of their own CME record.

        The policy is the platform's single one (`checkPassword`): at least 12
        code points, not containing the account's own name or address.

        Does not revoke the caller's other sessions, deliberately — this runs
        immediately after a sign-in that reported `mustChangePassword`, and
        ending that session would sign somebody out of a change they just
        completed.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, maxLength: 256 }
                newPassword: { type: string, maxLength: 256 }
      responses:
        "204": { description: Changed. }
        # One answer for a wrong current password, a disabled account and a
        # federated one alike — none is something the client can usefully act
        # on differently.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/courses/{slug}/eiv/event:
    get:
      tags: [admin]
      operationId: adminDescribeEivEvent
      summary: What the Ärztekammer holds about this course's VNR
      description: |
        Asks EIV directly, using the course's own VNR and password. Read-only —
        it creates no Punktemeldung and changes nothing.

        This exists because of one status code. EIV refuses a participation
        whose `teilnahmedatum` falls outside the accredited period with a 406,
        and for an on-demand Fortbildung taken across a year that is potentially
        every completion. The period is knowable before the first physician
        starts; without this endpoint it was discovered after one had been shown
        a completed Zertifizierung.

        `locked` is the same question one step further on: the Kammer can close
        an event to further reporting, and a course whose event is closed will
        never report another point.

        `502` when EIV itself refused or could not be reached — the reason is in
        the problem detail, and never a credential.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: What the authority holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EivEvent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
        "502": { $ref: "#/components/responses/BadGateway" }

  /admin/courses/{slug}/eiv/reported:
    get:
      tags: [admin]
      operationId: adminReconcileEiv
      summary: Compare what we sent with what the Ärztekammer holds
      description: |
        `eiv_submissions` records what this platform *sent*. This asks EIV what
        it *holds*, and reports the difference.

        A disagreement is the one failure an append-only log of our own attempts
        cannot detect: a request that arrived after we gave up retrying, or a
        withdrawal somebody performed in EIV's own web application. Both leave
        our record and the Kammer's record saying different things about a
        physician's CME points.

        The EFN is matched but never returned in full — `efnMasked` carries the
        last four digits only, which is enough to reconcile a row with a person
        an operator is already looking at and not enough to be a disclosure.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EivReconciliation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /admin/learners/{enrolmentId}/eiv:
    post:
      tags: [admin]
      operationId: adminRequeueEivSubmission
      summary: Put an abandoned Punktemeldung back in the queue
      description: |
        For a submission the worker gave up on — attempts exhausted, a business
        refusal an operator has since fixed, a missing VNR that has now been
        entered. It resets the attempt counter and lets the ordinary worker try
        again; it does **not** submit inline, because the retry budget, the
        deadline arithmetic and the permanent-failure classification live in
        `@ds/domain` and a second path would be a second opinion on them.

        Refused with 409 once the correction window has closed: after that no
        electronic submission for that VNR is possible at all, and offering a
        button that cannot work would be worse than not offering one.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Requeued. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

    delete:
      tags: [admin]
      operationId: adminWithdrawEivSubmission
      summary: Withdraw a Punktemeldung already reported
      description: |
        Sends EIV the same participation with both point flags false and
        `punkte_referent` zero. **Not a deletion**: EIV keeps the record and the
        Vorgang stays traceable, which is the right shape for a CME record — a
        physician whose points vanished without trace would have no way to find
        out why.

        Inline rather than queued, because a withdrawal is a human's decision
        taken at a moment they are accountable for, and the 7-day correction
        window may be hours from closing.

        Refused with 409 outside that window: EIV will not accept it, and the
        remedy is the written one in §2 of the Anerkennungsbescheid.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: |
                    For the audit trail. About the *process* — never about the
                    person.
      responses:
        "204": { description: Withdrawn. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /admin/learners/{enrolmentId}/name:
    patch:
      tags: [admin]
      operationId: adminCorrectLearnerName
      summary: Correct the name a certificate will carry
      description: |
        Allowed until the Punktemeldung is accepted, and refused with 409 after
        it — the name is on the Ärztekammer's record by then, and a silent edit
        would make the two disagree. The correction path after that point is a
        written one inside the seven-day window.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 300 }
      responses:
        "204": { description: Corrected. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/learners/{enrolmentId}:
    delete:
      tags: [admin]
      operationId: adminEraseSubject
      summary: Erase a subject (GDPR Art. 17)
      description: |
        Performed by `erase_subject`, which pseudonymises rather than deleting
        so the CME record survives, refuses while a Punktemeldung is open, and
        writes its own audit row. Irreversible and cross-tenant — a physician
        may hold enrolments at several customers and all of them are erased.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: |
                    For the audit trail. About the *process* — "Löschantrag vom
                    12.03." — never about the person.
      responses:
        "200":
          description: What was erased.
          content:
            application/json:
              schema:
                type: object
                required: [enrolments, responses, submissions]
                properties:
                  enrolments: { type: integer, minimum: 0 }
                  responses: { type: integer, minimum: 0 }
                  submissions: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/certificates:
    get:
      tags: [admin]
      operationId: adminListCertificates
      summary: Certificates in this tenant
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: course
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The certificates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CertificateRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/certificates/{id}/regenerate:
    post:
      tags: [admin]
      operationId: adminRegenerateCertificate
      summary: Re-render a certificate
      description: |
        Re-renders from the enrolment, picking up a corrected name. **Reports
        nothing to EIV** — the certificate and submission pipelines share no
        code path, so a regeneration cannot trigger one.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "204": { description: Queued for re-rendering. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/certificates/{id}/resend:
    post:
      tags: [admin]
      operationId: adminResendCertificate
      summary: Put an issued certificate back in the delivery queue
      description: The same document, sent again. Not a reissue.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "204": { description: Queued for delivery. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/certificates/{id}/revoke:
    post:
      tags: [admin]
      operationId: adminRevokeCertificate
      summary: Withdraw a certificate
      description: |
        Withdraws the document and keeps the record. The enrolment, the
        progress and any Punktemeldung stay exactly where they were — what the
        physician earned, they earned.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/staff:
    get:
      tags: [admin]
      operationId: adminListStaff
      summary: Operator accounts this caller may manage
      description: |
        Above any tenant — no `X-DS-Project` — and narrowed by `canGrant`: an
        operator who may not grant to a scope has no business reading the
        accounts in it, so a customer administrator does not see the super
        administrators above them.
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminInviteStaff
      summary: Invite an operator
      description: |
        Creates the account with **no password** and returns a single-use token.
        The token is returned rather than emailed; the operator passes the link
        on. Until it is redeemed the account cannot sign in, so an un-redeemed
        invitation is not a credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffInvitation" }
      responses:
        "201":
          description: The invitation.
          content:
            application/json:
              schema:
                type: object
                required: [status, token]
                properties:
                  status: { type: string }
                  token: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/staff/{id}/scope:
    post:
      tags: [admin]
      operationId: adminSetStaffScope
      summary: Change what an account may reach
      parameters: [{ $ref: "#/components/parameters/StaffId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffScope" }
      responses:
        "204": { description: Changed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/staff/{id}/disabled:
    post:
      tags: [admin]
      operationId: adminSetStaffDisabled
      summary: Disable or re-enable an account
      description: Disabling revokes every session in the same statement.
      parameters: [{ $ref: "#/components/parameters/StaffId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        "204": { description: Changed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/staff/{id}/sign-out-everywhere:
    post:
      tags: [admin]
      operationId: adminSignOutStaffEverywhere
      summary: Revoke every session an account holds
      parameters: [{ $ref: "#/components/parameters/StaffId" }]
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/staff/{id}/second-factor/reset:
    post:
      tags: [admin]
      operationId: adminResetStaffSecondFactor
      summary: Clear an operator's second factor so they can enrol a new device
      description: |
        The lost-device path (P22-02). Before it existed, an enrolled operator
        whose authenticator was gone was locked out permanently — there was no
        reset anywhere in the product, and for a `super_admin`, the one role
        that was forced to enrol, a lost phone could end the platform's only
        unrestricted account.

        It does **not** sign the target in and does **not** relax their policy:
        under a `required` policy their next sign-in goes to enrolment, so
        access is restored without the bar moving. Every session they hold is
        revoked at the same time.

        Same authorization as re-scoping the account, plus one rule: **nobody
        may reset their own**. Self-reset would turn a stolen session into a
        permanently weakened account, and would step around the `required`
        policy that `DELETE /admin/auth/second-factor` enforces.
      parameters: [{ $ref: "#/components/parameters/StaffId" }]
      responses:
        "204":
          {
            description: Cleared. The account must enrol again if its policy requires one.,
          }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/auth/second-factor/policy:
    get:
      tags: [admin]
      operationId: adminGetSecondFactorPolicy
      summary: The second-factor policies in force
      description: |
        Every operator may read the rules they are subject to. Which of them
        they may change is enforced on the `PUT`, not by hiding this — a hidden
        control is a convenience and the refusal is the boundary.
      responses:
        "200":
          description: The platform policy, and one entry per customer that has set its own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecondFactorPolicies" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [admin]
      operationId: adminSetSecondFactorPolicy
      summary: Turn the second factor off, make it optional, or make it mandatory
      description: |
        Three values, and they are genuinely three (P22-02):

        - `disabled` — not offered, and an already-enrolled secret is not asked
          for. This is what lets an operator whose device is gone back in.
        - `optional` — enrol if you want to; **if you have, you must use it**.
          Relaxing a policy must never make a stolen password sufficient for
          somebody who had already protected themselves.
        - `required` — everybody enrols, and an account that has not is sent to
          enrolment rather than refused, which would make it unrecoverable.

        `customerId: null` names the platform itself — the scope a `super_admin`
        belongs to, since they belong to no customer — and **only a
        `super_admin` may set it**. Anyone else would be deciding, from inside
        one customer, how strictly the platform's unrestricted accounts are
        protected. A customer administrator may set their own customer's policy
        and no other.

        The platform default is `required`, which is ADR-0012's original rule
        kept as a default rather than a law. Every change is written to
        `admin_audit_log` carrying `weakened: true|false`, because "somebody
        relaxed a security policy" is the fact an auditor scans for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecondFactorPolicyUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/auth/second-factor:
    delete:
      tags: [admin]
      operationId: adminRemoveOwnSecondFactor
      summary: Take your own second factor off
      description: |
        Refused with 403 when the policy governing your account is `required` —
        which is what makes "mandatory" mean something rather than being a
        suggestion. Under `optional` it is your own call, and under `disabled`
        the factor is not being used anyway.

        Clearing **somebody else's** is a different operation with different
        rules: `POST /admin/staff/{id}/second-factor/reset`.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/customers:
    get:
      tags: [admin]
      operationId: adminListCustomers
      summary: Every customer on the platform
      description: |
        Above any tenant, and therefore authenticated by a **staff session
        cookie** rather than a learner bearer token — there is no
        `X-DS-Project` header on these requests because the list spans
        projects (ADR-0012).

        Requires the `customer` capability, which only `super_admin` holds: a
        customer is the tenant boundary itself, so nobody inside one may see or
        mint another. A customer administrator receives 403.
      responses:
        "200":
          description: The customers, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminCreateCustomer
      summary: Create a customer
      description: |
        The API generates the id and opens an RLS tenant context on it before
        inserting, so the new row satisfies the `customers` policy rather than
        bypassing it (ADR-0002).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "201":
          description: The new customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: |
            Too many customers created too quickly. A customer is a tenant
            boundary; nobody creates them in bulk, and an accidental loop in a
            console script should stop rather than seed empty tenants.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /admin/customers/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: The customer's slug.
        schema: { type: string }
    get:
      tags: [admin]
      operationId: adminGetCustomer
      summary: One customer
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: adminUpdateCustomer
      summary: Rename a customer
      description: |
        The slug cannot be changed here. It is what links, bookmarks and
        runbooks refer to, and re-slugging through the same call that fixes a
        typo in a company name breaks them with nothing in the audit trail to
        explain it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: The renamed customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: adminDeleteCustomer
      summary: Delete an empty customer
      description: |
        Refused with 409 while anything is inside it, and permanently refused
        once any learner record exists anywhere beneath it. The `detail` names
        the counts, so the refusal is an instruction rather than a dead end.
        Never a cascade.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/departments:
    get:
      tags: [admin]
      operationId: adminListDepartments
      summary: Departments in this tenant
      parameters: [{ $ref: "#/components/parameters/ProjectHeader" }]
      responses:
        "200":
          description: The departments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepartmentSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminCreateDepartment
      summary: Create a department
      description: |
        The insert names no customer: `customer_id` comes from the RLS session
        variable, so a department cannot be created into another tenant because
        there is no way to say which tenant (ADR-0002).
      parameters: [{ $ref: "#/components/parameters/ProjectHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepartmentCreate" }
      responses:
        "201":
          description: The departments, including the new one.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepartmentSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/departments/{slug}:
    patch:
      tags: [admin]
      operationId: adminUpdateDepartment
      summary: Rename a department
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: slug
          in: path
          required: true
          description: The department's slug.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepartmentUpdate" }
      responses:
        "200":
          description: The departments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepartmentSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: adminDeleteDepartment
      summary: Delete an empty department
      description: |
        Refused with 409 while it still contains projects or courses, and
        permanently refused once a learner has enrolled anywhere beneath it.
        The `detail` names the counts.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: slug
          in: path
          required: true
          description: The department's slug.
          schema: { type: string }
      responses:
        "200":
          description: The remaining departments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepartmentSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/projects:
    get:
      tags: [admin]
      operationId: adminListProjects
      summary: Projects in this tenant
      description: |
        Carries the Keycloak binding and the SMTP settings, and **never** the
        SMTP password — `hasSmtpPassword` is the only readable trace, exactly
        as `hasVnrPassword` is for a course (CLAUDE.md §4 invariant 7).
      parameters: [{ $ref: "#/components/parameters/ProjectHeader" }]
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminCreateProject
      summary: Create a project
      parameters: [{ $ref: "#/components/parameters/ProjectHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: The projects, including the new one.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/projects/{slug}:
    patch:
      tags: [admin]
      operationId: adminUpdateProject
      summary: Edit a project, its branding, its Keycloak binding and its SMTP
      description: |
        The Keycloak binding decides which realm every token for this project is
        validated against (ADR-0003). Changing it wrongly locks every learner
        out at once, which is why the console confirms before saving it — the
        API applies what it is given, because a platform that refused to let an
        admin change their own IdP would be a worse failure than the one it
        prevented.

        `branding` is re-validated against `@ds/domain`'s grammars and the
        *parsed* result is stored, so a value that fails is dropped here rather
        than stored and dropped again on every read.

        `smtpPassword` is write-only.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: slug
          in: path
          required: true
          description: |
            The project's own slug — the resource being edited, which is not
            necessarily the project in `X-DS-Project`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: adminDeleteProject
      summary: Delete an empty project
      description: |
        Refused with 409 while it still contains courses, and permanently
        refused once a learner has enrolled in any of them. The `detail` names
        the counts.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: slug
          in: path
          required: true
          description: The project being deleted, not the one in `X-DS-Project`.
          schema: { type: string }
      responses:
        "200":
          description: The remaining projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/courses/{slug}/structure:
    get:
      tags: [admin]
      operationId: adminGetStructure
      summary: The authoring tree
      description: |
        Modules, chapters and content in author order, plus two counts the
        console needs: `learnerRecords`, which disables deletion and says why,
        and `questionCount`, which is zero for a quiz nobody can pass yet.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/courses/{slug}/uploads:
    post:
      tags: [admin]
      operationId: adminBeginUpload
      summary: Ask for permission to upload a file
      description: |
        Answers with a short-lived signed `PUT` the browser sends **directly to
        object storage**. The bytes never pass through this API.

        The request names a purpose, a type and a size, and every one of those
        is checked rather than accepted: the type must be one this purpose
        allows, the size must be within that purpose's ceiling, and both are
        bound into the signature — so a browser that uploads something else
        gets a 403 from the bucket, not a stored object.

        The request never names a key, a prefix or a filename. Those are
        derived server-side from the validated session and the course, which is
        what keeps one customer's uploads out of another's space in a store
        that has no row-level security.

        Answering `201` does not mean anything was uploaded. Call
        `adminCompleteUpload` once the `PUT` finishes to get the reference a
        course may point at.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "201":
          description: A signed upload, valid until `expiresAt`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            This deployment has no object storage configured. Deliberately not a
            500: nothing is broken, the feature is simply not available here,
            and an author should be told to supply a URL instead.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: |
            Too many signatures asked for too quickly. Minting is cheap here and
            expensive at the other end of the bucket bill.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /admin/courses/{slug}/uploads/complete:
    post:
      tags: [admin]
      operationId: adminCompleteUpload
      summary: Confirm an upload and get the reference to store
      description: |
        The API asks object storage what it actually holds for this key and
        compares it against what it approved when the signature was issued. An
        object of a different size or type is **deleted** and the call fails.

        The expected size and type are read from the recorded issue, never from
        this request — otherwise a client would be choosing both sides of the
        comparison.

        On success, `reference` is what goes into a content item's `videoUrl`,
        `posterUrl`, `captionsUrl` or `fileUrl`.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCompletion" }
      responses:
        "200":
          description: The object is present and is what was approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadConfirmed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            No upload was issued for this key in this tenant. A key belonging to
            another customer gets this same answer — distinguishing the two
            would confirm that somebody else's object exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: Too many confirmations too quickly.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "500":
          description: |
            Object storage could not be reached. Not the author's fault and not
            a permanent refusal — "try again in a few minutes" is the correct
            advice, and a 4xx would hide a storage outage inside the ordinary
            noise of people uploading the wrong thing.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /admin/courses/{slug}/modules:
    post:
      tags: [admin]
      operationId: adminCreateModule
      summary: Append a module
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
