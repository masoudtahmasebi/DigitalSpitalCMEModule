          application/json:
            schema: { $ref: "#/components/schemas/ChapterWrite" }
      responses:
        "201":
          description: The structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/chapters/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdateChapter
      summary: Edit a chapter
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChapterWrite" }
      responses:
        "200":
          description: The structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: adminDeleteChapter
      summary: Delete a chapter
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/chapters/{id}/contents:
    post:
      tags: [admin]
      operationId: adminCreateContent
      summary: Append a content item
      description: |
        A `video` **must** carry `durationSec`. The watch requirement is a
        percentage of a known length; with no length there is nothing to reach,
        and the item would be skippable while appearing to count toward a CME
        point. Refused with 422 naming the field, not with a database error.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentWrite" }
      responses:
        "201":
          description: The structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/contents/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdateContent
      summary: Edit a content item
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentWrite" }
      responses:
        "200":
          description: The structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: adminDeleteContent
      summary: Delete a content item
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/courses/{slug}/structure/order:
    put:
      tags: [admin]
      operationId: adminReorderStructure
      summary: Reorder the whole tree, atomically
      description: |
        Ids only — this route moves things, it never edits them. A chapter
        listed under a different module **is** the move, which is why this
        cannot be a set of per-list requests: a chapter in flight between two
        modules would briefly belong to neither.

        Every level is validated as a **permutation** of what exists before
        anything is written, so a request that is wrong anywhere changes nothing
        anywhere. A list that lost an item is rejected rather than obeyed —
        obeying it would delete a chapter from a course learners are part-way
        through.

        Ordering decides gating (`gating.ts`), so this is a
        compliance-adjacent operation rather than a convenience.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StructureOrder" }
      responses:
        "200":
          description: The structure, in its new order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/courses/{slug}/experts:
    put:
      tags: [admin]
      operationId: adminReplaceExperts
      summary: Replace the Experten/Referenten list
      description: |
        Replaced wholesale rather than diffed: no learner state points at an
        expert, so unlike everything else here a full replace is safe — and it
        is what the screen does anyway.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpertsWrite" }
      responses:
        "200":
          description: The structure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseStructure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/contents/{id}/quiz:
    get:
      tags: [admin]
      operationId: adminGetQuiz
      summary: The quiz, with its answer key
      description: |
        **The only route in the platform that returns `isCorrect`.** It is
        reachable by an author role and nothing else; the learner-facing `Quiz`
        has no field capable of carrying the flag, which is what makes leaking
        it a compile error rather than something a reviewer has to notice
        (P4-01).

        `answerCount` per question is what blocks deletion: an
        already-submitted attempt must keep meaning what it meant.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The quiz.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthoringQuiz" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: adminSetQuiz
      summary: Replace the quiz
      description: |
        Diffed, not wiped and rewritten. `id` present means "the existing row,
        changed"; absent means "new"; anything the server holds and this
        document does not name is a deletion — and a deletion of something a
        learner has answered is refused with the count.

        Two refusals no form should be trusted with: a question with **no**
        correct answer cannot be passed by anybody, and a `single` question with
        **two** correct answers cannot either, because scoring is exact-set.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizWrite" }
      responses:
        "200":
          description: The quiz, as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthoringQuiz" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/courses/{slug}/evaluation:
    get:
      tags: [admin]
      operationId: adminGetEvaluation
      summary: The Evaluationsbogen, for editing
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The evaluation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthoringEvaluation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: adminSetEvaluation
      summary: Replace the Evaluationsbogen
      description: |
        Same diffing rule as the quiz: a question somebody has answered cannot
        be deleted. The Anerkennung requires an evaluation, so an empty one is
        a course that cannot be completed.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationWrite" }
      responses:
        "200":
          description: The evaluation, as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthoringEvaluation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/courses/{slug}/participants:
    get:
      tags: [admin]
      operationId: adminListParticipants
      summary: Participant status for one course
      description: |
        Every figure comes from the **same rollup the learner's own screen
        renders from** (CLAUDE.md §4 invariant 6). A list showing a physician
        96 % where their own screen shows 100 % would be two different answers
        to "did this person earn a CME point", one of which has already gone to
        the Ärztekammer.

        `eivState` distinguishes `needs_attention` from a generic failure on
        purpose: a submission unresolved after the fast retries will not fix
        itself, and the Bescheid's paper fallback is only open while the 8-day
        deadline has not passed (P9-06).

        The EFN is never returned — only whether one is on file (ADR-0004).
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The participants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/courses/{slug}/participants.csv:
    get:
      tags: [admin]
      operationId: adminExportParticipants
      summary: The participant list as CSV
      description: |
        Exactly the rows the list returns — built from the same call, not a
        second query. UTF-8 with a BOM and a `sep=;` line so Excel in a German
        locale opens it correctly, and cells that could be read as spreadsheet
        formulas are neutralised. The export is audited: it is the point where
        personal data leaves the system's access controls.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The CSV.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profile/efn:
    put:
      tags: [completion]
      operationId: setEfn
      summary: Store the learner's EFN
      description: |
        The EFN (Einheitliche Fortbildungsnummer) is 15 digits and is the key
        the Ärztekammer credits points against. Stored once per user, not per
        enrolment (ADR-0004), and never written to a log.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EfnInput" }
      responses:
        "204":
          description: Stored.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422":
          description: Not a valid 15-digit EFN.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /courses/{slug}/completion:
    post:
      tags: [completion]
      operationId: completeCourse
      summary: Finalise the course and report the points
      description: |
        Re-checks every condition server-side — watch coverage, quiz pass,
        evaluation, EFN — and refuses if any is outstanding, naming which.
        On success it stamps completion and queues the EIV submission with its
        statutory deadlines (8 days to report, 7 to correct). Idempotent: a
        second call returns the same completed state without re-queueing.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletionInput" }
      responses:
        "200":
          description: Completed; the CME points are queued for reporting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Conditions are still outstanding; `detail` names which, and the
            enrolment is unchanged.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak access token. Verified against the realm bound to the
        X-DS-Project header — issuer and audience come from that binding,
        never from the token (ADR-0003).

  parameters:
    CourseSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }

    ContentId:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ResourceId:
      name: id
      in: path
      required: true
      description: |
        The id of the module, chapter or content item being addressed. Always a
        uuid, and always resolved under RLS: an id belonging to another tenant
        is a 404, indistinguishable from one that does not exist.
      schema: { type: string, format: uuid }

    CertificateId:
      name: id
      in: path
      required: true
      description: The certificate's id.
      schema: { type: string, format: uuid }

    StaffId:
      name: id
      in: path
      required: true
      description: The operator account's id.
      schema: { type: string, format: uuid }

    ProjectHeader:
      name: X-DS-Project
      in: header
      required: true
      description: |
        Project slug identifying the calling host surface (ADR-0007). Pins the
        tenant, and on the learner plane also resolves the Keycloak realm to
        validate the bearer token against.

        **How a bad slug is answered depends on which plane asked**, because the
        two callers know different things already (P22-01):

        - *Learner plane* (bearer token): an unknown **or unbound** slug is a
          generic `401`, never a `404` — whether a project exists is not a fact
          an anonymous caller should be able to enumerate, and a project with no
          Keycloak binding cannot authenticate anybody in any case.
        - *Staff plane* (session cookie, ADR-0012): an unknown slug is a `404`
          carrying `detail`. The caller is already authenticated and the
          platform knows who they are, so naming what was not found is both
          honest and safe. A staff session needs no identity provider at all, so
          a project **without** a Keycloak binding resolves normally here —
          answering 401 for that locked operators out of every tenant-scoped
          console screen on a project the console itself had just created.
        - Either plane, **header absent**: `422` with `detail`. The header is
          required; omitting it is a malformed request, not a failed
          authentication, and answering 401 makes a console send the operator
          back to a login form they never left.

        A caller who is authenticated but holds no grant reaching the resolved
        customer gets `403` on both planes.
      schema: { type: string }

  responses:
    Unauthenticated:
      description: |
        Missing/invalid token, missing project header, or unknown project.
        Always the same generic document — the reason is logged server-side
        only.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Authenticated, but no grant reaches this tenant.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: |
        Not found — or not visible in this tenant; the two are
        indistinguishable by design.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ValidationFailed:
      description: One or more request parameters are invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Conflict:
      description: |
        The request is well-formed but the current state refuses it — a slug
        already taken, or a delete of something a learner has already used. The
        second kind is not a validation failure: nothing about the request is
        wrong, and the same request would have succeeded yesterday.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

    TooManyRequests:
      description: |
        The rate limiter refused this caller for now.

        Named as a shared response because two of the endpoints that use it —
        the password-reset requests — answer identically for every other
        outcome, which makes a 429 the *only* status a caller can distinguish.
        That is deliberate and it is also why the limit is keyed on the IP: a
        per-address limit would itself answer "is this address being asked
        about a lot".
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

    BadGateway:
      description: |
        An interface this platform does not own refused or could not be reached
        — today, only EIV-FOBI.

        Distinct from a 5xx of our own on purpose: nothing here is broken, and
        the operator's next step is different. The `detail` carries what the
        authority said, and never a credential.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

  schemas:
    SecondFactorPolicy:
      type: string
      enum: [disabled, optional, required]
      description: |
        `disabled` — not offered, and an already-enrolled secret is not asked
        for. `optional` — enrol if you want to, but if you have you must use it.
        `required` — everybody enrols. See `PUT
        /admin/auth/second-factor/policy` for why `optional` is deliberately not
        the same as off.

    SecondFactorPolicies:
      type: object
      required: [platform, customers]
      properties:
        platform:
          allOf: [{ $ref: "#/components/schemas/SecondFactorPolicy" }]
          description: |
            The policy for accounts belonging to no customer — which is every
            `super_admin`. Defaults to `required`.
        customers:
          type: array
          description: One entry per customer that has set its own; the rest use `optional`.
          items:
            type: object
            required: [customerId, policy]
            properties:
              customerId: { type: string, format: uuid }
              policy: { $ref: "#/components/schemas/SecondFactorPolicy" }

    SecondFactorPolicyUpdate:
      type: object
      required: [customerId, policy]
      properties:
        customerId:
          type: string
          format: uuid
          nullable: true
          description: |
            `null` names the platform itself. Spelled as an explicit null rather
            than an absent field, so "set the platform policy" cannot be what a
            malformed request accidentally means.
        policy: { $ref: "#/components/schemas/SecondFactorPolicy" }

    ProblemDetails:
      type: object
      description: RFC 7807. No stack traces, no internal identifiers.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: |
            The release number this process was deployed as — `major.minor` from
            the workspace's package.json, patch from the commit count, so it
            increases with every deploy of new work (P47-01).

            The commit below identifies the build exactly; this orders it.
            `0a177c7` and `e258c8d` are unordered, so "is this newer than what I
            saw yesterday" cannot be answered from a SHA alone.

            `unknown` when the process was started without `DS_VERSION`.
        commit:
          type: string
          description: |
            The git commit this API process was built from — the same value as
            `ds_build_info` on `/metrics`, and the same tag as its container
            image (P46-01).

            On `/health` rather than a route of its own because this one is
            already public, already routed by the edge, and already what
            `deploy.sh` curls to decide a deploy succeeded. A second public
            endpoint would be a second thing to expose, review and route, for
            an answer this one can carry in a field.

            **Why it is exposed at all.** "The feature is missing" and "the
            feature is not on the server you are looking at" are
            indistinguishable from a browser, and the second has been the more
            common of the two on this project (CLAUDE.md §9.9). Every frontend
            shows it beside its own build, so the question is answered by
            looking rather than by asking somebody with SSH.

            `unknown` when the process was started without `DS_COMMIT` — a
            local `pnpm dev`, or a container run by hand. Deliberately not
            omitted: a missing field reads as an old build, and "I do not know"
            is a different answer from "0.0.0".

    DeliveryType:
      type: string
      description: The course list's three tabs.
      enum: [on_demand, live, praesenz]

    CourseSummary:
      type: object
      description: One card on the course list screen.
      required:
        - id
        - slug
        - title
        - description
        - heroImageUrl
        - deliveryType
        - thema
        - altersgruppe
        - cmePoints
        - cmeCategory
        - moduleCount
        - totalDurationSec
        - enrolment
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        heroImageUrl:
          type: [string, "null"]
          description: Course artwork; the card and the detail hero share it.
        deliveryType: { $ref: "#/components/schemas/DeliveryType" }
        thema:
          type: array
          items: { type: string }
        altersgruppe:
          type: array
          items: { type: string }
        cmePoints:
          type: [integer, "null"]
          description: Rendered as "5 CME Punkte" in the card metadata line.
        cmeCategory: { type: [string, "null"] }
        moduleCount: { type: integer, minimum: 0 }
        totalDurationSec:
          type: integer
          minimum: 0
          description: Sum of video durations; formatted client-side.
        enrolment:
          # 3.1 nullability is a type union, not `nullable: true` — which this
          # document's other nullable fields already use and which the SDK
          # generator honours.
          type: ["object", "null"]
          required: [complete]
          description: |
            The **caller's own** standing on this course, or `null` if they
            have not enrolled. Taken from the validated token's user id, never
            from a parameter.

            The card's call to action depends on it: _Zur Fortbildung_ when
            absent, _Fortbildung fortsetzen_ when present and unfinished.

            **Deliberately not a percentage.** A course percentage is the
            output of `rollupProgress` over the whole tree and there is exactly
            one path to it (CLAUDE.md §4 invariant 6); producing it for ten
            cards would mean ten tree builds per request, and the cheap
            approximation that invites would be a second answer to "how far has
            this person got". Both fields here are stored columns.
          properties:
            complete:
              type: boolean
              description: "`completed_at IS NOT NULL` — the course is finished."

    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          required:
            - learningObjectives
            - targetAudience
            - prerequisites
            - vnr
            - accreditationBody
            - fortbildungsnummer
            - organizer
            - eventLocation
            - validFrom
            - validTo
            - requiredWatchPercent
            - passThresholdPercent
            - modules
            - experts
          properties:
            learningObjectives:
              type: array
              items: { type: string }
              description: The "Lernziele" checklist, one entry per bullet.
            targetAudience:
              type: [string, "null"]
              description: The "Zielgruppe" text; newlines are the only formatting.
            prerequisites:
              type: [string, "null"]
              description: |
                The "Vorkenntnisse" paragraph the layout labels separately under
                Zielgruppe (page 02). Its own field so an author does not have to
                remember to type the label into `targetAudience`.
            vnr: { type: [string, "null"] }
            accreditationBody: { type: [string, "null"] }
            fortbildungsnummer:
              type: [string, "null"]
              description: |
                Printed on the Zertifizierung tab as "Fortbildungsnummer: …"
                (layout page 04). Distinct from the VNR, which is the EIV
                credential and never leaves the server.
            organizer: { type: [string, "null"] }
            eventLocation: { type: [string, "null"] }
            validFrom: { type: [string, "null"], format: date-time }
            validTo: { type: [string, "null"], format: date-time }
            requiredWatchPercent:
              type: integer
              minimum: 0
              maximum: 100
              description: |
                The course's actual configured value — the Zertifizierung tab
                renders this, never a hardcoded number (P5-06).
            passThresholdPercent:
              type: integer
              minimum: 0
              maximum: 100
            modules:
              type: array
              items: { $ref: "#/components/schemas/ModuleSummary" }
            experts:
              type: array
              items: { $ref: "#/components/schemas/CourseExpert" }

    ModuleSummary:
      type: object
      required: [id, ordinal, title, subtitle, chapters]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        chapters:
          type: array
          items: { $ref: "#/components/schemas/ChapterSummary" }

    ChapterSummary:
      type: object
      required: [id, ordinal, title, contents]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        title: { type: string }
        contents:
          type: array
          items: { $ref: "#/components/schemas/ContentSummary" }

    ContentSummary:
      type: object
      description: |
        What a course *contains*, for browsing — never what is inside it.

        Deliberately has no field capable of carrying a quiz answer (P4-01),
        and no `fileUrl`, `videoUrl` or `body`. This response is ungated: any
        holder of a tenant token can read it, finished or not. A URL here would
        make both padlocks in the product decorative at once — the Mediathek's,
        which withholds `fileUrl` until the module is complete, and the
        player's, which withholds `videoUrl` until the chapter is reachable.

        The gated shapes are `Material` and `LessonContent`, and they are the
        only ones that carry a URL.
      required: [id, ordinal, kind, title, durationSec, mimeType]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        kind: { $ref: "#/components/schemas/ContentKind" }
        title: { type: string }
        durationSec: { type: [integer, "null"] }
        mimeType:
          type: [string, "null"]
          description: Metadata for an icon. Not a URL — see the description above.

    CourseExpert:
      type: object
      required: [id, ordinal, roleLabel, name, institution, biography, photoUrl]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        roleLabel: { type: string }
        name: { type: string }
        institution: { type: [string, "null"] }
        biography: { type: [string, "null"] }
        photoUrl: { type: [string, "null"] }

    FacetCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    GateStatus:
      type: string
      description: |
        Server-decided access state. `locked` renders the padlock; the client
        never computes this.
      enum: [locked, available, completed]

    ProgressSummary:
      type: object
      required: [status, completedCount, totalCount, percent]
      properties:
        status:
          type: string
          enum: [not_started, in_progress, completed]
        completedCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0 }
        percent: { type: integer, minimum: 0, maximum: 100 }
        watchedPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Video content only. Union coverage, not furthest position.
        scorePercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Quiz content only; best scored attempt.

    ContentState:
      type: object
      required: [id, gate, progress]
      properties:
        id: { type: string, format: uuid }
        gate: { $ref: "#/components/schemas/GateStatus" }
        progress: { $ref: "#/components/schemas/ProgressSummary" }

    ChapterState:
      type: object
      required: [id, gate, progress, contents]
      properties:
        id: { type: string, format: uuid }
        gate: { $ref: "#/components/schemas/GateStatus" }
        blockedBy:
          type: string
          format: uuid
          description: |
            The first incomplete chapter standing in the way, so the widget can
            say which one to finish rather than only "locked".
        progress: { $ref: "#/components/schemas/ProgressSummary" }
        contents:
          type: array
          items: { $ref: "#/components/schemas/ContentState" }

    ModuleState:
      type: object
      required: [id, gate, progress, chapters]
      properties:
        id: { type: string, format: uuid }
        gate: { $ref: "#/components/schemas/GateStatus" }
        progress: { $ref: "#/components/schemas/ProgressSummary" }
        chapters:
          type: array
          items: { $ref: "#/components/schemas/ChapterState" }

    CompletionCondition:
      type: string
      description: A condition still standing between the learner and the points.
      enum: [watch, quiz, evaluation, efn]

    EnrolmentState:
      type: object
      description: |
        Everything the player screen renders: the progress ring, the module
        tree with its lock states, the resume target, and what remains.
      required:
        - enrolmentId
        - courseSlug
        - requiredWatchPercent
        - passThresholdPercent
        - achievedWatchPercent
        - quizPassed
        - evaluationSubmitted
        - efnPresent
        - courseComplete
        - complete
        - outstanding
        - outstandingForCourse
        - completedAt
        - courseCompletedAt
        - progress
        - moduleCompletion
        - modules
        - resumeContentId
      properties:
        enrolmentId: { type: string, format: uuid }
        courseSlug: { type: string }
        requiredWatchPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Snapshotted at enrolment, not read live from the course.
        passThresholdPercent: { type: integer, minimum: 0, maximum: 100 }
        achievedWatchPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Union coverage across all video content in the course.
        quizPassed: { type: boolean }
        evaluationSubmitted: { type: boolean }
        efnPresent:
          type: boolean
          description: Whether an EFN is on file. The EFN itself is never returned.
        courseComplete:
          type: boolean
          description: |
            The Fortbildung itself is finished: the required share of the video
            content is watched and the Lernerfolgskontrolle is passed.

            The evaluation and the EFN may still be outstanding. A physician in
            this state has *done the course* and is told so; `complete` below is
            the stronger claim that gates the certificate.
        complete:
          type: boolean
          description: |
            Certifiable: `courseComplete`, and the Evaluationsbogen and — where
            the course awards CME points — the EFN are on file. Only this gates
            the Teilnahmebescheinigung and the EIV Punktemeldung.
        outstanding:
          type: array
          description: Everything still missing, in the order the learner meets it.
          items: { $ref: "#/components/schemas/CompletionCondition" }
        outstandingForCourse:
          type: array
          description: |
            The subset of `outstanding` holding the course itself back — never
            more than `watch` and `quiz`. Empty exactly when `courseComplete`.
          items: { $ref: "#/components/schemas/CompletionCondition" }
        completedAt:
          type: [string, "null"]
          format: date-time
          description: When the CME point was claimed. Null until `complete`.
        courseCompletedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When the course was finished. Null on enrolments certified before
            this was recorded, so read `courseComplete` — never this field — to
            decide whether the course is done.
        progress:
          $ref: "#/components/schemas/ProgressSummary"
        moduleCompletion:
          type: object
          description: Feeds "Sie haben X von Y Modulen abgeschlossen".
          required: [completed, total]
          properties:
            completed: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        modules:
          type: array
          items: { $ref: "#/components/schemas/ModuleState" }
        resumeContentId:
          type: [string, "null"]
          format: uuid
          description: |
            Where "Fortbildung fortsetzen" jumps to — the first unfinished
            content the learner may currently reach. Null when nothing is left.

    ContentKind:
      type: string
      enum: [video, text, quiz, details, material]

    MediaSource:
      type: object
      description: |
        One playable rendition. A browser takes the first `<source>` whose
        `type` it can play and silently skips the rest, so the **order of the
        list is the format negotiation** — adaptive streams first, so Safari
        gets HLS and everything else falls through to the progressive file with
        no user-agent detection anywhere. `orderSources` in `@ds/domain` decides
        that order; a client renders the list as given.
      required: [url, mimeType, label]
      properties:
        url:
          type: string
          description: |
            Already resolved — signed if it lives in our storage, passed through
            if the customer serves it. Short-lived, like every other media URL
            in this contract.
        mimeType:
          type: string
          description: |
            Validated on write against a closed list. A `type` no browser
            recognises produces a source that is skipped in silence, which
            presents as a video that will not play with nothing in the console.
        label:
          type: [string, "null"]
          description: Free text for the quality menu — "720p". Null when unlabelled.

    LessonContent:
      type: object
      description: |
        A lesson's actual payload. The **only** shape carrying media URLs or
        `body`, and reachable only through the sequence gate — see the
        `getLesson` description.
      required:
        [
          id,
          kind,
          title,
          durationSec,
          sources,
          posterUrl,
          captionsUrl,
          body,
          lastPositionSec,
          resumeAtSec,
          seekCeilingSec,
          watchedPercent,
          watchedSegments,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ContentKind" }
        title: { type: string }
        durationSec: { type: [integer, "null"] }
        sources:
          type: array
          description: |
            Empty for anything that is not playable media, and for a video whose
            renditions could not be resolved — an `s3://` key belonging to
            another customer resolves to nothing rather than to an error, the
            same degradation the single URL used to have.
          items: { $ref: "#/components/schemas/MediaSource" }
        posterUrl:
          type: [string, "null"]
          description: |
            Still frame shown before playback. Without one the element renders a
            black rectangle until the first frame decodes, and the layout's
            centred play button sits on nothing.
        captionsUrl:
          type: [string, "null"]
          description: |
            WebVTT captions for the video, signed with the same lifetime as
            `videoUrl`. WCAG 1.2.2 (Captions, Prerecorded) is **Level A**, and
            EN 301 549 makes it the reference standard here — a physician who
            cannot hear the video cannot earn the points, and the watch gate
            will record that they did not. `null` when the author supplied none.
        body:
          type: [string, "null"]
          description: Text lessons. Trusted authored content, not learner input.
        lastPositionSec:
          type: integer
          minimum: 0
          description: |
            Where the learner left off, as last reported and stored. Playback
            does not start here — see `resumeAtSec`.
        resumeAtSec:
          type: integer
          minimum: 0
          description: |
            Where playback should start — `lastPositionSec` rewound to the
            containing minute. A learner who left at 14:35 resumes at 14:00.

            Never greater than `seekCeilingSec`: the position playback opens at
            is always one seeking is allowed to reach.

            Decided by the server rather than the player, so every host rewinds
            by the same amount. The replay costs the compliance record nothing:
            coverage is a union of intervals, so re-watching the same seconds
            cannot inflate the percentage.
        seekCeilingSec:
          type: integer
          minimum: 0
          description: |
            The furthest second the player may seek to — the end of what has
            actually been watched, plus a small tolerance.

            Forward seeking past this is what would make the watch gate
            decorative. Seeking backwards is unrestricted; re-watching is
            legitimate and free.
        watchedPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            The server's figure for this content, so the player shows the same
            number the completion gate uses.
        watchedSegments:
          type: array
          description: |
            The **merged** intervals this learner has watched, so the scrub bar
            can shade what has been covered and survive a reload doing it.

            Returned rather than recomputed on the client for the reason the
            percentage is: these are the very intervals `watchedPercent` was
            derived from, so the bar and the number cannot tell different
            stories. They are the caller's own data and disclose nothing — the
            endpoint is already behind the sequence gate.
          items: { $ref: "#/components/schemas/WatchedSegment" }

    WatchedSegment:
      type: object
      description: One played interval, in seconds from the start of the media.
      required: [startSec, endSec]
      properties:
        startSec: { type: number, minimum: 0 }
        endSec: { type: number, minimum: 0 }

    ProgressReport:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/WatchedSegment" }
        lastPositionSec:
          type: number
          minimum: 0
          description: Playhead position, for resuming. Never a gate input.

    RejectedSegment:
      type: object
      required: [segment, reason]
      properties:
        segment: { $ref: "#/components/schemas/WatchedSegment" }
        reason:
          type: string
          description: |
            Exactly `SegmentRejectionReason` from the compliance core — the
            contract mirrors the domain's vocabulary rather than inventing a
            parallel one that could drift from it.
          enum:
            [
              not_finite,
              negative,
              zero_or_reversed,
              beyond_duration,
              faster_than_wallclock,
            ]

    ProgressResult:
      type: object
      description: The server's own recomputed figures, never the client's.
      required:
        [
          contentId,
          watchedPercent,
          status,
          accepted,
          rejected,
          watchedSegments,
          seekCeilingSec,
        ]
      properties:
        contentId: { type: string, format: uuid }
        watchedPercent: { type: integer, minimum: 0, maximum: 100 }
        status:
          type: string
          enum: [not_started, in_progress, completed]
        accepted:
          type: integer
          minimum: 0
          description: How many reported intervals were counted.
        rejected:
          type: array
          description: |
            Named rather than silently dropped, so a client bug or a tampering
            attempt is visible.
          items: { $ref: "#/components/schemas/RejectedSegment" }
        watchedSegments:
          type: array
          description: |
            The merged union after this report, so the player's coverage bar
            redraws from the server's answer rather than from what it believed
            it had sent. The difference is visible whenever a segment was
            rejected: the client's optimistic bar would show credit the gate did
            not give.
          items: { $ref: "#/components/schemas/WatchedSegment" }
        seekCeilingSec:
          type: number
          minimum: 0
          description: |
            The furthest second the player may seek to after this report.

            Returned so the player's limit advances as the learner watches. The
            alternative — deriving it on the client from `watchedSegments` —
            would put a rule that decides what counts towards a CME point in two
            implementations, which is what invariant 6 exists to prevent.

    Material:
      type: object
      description: |
        One downloadable item. `fileUrl` is **null while locked** — the gate is
        the absent URL, not the boolean.
      required: [id, title, description, locked, fileUrl, mimeType, fileSize]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description:
          type: [string, "null"]
          description: |
            The paragraph the layout draws under each Mediathek card
            (`docs/design/screens/page-05.png`). Authored as the content's
            `body`, which has existed and been writable through
            `ContentWrite` since P9-04 — this exposes it to the learner rather
            than inventing a second column for the same sentence.

            Sent **even while locked**, like the title, and for the same
            reason: the layout blurs a locked group rather than hiding it, so
            the learner can see that material exists and what unlocks it. What
            is withheld is `fileUrl`, which is the gate.
        locked: { type: boolean }
        fileUrl: { type: [string, "null"] }
        mimeType: { type: [string, "null"] }
        fileSize: { type: [integer, "null"] }

    MaterialGroup:
      type: object
      description: The layout groups downloads under "Materialien zu Modul N".
      required: [moduleId, moduleTitle, ordinal, locked, materials]
      properties:
        moduleId: { type: string, format: uuid }
        moduleTitle: { type: string }
        ordinal: { type: integer }
        locked: { type: boolean }
        materials:
          type: array
          items: { $ref: "#/components/schemas/Material" }

    MaterialLibrary:
      type: object
      required: [courseSlug, groups]
      properties:
        courseSlug: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/MaterialGroup" }

    QuizOption:
      type: object
      description: No correctness marker — the shape has nowhere to put one.
      required: [id, ordinal, label]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        label: { type: string }

    ParticipantMergeRequest:
      type: object
      required: [sourceUserId, targetUserId]
      properties:
        sourceUserId:
          type: string
          format: uuid
          description: The person whose records move. Deleted by the merge.
        targetUserId:
          type: string
          format: uuid
          description: The person who survives, and whose id every record ends on.

    ParticipantMergeParty:
      type: object
      required: [userId, email, hasEfn, enrolledCourseSlugs]
      properties:
        userId: { type: string, format: uuid }
        email: { type: [string, "null"] }
        hasEfn:
          type: boolean
          description: |
            Whether an EFN is on file — never which. No endpoint returns an EFN
            (ADR-0004), and the refusal below is what tells an operator that two
            exist and differ.
        enrolledCourseSlugs:
          type: array
          items: { type: string }

    ParticipantMergePreview:
      type: object
      required: [source, target, plan]
      properties:
        source: { $ref: "#/components/schemas/ParticipantMergeParty" }
        target: { $ref: "#/components/schemas/ParticipantMergeParty" }
        plan:
          oneOf:
            - type: object
              required: [allowed]
              properties:
                allowed: { type: boolean, enum: [true] }
            - type: object
              required: [allowed, refusal]
              properties:
                allowed: { type: boolean, enum: [false] }
                refusal:
                  type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      enum: [same_person, conflicting_efn, overlapping_courses]
                    courseSlugs:
                      type: array
                      items: { type: string }
                      description: Present on `overlapping_courses` only.

    QuizQuestion:
      type: object
      required: [id, ordinal, kind, prompt, options]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        kind:
          type: string
          enum: [single, multi]
        prompt: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/QuizOption" }

    Quiz:
      type: object
      required: [contentId, passThresholdPercent, attemptsUsed, maxAttempts, questions]
      properties:
        contentId: { type: string, format: uuid }
        passThresholdPercent: { type: integer, minimum: 0, maximum: 100 }
        attemptsUsed: { type: integer, minimum: 0 }
        maxAttempts:
          type: [integer, "null"]
          description: Null means unlimited, which is the MEDICE configuration.
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuizQuestion" }

    QuizAnswer:
      type: object
      required: [questionId, selectedOptionIds]
      properties:
        questionId: { type: string, format: uuid }
        selectedOptionIds:
          type: array
          items: { type: string, format: uuid }

    QuizSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: "#/components/schemas/QuizAnswer" }

    QuizAttemptResult:
      type: object
      required:
        [
          attemptNumber,
          correctCount,
          totalCount,
          scorePercent,
          passed,
          passThresholdPercent,
        ]
      properties:
        attemptNumber: { type: integer, minimum: 1 }
        correctCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0 }
        scorePercent: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        passThresholdPercent: { type: integer, minimum: 0, maximum: 100 }
        perQuestion:
          type: object
          additionalProperties: { type: boolean }
          description: |
            Present only when the course sets `revealCorrectAnswers`, which a
            CME-certified course never does.

    EvaluationQuestion:
      type: object
      required: [id, ordinal, kind, prompt, required, options]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        kind:
          type: string
          enum: [scale, single, multi, text]
        prompt: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }

    Evaluation:
      type: object
      required: [courseSlug, submitted, questions]
      properties:
        courseSlug: { type: string }
        submitted: { type: boolean }
        questions:
          type: array
          items: { $ref: "#/components/schemas/EvaluationQuestion" }

    EvaluationSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [evaluationId, answer]
            properties:
              evaluationId: { type: string, format: uuid }
              answer:
                description: Scale number, chosen option(s), or free text.
                oneOf:
                  - type: string
                  - type: number
                  - type: array
                    items: { type: string }

    Certificate:
      type: object
      description: |
        Exactly the fields the Bescheid requires a Teilnahmebescheinigung to
        carry, plus the pre-templated creditability sentence so no client ever
        hardcodes a points figure.
      required:
        - vnr
        - courseTitle
        - completedAt
        - eventLocation
        - organizer
        - cmePoints
        - cmeCategory
        - accreditationBody
        - participantName
        - scientificLeadName
        - creditSentence
      properties:
        vnr: { type: string }
        courseTitle: { type: string }
        completedAt:
          type: string
          format: date-time
          description: |
            Both the Veranstaltungs-datum and -uhrzeit. For an on-demand course
            this is the moment the learner completed it — the same instant that
            starts the EIV reporting window, so certificate and Punktemeldung
            agree by construction.
        eventLocation: { type: string }
        organizer: { type: string }
        cmePoints: { type: integer }
        cmeCategory: { type: string }
        accreditationBody: { type: string }
        participantName: { type: string }
        participantAddress:
          type: string
          description: |
            On the Muster but not in the Bescheid's minimum list, so the
            platform does not collect it and the line renders blank.
        scientificLeadName: { type: string }
        creditSentence: { type: string }

    CompletionInput:
      type: object
      description: |
        The Punktemeldung form, as one request.

        Layout page 13 draws one screen — Titel, Vorname, Nachname, EFN and a
        consent checkbox — behind one button, **Daten übermitteln**. Splitting
        that into three calls would give a physician three ways to end up
        half-submitted: an EFN stored against a course never completed, or a
        completion queued before the consent that authorises it.

        Everything here is optional at the schema level so a host that is not
        this widget can still complete a course on a profile name. What is not
        optional is coherence: Vorname and Nachname are supplied together, and a
        Titel alone is refused.

        `PUT /courses/{slug}/efn` still exists, for correcting an EFN before the
        submission window closes. It is not this.
      properties:
        attestedTitle:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            "Dr. med.", "Prof. Dr." — the layout's `Titel` select. Optional
            even though the layout marks it required, because that select
            offers no empty-but-valid choice and a physician without a title
            still has to be able to finish.
        attestedGivenName:
          type: string
          minLength: 1
          maxLength: 100
          description: Vorname. Supplied together with `attestedFamilyName`.
        attestedFamilyName:
          type: string
          minLength: 1
          maxLength: 100
          description: Nachname. Supplied together with `attestedGivenName`.
        efn:
          type: string
          pattern: "^[0-9]{15}$"
          description: |
            The Einheitliche Fortbildungsnummer, arriving with the rest of the
            form rather than through a separate request.

            **The layout says eighteen digits** ("Die 18-stellige EFN") and its
            placeholder is eighteen characters long. The platform validates
            fifteen, which is what the EIV requirements were written from.
            Unresolved — see S21 in docs/show-stoppers.md. A validator wrong in
            either direction fails where the learner cannot see it.
        consentDocument:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The privacy notice the learner agreed to, by version, when they
            ticked the consent box on layout page 13.

            Stored with the timestamp of the completion it authorises. GDPR
            Art. 7(1) puts the burden of demonstrating consent on the
            controller, and a boolean would record only that somebody agreed to
            something — consent to the January wording is not consent to the
            June wording.

    Branding:
      type: object
      description: |
        Every field optional. An absent or invalid value falls back to the
        widget's own default, which is always valid — a malformed branding
        record must not be able to break a learner's screen.

        Values are validated against strict grammars in `@ds/domain` before
        storage **and** on read, because each one ends up inside a CSS
        declaration on a page that holds a bearer token. Invalid values are
        dropped, never repaired.
      properties:
        logoUrl:
          type: string
          description: HTTPS only. Accepted only together with `logoAlt`.
        logoAlt:
          type: string
          maxLength: 200
          description: |
            Required whenever a logo is set. A logo a screen reader announces
            as "image" is worse than no logo (CLAUDE.md §3).
        primaryColor:
          type: string
          pattern: "^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$"
        primaryContrastColor:
          type: string
          pattern: "^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$"
        accentColor:
          type: string
          pattern: "^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$"
        fontFamily:
          type: string
          maxLength: 200
          description: |
            A CSS font stack, e.g. `Inter, system-ui, sans-serif`. **Not a
            URL.** Characters that could terminate a CSS declaration are
            rejected, so `url(` cannot be expressed.
        fontFamilyName:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9 _-]{1,64}$"
          description: |
            The family name of the customer's **uploaded** font, if they have
            one. Set by the server from the project row, never by a client: it
            has to match what the upload stored, or the `@font-face` rule names
            a family nothing declares.

            Present only together with `fontVersion`. When both are present the
            uploaded family goes first in the CSS stack, so `fontFamily` is what
            the browser uses while the file downloads or if it fails.
        fontVersion:
          type: string
          maxLength: 40
          description: |
            Cache-busting token for `GET /branding/font` — the upload
            timestamp. Present only together with `fontFamilyName`.
        cornerRadiusPx:
          type: integer
          minimum: 0
          maximum: 24

        # The catalogue hero, and the consent link (P29-02).
        #
        # These seven were parsed and validated by `@ds/domain`, stored in
        # `projects.branding`, and read by the widget on every render — and
        # published by nothing. A field the contract does not name is a field no
        # generated client can send and no console form can bind to, so all
        # seven were settable only by writing JSON into the column by hand.
        catalogTitle:
          type: string
          maxLength: 120
          description: |
            Replaces the catalogue heading. Plain text, rendered as text.

            The widget's own wording names no therapeutic area, which is right
            for every customer and specific to none. "Fortbildungsbereich für
            ADHS" is MEDICE's copy, and a second customer reading it would be
            reading MEDICE's.
        catalogIntro:
          type: string
          maxLength: 400
          description: Replaces the catalogue's intro paragraph. Plain text.
        catalogHeroImageUrl:
          type: string
          description: HTTPS only. Decorative photograph behind the hero.
        catalogSealImageUrl:
          type: string
          description: |
            The customer's own accreditation seal. HTTPS only, and accepted
            only together with `catalogSealAlt` — a CME seal is the claim that
            the course is accredited, so an unlabelled one is a screen reader
            saying "image" where a physician needs to be told what it certifies.
        catalogSealAlt:
          type: string
          maxLength: 200
          description: Alternative text for the seal. Required whenever one is set.
        privacyPolicyUrl:
          type: string
          description: |
            Where the completion screen's **Datenschutzerklärung** link points.

            Accepted only together with `privacyPolicyVersion`: a link with no
            version produces a consent record that names nothing, and a version
            with no link asks a physician to agree to a document they cannot
            read. When either is absent the consent checkbox is not drawn and
            no consent is claimed — which is why, until this pair was
            publishable, `enrolments.consent_document` was empty on every
            completion the platform had ever recorded.
        privacyPolicyVersion:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]{1,64}$"
          description: |
            The version written to `enrolments.consent_document`, and what
            makes the stored consent demonstrable under GDPR Art. 7(1).
            Consent to the January wording is not consent to the June wording,
            and a record that cannot tell them apart proves only that somebody
            agreed to something.

    FontUpload:
      type: object
      description: |
        A white-label font. See `PUT /admin/branding/font` for why the declared
        type is not believed and why SVG cannot be expressed here at all.
      required: [fontBase64, fontFamilyName]
      properties:
        fontBase64:
          type: string
          maxLength: 2800000
          description: The file, base64, without a `data:` prefix. 2 MB decoded.
        fontMime:
          type: string
          enum: [font/woff2, font/woff]
          description: |
            Optional, and only ever cross-checked against the sniffed format. A
            mismatch is a 422; an absent value is fine.
        fontFamilyName:
          type: string
          pattern: "^[A-Za-z0-9 _-]{1,64}$"
          description: |
            What the CSS will call this family. Narrow because it is emitted
            inside an `@font-face` block, where a brace ends the rule.

    FontState:
      type: object
      description: |
        Metadata about the stored font. Never the bytes — those come from
        `GET /branding/font`.
      required: [fontFamilyName, fontVersion, fontBytes]
      properties:
        fontFamilyName:
          type: string
          nullable: true
        fontVersion:
          type: string
          nullable: true
          description: The upload timestamp; append as `?v=` to the font URL.
        fontBytes:
          type: integer
          nullable: true
          minimum: 0

    AdminCourseSummary:
      type: object
      description: |
        A course as an admin sees it. Carries no secret and no image bytes —
        only whether one is stored. A field that can be read is a field that
        can leak, and one of them authenticates DigitalSpital to a legally
        binding accreditation interface.
      required:
        [
          slug,
          title,
          description,
          deliveryType,
          thema,
          altersgruppe,
          learningObjectives,
          targetAudience,
          prerequisites,
          heroImageUrl,
          fortbildungsnummer,
          validFrom,
          validTo,
          vnr,
          cmePoints,
          cmeCategory,
          requiredWatchPercent,
          passThresholdPercent,
          enrolmentCount,
          completedCount,
          certificateReady,
          missingCertificateFields,
        ]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        deliveryType:
          type: string
          enum: [on_demand, live, praesenz]
          description: Which catalogue tab the course appears under.
        thema:
          type: array
          items: { type: string }
          description: |
            Filter facets, free text rather than a fixed taxonomy — the set
            differs per customer and a shared enum would need migrating every
            time somebody added one.
        altersgruppe:
          type: array
          items: { type: string }
        learningObjectives:
          type: array
          items: { type: string }
          description: The Lernziele checklist, in the order the layout draws it.
        targetAudience:
          type: [string, "null"]
          description: |
            Zielgruppe. Newlines preserved. The Vorkenntnisse sentence is
            **not** part of this any more — the layout labels it separately, so
            it has its own field.
        prerequisites:
          type: [string, "null"]
          description: The "Vorkenntnisse" paragraph under Zielgruppe (layout page 02).
        heroImageUrl: { type: [string, "null"] }
        fortbildungsnummer: { type: [string, "null"] }
        validFrom: { type: [string, "null"], format: date-time }
        validTo: { type: [string, "null"], format: date-time }
        vnr: { type: [string, "null"] }
        cmePoints: { type: [integer, "null"] }
        cmeCategory: { type: [string, "null"] }
        requiredWatchPercent: { type: integer, minimum: 0, maximum: 100 }
        passThresholdPercent: { type: integer, minimum: 0, maximum: 100 }
        enrolmentCount: { type: integer, minimum: 0 }
        completedCount: { type: integer, minimum: 0 }
        certificateReady:
          type: boolean
          description: |
            Whether this course could issue a valid Teilnahmebescheinigung
            today. Computed with the same rule the certificate endpoint
            enforces.
        missingCertificateFields:
          type: array
          items: { type: string }

    EivEvent:
      type: object
      description: |
        What the Ärztekammer holds about an accredited event. Every field
        optional: this crosses an interface we do not own, and a field the
        authority stops sending must not break an authoring screen.
      properties:
        title: { type: [string, "null"] }
        validFrom:
          type: [string, "null"]
          description: |
            Start of the accredited period. A participation dated outside
            `validFrom`..`validUntil` is refused by EIV.
        validUntil: { type: [string, "null"] }
        category: { type: [string, "null"] }
        attendancePoints: { type: [integer, "null"] }
        assessmentPoints:
          type: [integer, "null"]
          description: |
            Zero here and `eivPunkteLernerfolg` true on the course is the
            combination worth looking at — see S25.
        locked:
          type: [boolean, "null"]
          description: |
            The authority has closed this event to further reporting. No
            further point will ever be credited against it.

    EivReconciliation:
      type: object
      required: [rows, onlyHere, onlyThere]
      description: |
        What this platform sent, against what the authority holds.
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/EivReconciliationRow" }
        onlyHere:
          type: integer
          minimum: 0
          description: |
            Submissions we recorded as accepted that the authority does not
            hold. The serious direction: a physician believes they have points
            that were never credited.
        onlyThere:
          type: integer
          minimum: 0
          description: |
            Participations the authority holds that we have no accepted record
            of — a request that landed after we gave up, or a Meldung somebody
            made in EIV's own web application.

    EivReconciliationRow:
      type: object
      required: [efnMasked, here, there]
      properties:
        efnMasked:
          type: string
          description: |
            Last four digits only. Enough to reconcile a row against a person an
            operator is already looking at; not a disclosure of the EFN.
        here:
          type: boolean
          description: This platform holds an accepted submission.
        there:
          type: boolean
          description: The authority holds a participation.
        participatedOn: { type: [string, "null"] }
        attendance: { type: [boolean, "null"] }
        assessment: { type: [boolean, "null"] }

    AdminCourseDetail:
      allOf:
        - $ref: "#/components/schemas/AdminCourseSummary"
        - type: object
          required:
            [
              organizer,
              eventLocation,
              accreditationBody,
              scientificLeadName,
              scientificLeadTitle,
              certificateIssuePlace,
              hasStampImage,
              hasSignatureImage,
              hasVnrPassword,
              maxQuizAttempts,
              revealCorrectAnswers,
              eivPunkteBasis,
              eivPunkteLernerfolg,
            ]
          properties:
            organizer: { type: [string, "null"] }
            eventLocation: { type: [string, "null"] }
            accreditationBody: { type: [string, "null"] }
            scientificLeadName: { type: [string, "null"] }
            scientificLeadTitle: { type: [string, "null"] }
            certificateIssuePlace: { type: [string, "null"] }
            hasStampImage:
              type: boolean
              description: Presence only. The bytes are never returned.
            hasSignatureImage: { type: boolean }
            hasVnrPassword:
              type: boolean
              description: |
                The only readable trace of the VNR password anywhere in the
                API. Not the value, not a mask, not a length.
            maxQuizAttempts: { type: [integer, "null"] }
            revealCorrectAnswers: { type: boolean }
            eivPunkteBasis:
              type: boolean
              description: |
                Claim `punkte_basis_flag` on the Punktemeldung — credit for
                attending. Which flags an accredited course may claim is a
                question for the Ärztekammer (S25), so it is a course setting
                rather than a constant.
            eivPunkteLernerfolg:
              type: boolean
              description: Claim `punkte_lernerfolg_flag` — credit for the assessment.

    AdminCourseUpdate:
      type: object
      description: |
        A PATCH: every field optional, an absent field means "leave alone".
        `null` clears a nullable text field.
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: [string, "null"], maxLength: 5000 }
        deliveryType: { type: string, enum: [on_demand, live, praesenz] }
        thema:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        altersgruppe:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        learningObjectives:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 500 }
        targetAudience: { type: [string, "null"], maxLength: 5000 }
        prerequisites: { type: [string, "null"], maxLength: 2000 }
        heroImageUrl: { type: [string, "null"], format: uri, maxLength: 2000 }
        cmePoints: { type: [integer, "null"], minimum: 1, maximum: 100 }
        cmeCategory: { type: [string, "null"], maxLength: 50 }
        fortbildungsnummer: { type: [string, "null"], maxLength: 100 }
        eivPunkteBasis: { type: boolean }
        eivPunkteLernerfolg: { type: boolean }
        vnr:
          type: [string, "null"]
          maxLength: 100
          description: |
            The Veranstaltungsnummer the Ärztekammer issued for this course —
            the key **every Punktemeldung is credited against**.

            Writable here because it has to be: `courses.vnr` was readable and
            not settable, so a course authored through this console had none,
            and `queueSubmission` skips a course without one. Every completion
            on every console-authored course silently reported nothing to the
            EIV. The learner passed, got a certificate, and no CME point ever
            reached their Kammer.

            Not format-validated beyond a length bound. The one specimen we
            have is 19 digits, and inventing a rule from a sample of one is how
            a valid VNR from a different Kammer gets refused at authoring time
            (CLAUDE.md §7). The EIV harness is where a bad number is caught,
            against the real interface.

            Distinct from `fortbildungsnummer`, which is what the learner sees
            printed on the Zertifizierung tab. Changing this after completions
            exist does not retro-fix them — submissions snapshot the VNR they
            were queued with.
        validFrom: { type: [string, "null"], format: date-time }
        validTo: { type: [string, "null"], format: date-time }
        requiredWatchPercent: { type: integer, minimum: 0, maximum: 100 }
        passThresholdPercent: { type: integer, minimum: 0, maximum: 100 }
        organizer: { type: [string, "null"], maxLength: 300 }
        eventLocation: { type: [string, "null"], maxLength: 300 }
        accreditationBody: { type: [string, "null"], maxLength: 300 }
        scientificLeadName: { type: [string, "null"], maxLength: 200 }
        scientificLeadTitle: { type: [string, "null"], maxLength: 100 }
        certificateIssuePlace: { type: [string, "null"], maxLength: 200 }
        vnrPassword:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Write-only. Encrypted at rest with the application KMS key, never
            returned by any endpoint and never written to a log.
        acknowledgeAccreditationRisk:
          type: boolean
          description: |
            Required to be true when lowering `passThresholdPercent` below the
            accredited minimum. Without it the request is refused with 409.

    CertificateAssetUpload:
      type: object
      description: |
        Base64 without a `data:` prefix. The magic bytes are checked; the
        declared mime type is treated as a claim, not as truth.
      properties:
        stampImageBase64: { type: string, maxLength: 700000 }
        stampImageMime: { type: string, enum: [image/png, image/jpeg] }
        signatureImageBase64: { type: string, maxLength: 700000 }
        signatureImageMime: { type: string, enum: [image/png, image/jpeg] }

    EivState:
      type: string
      description: |
        `needs_attention` is distinct from `failed` on purpose: a submission
        unresolved after the fast retries will not fix itself, and the paper
        fallback is only open while the 8-day deadline has not passed.

        `withdrawn` means an operator took a reported Punktemeldung back at the
        Ärztekammer (P31-02). Distinct from `none`: points were reported and
        then removed, which is a different history from never having been
        reported, and the physician may reasonably ask about it.
      enum: [none, queued, submitted, failed, needs_attention, abandoned, withdrawn]

    ParticipantRow:
      type: object
      description: |
        One participant's status. The EFN itself never appears — only whether
        one is on file (ADR-0004).
      required:
        [
          enrolmentId,
          participantName,
          email,
          efnPresent,
          watchedPercent,
          quizPassed,
          evaluationSubmitted,
          progressPercent,
          courseComplete,
          complete,
          completedAt,
          courseCompletedAt,
          eivState,
          eivAttempts,
          eivReportDueAt,
          certificateState,
        ]
      properties:
        enrolmentId: { type: string, format: uuid }
        participantName: { type: string }
        email: { type: [string, "null"] }
        efnPresent: { type: boolean }
        watchedPercent: { type: integer, minimum: 0, maximum: 100 }
        quizPassed: { type: boolean }
        evaluationSubmitted: { type: boolean }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        courseComplete:
          type: boolean
          description: |
            Videos watched and Lernerfolgskontrolle passed. A participant can
            sit here for days before supplying the Evaluationsbogen and their
            EFN; a list showing only `complete` reports them as drop-outs.
        complete:
          type: boolean
          description: Certified — the point is earned and the Punktemeldung queued.
        completedAt: { type: [string, "null"], format: date-time }
        courseCompletedAt:
          type: [string, "null"]
          format: date-time
          description: Null on enrolments certified before the date was recorded.
        eivState: { $ref: "#/components/schemas/EivState" }
        eivAttempts: { type: integer, minimum: 0 }
        eivReportDueAt: { type: [string, "null"], format: date-time }
        certificateState:
          type: string
          enum: [none, pending, issued, delivered, bounced]

    ParticipantList:
      type: object
      required: [courseSlug, rows]
      properties:
        courseSlug: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ParticipantRow" }

    EfnInput:
      type: object
      required: [efn]
      properties:
        efn:
          type: string
          pattern: "^[0-9]{15}$"
          description: 15 digits. Never returned by any endpoint once stored.

    CourseListResponse:
      type: object
      required: [items, page, perPage, total, facets]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CourseSummary" }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        facets:
          type: object
          required: [thema, altersgruppe]
          properties:
            thema:
              type: array
              items: { $ref: "#/components/schemas/FacetCount" }
            altersgruppe:
              type: array
              items: { $ref: "#/components/schemas/FacetCount" }

    # -----------------------------------------------------------------------
    # Authoring (P9-02, P9-04, P9-05)
    #
    # Two families of shape here, and the difference is deliberate.
    #
    # *Read* shapes (`CourseStructure`, `AuthoringQuiz`, `AuthoringEvaluation`)
    # carry counts of learner records alongside the content. The console needs
    # them to disable deletion **and say why** before an author clicks, rather
    # than after.
    #
    # *Write* shapes carry no `ordinal` field anywhere. Position is expressed
    # by position in an array. A client that can set ordinals directly can set
    # two siblings to the same one, and `UNIQUE (parent_id, ordinal)` then turns
    # an authoring mistake into a 500.
    # -----------------------------------------------------------------------

    Slug:
      type: string
      pattern: "^[a-z0-9-]{1,100}$"
      description: |
        Lowercase letters, digits and hyphens. Must not begin or end with a
        hyphen — checked separately rather than folded into the pattern, since
        the natural regex for it nests quantifiers.

    DepartmentSummary:
      type: object
      required: [slug, name, projectCount]
      properties:
        slug: { type: string }
        name: { type: string }
        projectCount:
          type: integer
          minimum: 0
          description: Projects under this department, in this tenant.

    LearnerRecord:
      type: object
      required:
        [
          userId,
          enrolmentId,
          courseSlug,
          courseTitle,
          attestedName,
          maskedEfn,
          watchedPercent,
          quizBestPercent,
          completedAt,
          submissionStage,
          certificateStatus,
        ]
      properties:
        userId: { type: string, format: uuid }
        enrolmentId: { type: string, format: uuid }
        courseSlug: { type: string }
        courseTitle: { type: string }
        attestedName:
          type: [string, "null"]
          description: The name the physician attested for their certificate.
        maskedEfn:
          type: [string, "null"]
          description: |
            Last four digits only, the rest replaced with bullets. The whole
            value is never returned to any staff role (ADR-0004).
        watchedPercent: { type: integer, minimum: 0, maximum: 100 }
        quizBestPercent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        completedAt: { type: [string, "null"], format: date-time }
        submissionStage:
          type: string
          enum: [none, pending, submitted, abandoned, withdrawn]
          description: |
            How far the Punktemeldung has got. `submitted` is what makes a name
            correction refusable — and so is `withdrawn`, because the withdrawal
            zeroed the points without unsaying the name (P31-02).
        certificateStatus: { type: [string, "null"] }

    CertificateRecord:
      type: object
      required: [id, enrolmentId, participantName, status, issuedAt, deliveredAt]
      properties:
        id: { type: string, format: uuid }
        enrolmentId: { type: string, format: uuid }
        participantName: { type: string }
        status:
          type: string
          enum: [pending, issued, delivered, bounced, revoked]
        issuedAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }

    StaffScope:
      type: object
      required: [role, customerId, departmentId]
      description: |
        What an operator may reach. `customerId` is null only for `super_admin`
        — a customer is the tenant boundary, and the database CHECK enforces
        the pairing.
      properties:
        role:
          type: string
          enum: [course_editor, department_admin, customer_admin, super_admin]
        customerId: { type: [string, "null"], format: uuid }
        departmentId: { type: [string, "null"], format: uuid }

    StaffInvitation:
      allOf:
        - $ref: "#/components/schemas/StaffScope"
        - type: object
          required: [email, displayName]
          properties:
            email: { type: string, format: email, maxLength: 320 }
            displayName: { type: string, minLength: 1, maxLength: 200 }

    StaffAccount:
      type: object
      required: [id, email, displayName, disabledAt, lastLoginAt, totpEnrolled, grants]
      description: |
        Carries no password hash and no TOTP secret — only whether a second
        factor is enrolled. When somebody enrolled their authenticator is
        nobody's business but theirs.
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        disabledAt: { type: [string, "null"], format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }
        totpEnrolled: { type: boolean }
        grants:
          type: array
          items: { $ref: "#/components/schemas/StaffScope" }

    CustomerSummary:
      type: object
      required: [id, slug, name, createdAt, departmentCount, projectCount, courseCount]
      description: |
        A customer plus how much is inside it. The counts come back with the
        list because the console shows them on the same screen and because a
        follow-up query would be tenant-scoped — counting another customer's
        courses means opening a tenant context on that customer, which is
        precisely what the caller has not been authorised to do.
      properties:
        id:
          type: string
          format: uuid
          description: |
            The customer's own id. Exposed because a grant references it —
            scoping an operator account to a customer needs this value, and
            only a super admin can reach this endpoint at all.
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        departmentCount: { type: integer, minimum: 0 }
        projectCount: { type: integer, minimum: 0 }
        courseCount: { type: integer, minimum: 0 }

    CustomerCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }

    CustomerUpdate:
      type: object
      required: [name]
      description: |
        No slug. See `adminUpdateCustomer` — re-slugging is a rename of the
        thing itself, not a display change.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    DepartmentCreate:
      type: object
      required: [slug, name]
      description: |
        Names no customer. `customer_id` comes from the RLS session variable, so
        there is no field capable of creating a department into another tenant
        (ADR-0002).
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 300 }

    DepartmentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }

    ProjectSummary:
      type: object
      description: |
        Carries the Keycloak binding and the SMTP settings, and **never** the
        SMTP password. `hasSmtpPassword` is its only readable trace, exactly as
        `hasVnrPassword` is for a course (CLAUDE.md §4 invariant 7).
      required:
        [
          slug,
          name,
          departmentSlug,
          identityProvider,
          loginUrl,
          keycloakIssuer,
          keycloakAudience,
          keycloakRealm,
          smtpHost,
          smtpPort,
          smtpUsername,
          smtpFromAddress,
          smtpFromName,
          hasSmtpPassword,
          embedOrigins,
          branding,
          courseCount,
        ]
      properties:
        slug: { type: string }
        name: { type: string }
        departmentSlug: { type: string }
        loginUrl: { type: [string, "null"] }
        identityProvider:
          allOf: [{ $ref: "#/components/schemas/IdentityProvider" }]
          description: |
            Returned so the console can show what it set. The Keycloak fields
            below are meaningless when this is `local`, and the form says so
            rather than presenting three inputs nothing reads.
        keycloakIssuer: { type: [string, "null"] }
        keycloakAudience: { type: [string, "null"] }
        keycloakRealm: { type: [string, "null"] }
        smtpHost: { type: [string, "null"] }
        smtpPort: { type: [integer, "null"] }
        smtpUsername: { type: [string, "null"] }
        smtpFromAddress: { type: [string, "null"] }
        smtpFromName: { type: [string, "null"] }
        hasSmtpPassword:
          type: boolean
          description: Presence only. The ciphertext is never returned.
        embedOrigins:
          type: array
          items: { type: string }
          description: |
            Origins allowed to embed this project's widget — a customer's own
            site. This used to be `EXTRA_CORS_ORIGINS` in the deployment's env
            file, which made it the union across every customer on the
            installation: adding a second customer widened the list for the
            first (P18-04).
        branding: { $ref: "#/components/schemas/Branding" }
        courseCount: { type: integer, minimum: 0 }

    ParticipantAccount:
      type: object
      description: |
        A **person** who learns with this customer, as an administrator sees
        them. Contrast `LearnerRecord`, which is one enrolment — a person per
        course. Somebody created two minutes ago has no enrolment and appears
        in no `LearnerRecord`, which is exactly when they most need finding.

        Carries no EFN, masked or otherwise: this screen is about accounts, and
        an identifier that is not needed to do the job does not belong in the
        response (ADR-0004).
      required:
        [userId, email, firstName, lastName, enrolmentCount, completedCount, createdAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        credential:
          type: [object, "null"]
          description: |
            Absent when this person signs in through the customer's own identity
            provider. Nothing on this screen can act on such an account's
            password, and the console greys the buttons rather than offering
            ones that would 409.
          required: [mustChange, disabled, lockedUntil]
          properties:
            mustChange:
              type: boolean
              description: They have not yet chosen their own password.
            disabled:
              type: boolean
              description: |
                Stopped by an administrator. Deliberate and permanent, unlike
                `lockedUntil`.
            lockedUntil:
              type: [string, "null"]
              format: date-time
              description: |
                The automatic lockout after repeated failed sign-ins. Expires on
                its own; nobody has to clear it.
        enrolmentCount: { type: integer, minimum: 0 }
        completedCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }

    ProjectCreate:
      type: object
      required: [departmentSlug, slug, name]
      properties:
        departmentSlug: { $ref: "#/components/schemas/Slug" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 300 }
        identityProvider: { $ref: "#/components/schemas/IdentityProvider" }

    IdentityProvider:
      type: string
      enum: [keycloak, local]
      description: |
        How this project's learners are authenticated (ADR-0012).

        `keycloak` — the customer runs the identity provider and the widget
        arrives with one of their tokens. Needs `keycloakIssuer` and
        `keycloakAudience` before any learner can sign in; `deploy.sh` warns
        about a project that has one without the other.

        `local` — participants hold a credential on this platform and sign in at
        `fortbildung.…/<project>` (P21-03). This is the only value the
        standalone portal can serve, and it was settable by **no API at all**
        until the journey suite tried to build a working portal project through
        the console and could not: the column defaulted to `keycloak`, so every
        project the console created was one its own participants were locked out
        of.

        Omitted on create means `keycloak`, which is what every existing row
        already is.

    ProjectUpdate:
      type: object
      description: |
        Every field optional; absent means unchanged. `smtpPassword` is
        write-only — settable here, returned by nothing.

        The Keycloak binding decides which realm every token for this project is
        validated against (ADR-0003), so a wrong value locks every learner out
        at once. The console confirms before saving it; the API applies what it
        is given, because refusing to let an admin change their own IdP would be
        a worse failure than the one it prevented.
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        loginUrl:
          type: [string, "null"]
          maxLength: 2000
          description: |
            The customer's **own** sign-in page, when they have one.

            `GET /tenants/{slug}` returns `kind: external` with this URL, and
            the portal's tenant page sends a visitor there instead of showing
            its own password form. MEDICE sign in through their WordPress site,
            so `/medice` must link there — the alternative the portal used to do
            was redirect straight to `login.medice.de`, a route MEDICE never
            asked for.

            HTTPS only, enforced by a database CHECK as well as here. Null means
            the portal's own participant sign-in applies.

            Settable nowhere until P29-03: the column existed, the lookup read
            it, the portal branched on it, and no API could write it — so every
            project answered `kind: portal` whatever the customer actually used.
        identityProvider:
          allOf: [{ $ref: "#/components/schemas/IdentityProvider" }]
          description: |
            Changeable, because a customer that starts on the standalone portal
            and later stands up a Keycloak realm should not need a new project
            — and a project created before this field existed is `keycloak`
            whether or not that is what it wanted.

            It changes how every participant of the project signs in, so it is
            audited by name like the rest. Existing `person_credentials` rows
            are not migrated: a participant with a local password does not
            acquire a Keycloak identity by this switch, and switching back does
            not delete the password they had.
        keycloakIssuer: { type: [string, "null"], format: uri, maxLength: 2000 }
        keycloakAudience: { type: [string, "null"], maxLength: 200 }
        keycloakRealm: { type: [string, "null"], maxLength: 200 }
        embedOrigins:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: "^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$"
          description: |
            Scheme + host + optional port, which is exactly what a browser puts
            in an `Origin` header. A path or a trailing slash silently never
            matches, so both are refused here and by a database CHECK — a
            console is not the only way rows get written.
        smtpHost: { type: [string, "null"], maxLength: 300 }
        smtpPort: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        smtpUsername: { type: [string, "null"], maxLength: 300 }
        smtpPassword:
          type: string
          minLength: 1
          maxLength: 300
          writeOnly: true
          description: |
            Encrypted with the application KMS key before storage. An empty
            string is rejected rather than read as "clear it" — clearing a
            password by sending nothing is too easy to do by accident.
        smtpFromAddress: { type: [string, "null"], format: email, maxLength: 300 }
        smtpFromName: { type: [string, "null"], maxLength: 200 }
        branding:
          type: object
          additionalProperties: true
          description: |
            Send a `Branding`. Typed open rather than as `$ref: Branding`
            because the server is deliberately lenient here: the grammars that
            decide what a valid colour or font stack is live in `@ds/domain`,
            the *parsed* result is what gets stored, and anything unrecognised
            is dropped rather than rejected or repaired. Restating those
            grammars in this document would be a second copy to keep in step.

            What comes back on the next read is the parsed value — see
            `ProjectSummary.branding`.

    CourseCreate:
      type: object
      required: [projectSlug, slug, title]
      description: |
        Deliberately minimal. Everything a certificate needs is set afterwards
        on the settings screen, which already refuses a pass threshold below the
        accredited minimum and reports the missing fields. Duplicating those
        rules into a creation form would be a second place to get them wrong.
      properties:
        projectSlug: { $ref: "#/components/schemas/Slug" }
        slug: { $ref: "#/components/schemas/Slug" }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: [string, "null"], maxLength: 20000 }
        deliveryType: { $ref: "#/components/schemas/DeliveryType" }

    AuthoringContent:
      type: object
      required:
        [
          id,
          kind,
          title,
          body,
          sources,
          posterUrl,
          captionsUrl,
          durationSec,
          fileUrl,
          fileSize,
          mimeType,
          learnerRecords,
          questionCount,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ContentKind" }
        title: { type: string }
        body: { type: [string, "null"] }
        sources:
          type: array
          description: |
            The stored list, **unresolved** — an `s3://` reference is returned as
            written. The console edits what is stored; presigning here would
            hand an author a URL that expires while they are still looking at
            the form, and would put a live capability in a response whose whole
            purpose is editing.
          items: { $ref: "#/components/schemas/MediaSourceWrite" }
        posterUrl: { type: [string, "null"] }
        captionsUrl: { type: [string, "null"] }
        durationSec: { type: [integer, "null"] }
        fileUrl: { type: [string, "null"] }
        fileSize: { type: [integer, "null"] }
        mimeType: { type: [string, "null"] }
        learnerRecords:
          type: integer
          minimum: 0
          description: |
            How many learner records point at this item. Non-zero disables
            deletion in the console and explains itself there, rather than
            letting an author click delete and receive a refusal to interpret.
        questionCount:
          type: [integer, "null"]
          description: Quiz items only. Zero is a quiz nobody can pass.

    AuthoringChapter:
      type: object
      required: [id, title, body, contents]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: [string, "null"] }
        contents:
          type: array
          items: { $ref: "#/components/schemas/AuthoringContent" }

    AuthoringModule:
      type: object
      required: [id, title, subtitle, chapters]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        chapters:
          type: array
          items: { $ref: "#/components/schemas/AuthoringChapter" }

    AuthoringExpert:
      type: object
      required: [id, roleLabel, name, institution, biography, photoUrl]
      properties:
        id: { type: string, format: uuid }
        roleLabel: { type: string }
        name: { type: string }
        institution: { type: [string, "null"] }
        biography: { type: [string, "null"] }
        photoUrl: { type: [string, "null"] }

    CourseStructure:
      type: object
      description: |
        The whole authoring tree, in author order. Returned by every structure
        mutation as well as the GET, so the console never has to reconstruct
        what the server now holds — and never disagrees with it.
      required: [courseSlug, title, modules, experts]
      properties:
        courseSlug: { type: string }
        title: { type: string }
        modules:
          type: array
          items: { $ref: "#/components/schemas/AuthoringModule" }
        experts:
          type: array
          items: { $ref: "#/components/schemas/AuthoringExpert" }

    ModuleWrite:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        subtitle: { type: [string, "null"], maxLength: 300 }

    ChapterWrite:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        body: { type: [string, "null"], maxLength: 20000 }

    ContentWrite:
      type: object
      required: [kind, title]
      description: |
        Every field is accepted for every kind; the rules are applied by
        `contentProblems` in `@ds/domain` rather than by this document, so there
        is one place that knows a `video` needs a `durationSec` instead of five
        branches here and five more in the console.

        That one is not stylistic: the watch requirement is a percentage of a
        known length, and a video with no length would be skippable while
        appearing to count toward a CME point. It is refused with a 422 naming
        the field.
      properties:
        kind: { $ref: "#/components/schemas/ContentKind" }
        title: { type: string, minLength: 1, maxLength: 300 }
        body: { type: [string, "null"], maxLength: 20000 }
        sources:
          type: array
          maxItems: 10
          description: |
            Playable renditions, in the author's order. Required to be non-empty
            for a `video`; ignored for every other kind. Capped because a
            handful of encodings is the real use and an unbounded list is a
            payload with no reason to be one.
          items: { $ref: "#/components/schemas/MediaSourceWrite" }
        posterUrl:
          type: [string, "null"]
          maxLength: 2000
          description: |
            An absolute URL, or an `s3://` reference produced by
            `adminCompleteUpload`. No `format: uri`, for the same reason
            `MediaSourceWrite.url` has none — a stored reference is not a URL.
            A reference outside the caller's own storage prefix is refused with
            a 422.
        captionsUrl:
          type: [string, "null"]
          maxLength: 2000
          description: |
            WebVTT. Owed for every video carrying speech — WCAG 1.2.2 is Level
            A — but not enforced: a slide-only recording legitimately has none,
            and the server cannot tell the two apart. The console asks for it
            and says why.

            An absolute URL or an `s3://` reference, as `posterUrl`.
        durationSec: { type: [integer, "null"], minimum: 1, maximum: 86400 }
        fileUrl:
          type: [string, "null"]
          maxLength: 2000
          description: An absolute URL or an `s3://` reference, as `posterUrl`.
        fileSize: { type: [integer, "null"], minimum: 0 }
        mimeType: { type: [string, "null"], maxLength: 200 }

    UploadPurpose:
      type: string
      enum: [video, captions, poster, material]
      description: |
        What the file is for. Decides both the accepted content types and the
        size ceiling — a PDF is a perfectly good `material` and a mistake as a
        `poster`, and only a per-purpose list catches that.

    UploadRequest:
      type: object
      required: [purpose, mimeType, sizeBytes]
      description: |
        A claim about a file, all of which is checked. Note what is *not* here:
        no key, no prefix, no bucket and no filename. Those are derived from the
        validated session and the course, which is what makes the tenant
        boundary hold in a store with no row-level security.
      properties:
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        mimeType:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            As the file picker reported it. A `; charset=…` parameter is
            tolerated and dropped; the bare type is what gets signed.
        sizeBytes:
          type: integer
          minimum: 1
          description: |
            The exact byte length, which becomes a **signed** header. A browser
            computes `Content-Length` from the body and will not let script set
            it, so a file of a different length simply fails to verify at the
            bucket. The per-purpose ceiling is enforced here, before anything is
            signed.

    UploadTicket:
      type: object
      required: [key, url, method, headers, expiresAt]
      description: |
        A capability with an expiry. Send the body to `url` with `method` and
        exactly these `headers`; anything else is refused by the bucket, because
        the type and the length are part of the signature.
      properties:
        key:
          type: string
          description: |
            The object's key. Pass it back to `adminCompleteUpload` — not the
            URL, which carries a signature that should not end up in a log.
        url:
          type: string
          description: Short-lived and single-purpose. Do not store or log it.
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            Send verbatim. `Content-Length` is signed too but is not listed: the
            browser sets it from the body and forbids script from doing so,
            which is exactly what makes signing it worth something.
        expiresAt:
          type: string
          format: date-time
          description: After this the signature is refused and a new one is needed.

    UploadCompletion:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 1024
          description: The `key` from the ticket.

    UploadConfirmed:
      type: object
      required: [reference, sizeBytes, mimeType]
      description: |
        What object storage reports, not what the client declared — the two
        agreeing is the point of the check, and echoing the client's numbers
        would quietly discard it.
      properties:
        reference:
          type: string
          description: |
            `s3://<key>`. Store this in a content item's `videoUrl`,
            `posterUrl`, `captionsUrl` or `fileUrl`.
        sizeBytes: { type: integer, minimum: 1 }
        mimeType: { type: string }

    MediaSourceWrite:
      type: object
      description: |
        A rendition as an author supplies it. `url` accepts an `s3://` reference
        as well as an absolute URL, which is why it carries no `format: uri` —
        the media resolver, not this document, decides what a stored reference
        may be.
      required: [url, mimeType]
      properties:
        url: { type: string, minLength: 1, maxLength: 2000 }
        mimeType:
          type: string
          maxLength: 100
          description: |
            One of the types `@ds/domain` accepts. Refused with a 422 naming the
            field rather than stored, because a browser skips an unrecognised
            `type` in silence and the author would ship a video nobody can play.
        label: { type: [string, "null"], maxLength: 60 }

    StructureOrder:
      type: object
      description: |
        Ids only — this shape moves things, it never edits them. A chapter
        listed under a different module than it currently sits in **is** the
        move.

        Every level must be a permutation of what the server holds. A list that
        lost an item during a re-render is rejected rather than obeyed; obeying
        it would delete a chapter from a course learners are part-way through.
      required: [modules]
      properties:
        modules:
          type: array
          items:
            type: object
            required: [id, chapters]
            properties:
              id: { type: string, format: uuid }
              chapters:
                type: array
                items:
                  type: object
                  required: [id, contents]
                  properties:
                    id: { type: string, format: uuid }
                    contents:
                      type: array
                      items: { type: string, format: uuid }

    ExpertsWrite:
      type: object
      required: [experts]
      properties:
        experts:
          type: array
          maxItems: 50
          items:
            type: object
            required: [roleLabel, name]
            properties:
              roleLabel: { type: string, minLength: 1, maxLength: 100 }
              name: { type: string, minLength: 1, maxLength: 200 }
              institution: { type: [string, "null"], maxLength: 300 }
              biography: { type: [string, "null"], maxLength: 20000 }
              photoUrl: { type: [string, "null"], format: uri, maxLength: 2000 }

    AuthoringQuiz:
      type: object
      description: |
        A quiz as its author sees it — **with** the answer key. The only shape
        in this document carrying `isCorrect`, and reachable only from an admin
        route. The learner-facing `QuizOption` has no field capable of holding
        it, which is what makes leaking the key a type error rather than
        something a reviewer has to notice.
      required: [contentId, questions]
      properties:
        contentId: { type: string, format: uuid }
        questions:
          type: array
          items:
            type: object
            required: [id, prompt, kind, answerCount, options]
            properties:
              id: { type: string, format: uuid }
              prompt: { type: string }
              kind: { type: string, enum: [single, multi] }
              answerCount:
                type: integer
                minimum: 0
                description: |
                  Answers recorded against this question. Non-zero refuses
                  deletion: an already-submitted attempt has to keep meaning
                  what it meant when it was scored.
              options:
                type: array
                items:
                  type: object
                  required: [id, label, isCorrect]
                  properties:
                    id: { type: string, format: uuid }
                    label: { type: string }
                    isCorrect: { type: boolean }

    QuizWrite:
      type: object
      description: |
        Diffed, not wiped and rewritten. `id` present means "the existing row,
        changed"; absent means "new"; anything the server holds and this
        document does not name is a deletion — refused, with the count, if a
        learner has answered it.

        Two refusals no form should be trusted with: a question with **no**
        correct option cannot be passed by anybody, and a `single` question with
        **two** correct options cannot either, because scoring is exact-set.
      required: [questions]
      properties:
        questions:
          type: array
          maxItems: 100
          items:
            type: object
            required: [prompt, kind, options]
            properties:
              id: { type: string, format: uuid }
              prompt: { type: string, minLength: 1, maxLength: 2000 }
              kind: { type: string, enum: [single, multi] }
              options:
                type: array
                minItems: 2
                maxItems: 10
                items:
                  type: object
                  required: [label, isCorrect]
                  properties:
                    id: { type: string, format: uuid }
                    label: { type: string, minLength: 1, maxLength: 1000 }
                    isCorrect: { type: boolean }

    AuthoringEvaluation:
      type: object
      required: [courseSlug, questions]
      properties:
        courseSlug: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [id, prompt, kind, required, options, responseCount]
            properties:
              id: { type: string, format: uuid }
              prompt: { type: string }
              kind: { type: string, enum: [scale, text, single] }
              required: { type: boolean }
              options:
                type: array
                items: { type: string }
              responseCount:
                type: integer
                minimum: 0
                description: Responses recorded. Non-zero refuses deletion.

    EvaluationWrite:
      type: object
      description: |
        Same diffing rule as the quiz. The Anerkennung requires an evaluation,
        so an empty one is a course that cannot be completed.

        Note for whoever edits this next: `required` and `options` describe
        their fallbacks in prose rather than with `default:`. `openapi-typescript`
        treats a property carrying `default:` as always present — correct for a
        response, wrong for a request body, where the whole point of a default
        is that the field may be omitted. Adding `default:` here makes the
        generated type require a field the server is happy to supply itself,
        and the DTO-parity test fails.
      required: [questions]
      properties:
        questions:
          type: array
          maxItems: 50
          items:
            type: object
            required: [prompt, kind]
            properties:
              id: { type: string, format: uuid }
              prompt: { type: string, minLength: 1, maxLength: 2000 }
              kind: { type: string, enum: [scale, text, single] }
              required:
                type: boolean
                description: Omitted means `true`.
              options:
                type: array
                maxItems: 20
                items: { type: string, minLength: 1, maxLength: 200 }
                description: |
                  Omitted means none. `scale` and `text` questions do not use
                  it; a `single` question without options is one nobody can
                  answer.
