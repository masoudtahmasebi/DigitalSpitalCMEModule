# The API contract (P0-06 / P2-06). Written before implementation for new
# surface, and the single source the SDK generates from — CI fails if
# packages/sdk/src/generated drifts from this file.
#
# Scope: exactly what the API implements. Endpoints land here first, then in
# code; nothing lands here speculatively. The learner-progress, quiz,
# evaluation and certificate paths arrive with their phases (P3–P8).
#
# Conventions (CLAUDE.md §5):
# - Errors are RFC 7807 problem documents, application/problem+json.
# - Percentages are integers 0–100. Durations are integer seconds.
# - Timestamps are ISO 8601 UTC. German local time is presentation only.
# - 404 for "not visible in this tenant" — existence is never disclosed.

openapi: 3.1.0

info:
  title: DS Education Platform API
  version: 0.1.0
  description: |
    Headless learner API for the DS Education Platform (CME).

    Every request carries two credentials:
    - a **bearer token**, validated server-side against the project's own
      Keycloak realm (signature, issuer, audience, expiry — ADR-0003), and
    - the **X-DS-Project header**, identifying which host surface is calling
      (ADR-0007). The project binding decides the Keycloak realm and pins the
      tenant; a token from another realm is rejected regardless of validity.

    All compliance decisions are server-side. The client renders; it is never
    the source of truth for anything affecting a CME point.

servers:
  - url: /
    description: Relative to wherever the API is deployed.

security:
  - bearerAuth: []

tags:
  - name: health
  - name: catalog
  - name: learning
  - name: assessment
  - name: completion
  - name: certificate

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness/readiness probe
      description: Public — a load balancer cannot present a bearer token.
      security: []
      responses:
        "200":
          description: The API and its database are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /courses:
    get:
      tags: [catalog]
      operationId: listCourses
      summary: List the tenant's courses
      description: |
        Backs the course list screen: the delivery-type tabs, the Thema and
        Altersgruppe filters with their facet counts, pagination, and the card
        metadata line ("5 CME Punkte | 5 Module | 2 Stunden 30 Minuten").
        Rows are scoped to the caller's tenant by PostgreSQL RLS (ADR-0002).
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: thema
          in: query
          schema: { type: string }
        - name: altersgruppe
          in: query
          schema: { type: string }
        - name: deliveryType
          in: query
          schema: { $ref: "#/components/schemas/DeliveryType" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: One page of courses plus facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseListResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}:
    get:
      tags: [catalog]
      operationId: getCourseBySlug
      summary: One course with its full module tree
      description: |
        The whole tree in one response — modules, chapters, contents, experts —
        so the detail view does not waterfall. Quiz contents carry no options
        and no answers here; the assessment endpoints (P4) own those, and the
        answer key never appears in any learner-facing shape.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The course detail tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /courses/{slug}/enrolment:
    put:
      tags: [learning]
      operationId: enrol
      summary: Start (or resume) this course
      description: |
        Idempotent: PUT again and the existing enrolment comes back unchanged.
        On first call the course's compliance settings — required watch
        percentage, pass threshold, CME points, VNR — are **snapshotted onto
        the enrolment**, so a later edit to the course record cannot
        retroactively invalidate work already done (P3-01).
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The enrolment state, existing or newly created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    get:
      tags: [learning]
      operationId: getEnrolment
      summary: Progress, gating and resume point
      description: |
        The single resource the player screen renders from: the "Ihr
        Fortschritt — X von Y" ring, each module's and chapter's lock state,
        the resume target for "Fortbildung fortsetzen", and the outstanding
        conditions still standing between the learner and their CME points.

        Every value here is computed server-side from stored progress
        (`@ds/domain`); the client never supplies a percentage or a lock state.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The current enrolment state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No enrolment yet, or the course is not visible.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /courses/{slug}/contents/{contentId}:
    get:
      tags: [learning]
      operationId: getLesson
      summary: Open a lesson
      description: |
        The lesson payload — the video URL or the text body — served **only
        after the sequence gate agrees**.

        This is why `CourseDetail` carries no `videoUrl`: a browse response
        listing every video URL in the course would make the padlock on a later
        chapter decorative, since the URL would already be readable while the
        first chapter is unfinished. Here the gate is checked before anything
        is produced, by the same `requireReachableContent` the progress and
        quiz endpoints use.

        A quiz is not openable here — it has its own endpoint whose response
        shape cannot carry a correct answer.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: The lesson.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonContent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            The sequence gate refuses: an earlier chapter is still outstanding.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}/contents/{contentId}/progress:
    post:
      tags: [learning]
      operationId: recordProgress
      summary: Report watched intervals for a video
      description: |
        The client reports **which intervals it played**, never a percentage.
        The server merges them into the stored union and recomputes coverage
        (`CLAUDE.md` §4 invariant 5) — a maximum-position implementation would
        make the gate skippable by dragging the scrub bar.

        Segments claiming more playback than wall-clock time elapsed since the
        last report are rejected and named in `rejected`, so tampering is
        visible rather than silently discarded. The response always carries
        the server's own recomputed figures.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressReport" }
      responses:
        "200":
          description: Progress after merging the accepted intervals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            The content is locked — everything before it is not yet complete.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}/contents/{contentId}/quiz:
    get:
      tags: [assessment]
      operationId: getQuiz
      summary: The Lernerfolgskontrolle questions
      description: |
        Questions and options with **no correctness marker of any kind** — the
        shape has nowhere to put one (P4-01). Scoring happens exclusively
        server-side.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: The quiz, without answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quiz" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Locked until the preceding content is complete.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [assessment]
      operationId: submitQuiz
      summary: Submit an attempt
      description: |
        Scored server-side against the enrolment's snapshotted pass threshold.
        The response reports the score and pass/fail; per-question correctness
        is recorded in the attempt but only returned when the course sets
        `revealCorrectAnswers`, which a CME-certified course never does.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizSubmission" }
      responses:
        "200":
          description: The scored attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizAttemptResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Locked, or the attempt limit is exhausted.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}/materials:
    get:
      tags: [learning]
      operationId: getMaterials
      summary: The Mediathek — downloadable material, grouped by module
      description: |
        Backs the Mediathek tab. Material belonging to a module the learner has
        not finished is returned **locked and without its download URL** — the
        padlocked section in the layout, with "Wird nach Abschluss der Module
        freigeschaltet".

        Withholding the URL rather than only a flag is the point: a `locked:
        true` the client is trusted to honour is not a gate, it is a
        suggestion.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: Material grouped by module, with lock state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialLibrary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /courses/{slug}/evaluation:
    get:
      tags: [completion]
      operationId: getEvaluation
      summary: The evaluation questionnaire
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The questionnaire and whether it is already submitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [completion]
      operationId: submitEvaluation
      summary: Submit the evaluation
      description: |
        Required for completion (the Anerkennungsbescheid makes it a condition
        of the Punktemeldung). Free-text answers are personal data and never
        reach a log (ADR-0004).
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationSubmission" }
      responses:
        "200":
          description: Enrolment state after recording the evaluation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already submitted.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /courses/{slug}/certificate:
    get:
      tags: [certificate]
      operationId: getCertificate
      summary: The certificate's fields
      description: |
        The assembled Teilnahmebescheinigung data, for rendering a preview
        before download. Available only once the course is complete.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The certificate data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not enrolled, or the course is not complete.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /courses/{slug}/certificate/pdf:
    get:
      tags: [certificate]
      operationId: downloadCertificate
      summary: Download the Teilnahmebescheinigung as a PDF
      description: |
        Renders the ÄKWL Muster: participant, course, both VNR barcodes
        (Code 39 and Datamatrix), the participation date, the creditability
        sentence, and the stamp and signature of the course's Wissenschaftliche
        Leitung.

        Refuses with 409 if the course has no stamp or signature configured —
        the Bescheid makes a certificate without them invalid, and issuing an
        invalid-looking document to a physician who has earned their points is
        worse than telling the admin their course is incomplete.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          description: The certificate.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Not complete, or the course is missing its signing assets.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /profile/efn:
    put:
      tags: [completion]
      operationId: setEfn
      summary: Store the learner's EFN
      description: |
        The EFN (Einheitliche Fortbildungsnummer) is 15 digits and is the key
        the Ärztekammer credits points against. Stored once per user, not per
        enrolment (ADR-0004), and never written to a log.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EfnInput" }
      responses:
        "204":
          description: Stored.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422":
          description: Not a valid 15-digit EFN.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /courses/{slug}/completion:
    post:
      tags: [completion]
      operationId: completeCourse
      summary: Finalise the course and report the points
      description: |
        Re-checks every condition server-side — watch coverage, quiz pass,
        evaluation, EFN — and refuses if any is outstanding, naming which.
        On success it stamps completion and queues the EIV submission with its
        statutory deadlines (8 days to report, 7 to correct). Idempotent: a
        second call returns the same completed state without re-queueing.
      parameters:
        - $ref: "#/components/parameters/ProjectHeader"
        - $ref: "#/components/parameters/CourseSlug"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletionInput" }
      responses:
        "200":
          description: Completed; the CME points are queued for reporting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolmentState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Conditions are still outstanding; `detail` names which, and the
            enrolment is unchanged.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak access token. Verified against the realm bound to the
        X-DS-Project header — issuer and audience come from that binding,
        never from the token (ADR-0003).

  parameters:
    CourseSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }

    ContentId:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ProjectHeader:
      name: X-DS-Project
      in: header
      required: true
      description: |
        Project slug identifying the calling host surface (ADR-0007). Resolves
        the Keycloak realm to validate against and pins the tenant. Unknown or
        unbound slugs are a generic 401 — never a 404 that would confirm or
        deny a project's existence.
      schema: { type: string }

  responses:
    Unauthenticated:
      description: |
        Missing/invalid token, missing project header, or unknown project.
        Always the same generic document — the reason is logged server-side
        only.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Authenticated, but no grant reaches this tenant.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: |
        Not found — or not visible in this tenant; the two are
        indistinguishable by design.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ValidationFailed:
      description: One or more request parameters are invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807. No stack traces, no internal identifiers.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]

    DeliveryType:
      type: string
      description: The course list's three tabs.
      enum: [on_demand, live, praesenz]

    CourseSummary:
      type: object
      description: One card on the course list screen.
      required:
        - id
        - slug
        - title
        - description
        - heroImageUrl
        - deliveryType
        - thema
        - altersgruppe
        - cmePoints
        - cmeCategory
        - moduleCount
        - totalDurationSec
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        heroImageUrl:
          type: [string, "null"]
          description: Course artwork; the card and the detail hero share it.
        deliveryType: { $ref: "#/components/schemas/DeliveryType" }
        thema:
          type: array
          items: { type: string }
        altersgruppe:
          type: array
          items: { type: string }
        cmePoints:
          type: [integer, "null"]
          description: Rendered as "5 CME Punkte" in the card metadata line.
        cmeCategory: { type: [string, "null"] }
        moduleCount: { type: integer, minimum: 0 }
        totalDurationSec:
          type: integer
          minimum: 0
          description: Sum of video durations; formatted client-side.

    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          required:
            - learningObjectives
            - targetAudience
            - vnr
            - accreditationBody
            - organizer
            - eventLocation
            - validFrom
            - validTo
            - requiredWatchPercent
            - passThresholdPercent
            - modules
            - experts
          properties:
            learningObjectives:
              type: array
              items: { type: string }
              description: The "Lernziele" checklist, one entry per bullet.
            targetAudience:
              type: [string, "null"]
              description: The "Zielgruppe" text; newlines are the only formatting.
            vnr: { type: [string, "null"] }
            accreditationBody: { type: [string, "null"] }
            organizer: { type: [string, "null"] }
            eventLocation: { type: [string, "null"] }
            validFrom: { type: [string, "null"], format: date-time }
            validTo: { type: [string, "null"], format: date-time }
            requiredWatchPercent:
              type: integer
              minimum: 0
              maximum: 100
              description: |
                The course's actual configured value — the Zertifizierung tab
                renders this, never a hardcoded number (P5-06).
            passThresholdPercent:
              type: integer
              minimum: 0
              maximum: 100
            modules:
              type: array
              items: { $ref: "#/components/schemas/ModuleSummary" }
            experts:
              type: array
              items: { $ref: "#/components/schemas/CourseExpert" }

    ModuleSummary:
      type: object
      required: [id, ordinal, title, subtitle, chapters]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        chapters:
          type: array
          items: { $ref: "#/components/schemas/ChapterSummary" }

    ChapterSummary:
      type: object
      required: [id, ordinal, title, contents]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        title: { type: string }
        contents:
          type: array
          items: { $ref: "#/components/schemas/ContentSummary" }

    ContentSummary:
      type: object
      description: |
        What a course *contains*, for browsing — never what is inside it.

        Deliberately has no field capable of carrying a quiz answer (P4-01),
        and no `fileUrl`, `videoUrl` or `body`. This response is ungated: any
        holder of a tenant token can read it, finished or not. A URL here would
        make both padlocks in the product decorative at once — the Mediathek's,
        which withholds `fileUrl` until the module is complete, and the
        player's, which withholds `videoUrl` until the chapter is reachable.

        The gated shapes are `Material` and `LessonContent`, and they are the
        only ones that carry a URL.
      required: [id, ordinal, kind, title, durationSec, mimeType]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        kind: { $ref: "#/components/schemas/ContentKind" }
        title: { type: string }
        durationSec: { type: [integer, "null"] }
        mimeType:
          type: [string, "null"]
          description: Metadata for an icon. Not a URL — see the description above.

    CourseExpert:
      type: object
      required: [id, ordinal, roleLabel, name, institution, biography, photoUrl]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        roleLabel: { type: string }
        name: { type: string }
        institution: { type: [string, "null"] }
        biography: { type: [string, "null"] }
        photoUrl: { type: [string, "null"] }

    FacetCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    GateStatus:
      type: string
      description: |
        Server-decided access state. `locked` renders the padlock; the client
        never computes this.
      enum: [locked, available, completed]

    ProgressSummary:
      type: object
      required: [status, completedCount, totalCount, percent]
      properties:
        status:
          type: string
          enum: [not_started, in_progress, completed]
        completedCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0 }
        percent: { type: integer, minimum: 0, maximum: 100 }
        watchedPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Video content only. Union coverage, not furthest position.
        scorePercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Quiz content only; best scored attempt.

    ContentState:
      type: object
      required: [id, gate, progress]
      properties:
        id: { type: string, format: uuid }
        gate: { $ref: "#/components/schemas/GateStatus" }
        progress: { $ref: "#/components/schemas/ProgressSummary" }

    ChapterState:
      type: object
      required: [id, gate, progress, contents]
      properties:
        id: { type: string, format: uuid }
        gate: { $ref: "#/components/schemas/GateStatus" }
        blockedBy:
          type: string
          format: uuid
          description: |
            The first incomplete chapter standing in the way, so the widget can
            say which one to finish rather than only "locked".
        progress: { $ref: "#/components/schemas/ProgressSummary" }
        contents:
          type: array
          items: { $ref: "#/components/schemas/ContentState" }

    ModuleState:
      type: object
      required: [id, gate, progress, chapters]
      properties:
        id: { type: string, format: uuid }
        gate: { $ref: "#/components/schemas/GateStatus" }
        progress: { $ref: "#/components/schemas/ProgressSummary" }
        chapters:
          type: array
          items: { $ref: "#/components/schemas/ChapterState" }

    CompletionCondition:
      type: string
      description: A condition still standing between the learner and the points.
      enum: [watch, quiz, evaluation, efn]

    EnrolmentState:
      type: object
      description: |
        Everything the player screen renders: the progress ring, the module
        tree with its lock states, the resume target, and what remains.
      required:
        - enrolmentId
        - courseSlug
        - requiredWatchPercent
        - passThresholdPercent
        - achievedWatchPercent
        - quizPassed
        - evaluationSubmitted
        - efnPresent
        - complete
        - outstanding
        - completedAt
        - progress
        - moduleCompletion
        - modules
        - resumeContentId
      properties:
        enrolmentId: { type: string, format: uuid }
        courseSlug: { type: string }
        requiredWatchPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Snapshotted at enrolment, not read live from the course.
        passThresholdPercent: { type: integer, minimum: 0, maximum: 100 }
        achievedWatchPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Union coverage across all video content in the course.
        quizPassed: { type: boolean }
        evaluationSubmitted: { type: boolean }
        efnPresent:
          type: boolean
          description: Whether an EFN is on file. The EFN itself is never returned.
        complete: { type: boolean }
        outstanding:
          type: array
          items: { $ref: "#/components/schemas/CompletionCondition" }
        completedAt: { type: [string, "null"], format: date-time }
        progress:
          $ref: "#/components/schemas/ProgressSummary"
        moduleCompletion:
          type: object
          description: Feeds "Sie haben X von Y Modulen abgeschlossen".
          required: [completed, total]
          properties:
            completed: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        modules:
          type: array
          items: { $ref: "#/components/schemas/ModuleState" }
        resumeContentId:
          type: [string, "null"]
          format: uuid
          description: |
            Where "Fortbildung fortsetzen" jumps to — the first unfinished
            content the learner may currently reach. Null when nothing is left.

    ContentKind:
      type: string
      enum: [video, text, quiz, details, material]

    LessonContent:
      type: object
      description: |
        A lesson's actual payload. The **only** shape carrying `videoUrl` or
        `body`, and reachable only through the sequence gate — see the
        `getLesson` description.
      required:
        [id, kind, title, durationSec, videoUrl, body, lastPositionSec, watchedPercent]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ContentKind" }
        title: { type: string }
        durationSec: { type: [integer, "null"] }
        videoUrl: { type: [string, "null"] }
        body:
          type: [string, "null"]
          description: Text lessons. Trusted authored content, not learner input.
        lastPositionSec:
          type: integer
          minimum: 0
          description: Where the learner left off, so the player resumes there.
        watchedPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            The server's figure for this content, so the player shows the same
            number the completion gate uses.

    WatchedSegment:
      type: object
      description: One played interval, in seconds from the start of the media.
      required: [startSec, endSec]
      properties:
        startSec: { type: number, minimum: 0 }
        endSec: { type: number, minimum: 0 }

    ProgressReport:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/WatchedSegment" }
        lastPositionSec:
          type: number
          minimum: 0
          description: Playhead position, for resuming. Never a gate input.

    RejectedSegment:
      type: object
      required: [segment, reason]
      properties:
        segment: { $ref: "#/components/schemas/WatchedSegment" }
        reason:
          type: string
          description: |
            Exactly `SegmentRejectionReason` from the compliance core — the
            contract mirrors the domain's vocabulary rather than inventing a
            parallel one that could drift from it.
          enum:
            [
              not_finite,
              negative,
              zero_or_reversed,
              beyond_duration,
              faster_than_wallclock,
            ]

    ProgressResult:
      type: object
      description: The server's own recomputed figures, never the client's.
      required: [contentId, watchedPercent, status, accepted, rejected]
      properties:
        contentId: { type: string, format: uuid }
        watchedPercent: { type: integer, minimum: 0, maximum: 100 }
        status:
          type: string
          enum: [not_started, in_progress, completed]
        accepted:
          type: integer
          minimum: 0
          description: How many reported intervals were counted.
        rejected:
          type: array
          description: |
            Named rather than silently dropped, so a client bug or a tampering
            attempt is visible.
          items: { $ref: "#/components/schemas/RejectedSegment" }

    Material:
      type: object
      description: |
        One downloadable item. `fileUrl` is **null while locked** — the gate is
        the absent URL, not the boolean.
      required: [id, title, locked, fileUrl, mimeType, fileSize]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        locked: { type: boolean }
        fileUrl: { type: [string, "null"] }
        mimeType: { type: [string, "null"] }
        fileSize: { type: [integer, "null"] }

    MaterialGroup:
      type: object
      description: The layout groups downloads under "Materialien zu Modul N".
      required: [moduleId, moduleTitle, ordinal, locked, materials]
      properties:
        moduleId: { type: string, format: uuid }
        moduleTitle: { type: string }
        ordinal: { type: integer }
        locked: { type: boolean }
        materials:
          type: array
          items: { $ref: "#/components/schemas/Material" }

    MaterialLibrary:
      type: object
      required: [courseSlug, groups]
      properties:
        courseSlug: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/MaterialGroup" }

    QuizOption:
      type: object
      description: No correctness marker — the shape has nowhere to put one.
      required: [id, ordinal, label]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        label: { type: string }

    QuizQuestion:
      type: object
      required: [id, ordinal, kind, prompt, options]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        kind:
          type: string
          enum: [single, multi]
        prompt: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/QuizOption" }

    Quiz:
      type: object
      required: [contentId, passThresholdPercent, attemptsUsed, maxAttempts, questions]
      properties:
        contentId: { type: string, format: uuid }
        passThresholdPercent: { type: integer, minimum: 0, maximum: 100 }
        attemptsUsed: { type: integer, minimum: 0 }
        maxAttempts:
          type: [integer, "null"]
          description: Null means unlimited, which is the MEDICE configuration.
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuizQuestion" }

    QuizAnswer:
      type: object
      required: [questionId, selectedOptionIds]
      properties:
        questionId: { type: string, format: uuid }
        selectedOptionIds:
          type: array
          items: { type: string, format: uuid }

    QuizSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: "#/components/schemas/QuizAnswer" }

    QuizAttemptResult:
      type: object
      required:
        [
          attemptNumber,
          correctCount,
          totalCount,
          scorePercent,
          passed,
          passThresholdPercent,
        ]
      properties:
        attemptNumber: { type: integer, minimum: 1 }
        correctCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0 }
        scorePercent: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        passThresholdPercent: { type: integer, minimum: 0, maximum: 100 }
        perQuestion:
          type: object
          additionalProperties: { type: boolean }
          description: |
            Present only when the course sets `revealCorrectAnswers`, which a
            CME-certified course never does.

    EvaluationQuestion:
      type: object
      required: [id, ordinal, kind, prompt, required, options]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        kind:
          type: string
          enum: [scale, single, multi, text]
        prompt: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }

    Evaluation:
      type: object
      required: [courseSlug, submitted, questions]
      properties:
        courseSlug: { type: string }
        submitted: { type: boolean }
        questions:
          type: array
          items: { $ref: "#/components/schemas/EvaluationQuestion" }

    EvaluationSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [evaluationId, answer]
            properties:
              evaluationId: { type: string, format: uuid }
              answer:
                description: Scale number, chosen option(s), or free text.
                oneOf:
                  - type: string
                  - type: number
                  - type: array
                    items: { type: string }

    Certificate:
      type: object
      description: |
        Exactly the fields the Bescheid requires a Teilnahmebescheinigung to
        carry, plus the pre-templated creditability sentence so no client ever
        hardcodes a points figure.
      required:
        - vnr
        - courseTitle
        - completedAt
        - eventLocation
        - organizer
        - cmePoints
        - cmeCategory
        - accreditationBody
        - participantName
        - scientificLeadName
        - creditSentence
      properties:
        vnr: { type: string }
        courseTitle: { type: string }
        completedAt:
          type: string
          format: date-time
          description: |
            Both the Veranstaltungs-datum and -uhrzeit. For an on-demand course
            this is the moment the learner completed it — the same instant that
            starts the EIV reporting window, so certificate and Punktemeldung
            agree by construction.
        eventLocation: { type: string }
        organizer: { type: string }
        cmePoints: { type: integer }
        cmeCategory: { type: string }
        accreditationBody: { type: string }
        participantName: { type: string }
        participantAddress:
          type: string
          description: |
            On the Muster but not in the Bescheid's minimum list, so the
            platform does not collect it and the line renders blank.
        scientificLeadName: { type: string }
        creditSentence: { type: string }

    CompletionInput:
      type: object
      properties:
        attestedName:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The name to print as "Name des Teilnehmenden" on the
            Teilnahmebescheinigung and to report to the EIV. Optional: when
            omitted the name from the validated token is used. It exists
            because the Keycloak profile may be stale or carry no name at all,
            and the certificate cannot be issued without one. The token stays
            the identity authority — this only decides what is printed.

    EfnInput:
      type: object
      required: [efn]
      properties:
        efn:
          type: string
          pattern: "^[0-9]{15}$"
          description: 15 digits. Never returned by any endpoint once stored.

    CourseListResponse:
      type: object
      required: [items, page, perPage, total, facets]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CourseSummary" }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        facets:
          type: object
          required: [thema, altersgruppe]
          properties:
            thema:
              type: array
              items: { $ref: "#/components/schemas/FacetCount" }
            altersgruppe:
              type: array
              items: { $ref: "#/components/schemas/FacetCount" }
