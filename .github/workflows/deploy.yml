# Deploy (P10-04, ADR-0013).
#
# ## When this runs, and why it may not have
#
# **Automatically:** after CI passes on `main`. `workflow_run` rather than
# `push`, so a red build cannot deploy. If a deploy has never happened, this is
# almost always why: nothing has been merged to `main`.
#
# The `branches: [main]` filter below does hold (P173). Every deploy on
# 2026-09-03 was created three to five seconds after CI completed on `main`, and
# no branch CI run has ever produced one. The list API reports a
# `workflow_run`-triggered run's own `head_branch`/`head_sha` as the branch that
# was merged, which reads like the opposite and is not — that misreading is
# written up in `docs/backlog/P173.md`.
#
# This header used to say *"`branches: [main]`, so work on a feature branch
# never touches production however green it is"*: right about the outcome, and
# crediting a mechanism this repository does not own. The rule is now enforced
# here too, in the "This ref may be deployed" step, against the **triggering
# run's** `head_branch` — `github.ref` is the default branch on every
# `workflow_run` event and cannot tell the two apart.
#
# **Manually:** Actions → Deploy → Run workflow, choosing any branch. That
# deploys *that branch's* head, which is what you want while a first deployment
# is being brought up and is not what you want afterwards.
#
# ## Why this workflow no longer builds anything (ADR-0013)
#
# It used to build four images and push them to ghcr.io. That is the right
# shape for a fleet; for one small host it added a registry, a token on the
# server, a login step, and a build artefact that the person debugging at 22:00
# could not reproduce because it was made somewhere else.
#
# The host builds now, from its own checkout, tagging each image with the
# commit. A failed build cannot take the site down — nothing is swapped until
# the build has succeeded — and a rollback is an image already on the disk.
#
# What is left here is the *trigger* and the *gate*: CI must be green on the
# commit, and only then does anything reach the server.
#
# ## What this workflow knows
#
# Four secrets, and nothing that unlocks anything on its own:
#
#   DEPLOY_HOST            hostname or IP of the Hetzner box
#   DEPLOY_USER            SSH user (not root; see the deploy runbook)
#   DEPLOY_SSH_KEY         private key for that user
#   DEPLOY_KNOWN_HOSTS     output of `ssh-keyscan <host>` — pinning, not TOFU
#
# And one optional repository *variable*:
#
#   DEPLOY_REPO_DIR        the clone on the server.
#                          Default ~/Repositories/DigitalSpitalCMEModule
#
# ## What it deliberately does not know (P17-01)
#
# `PRODUCTION_ENV` — the whole production environment, database passwords and
# encryption key included — used to be a repository secret this workflow wrote
# to the host on every deploy. Three things were wrong with that:
#
#   1. **It made GitHub a credential store for the database.** Anyone who could
#      read the repository's secrets held the platform.
#   2. **It put the configuration one step further from the thing it
#      configures.** Changing a domain meant editing a blob in a browser and
#      running a deployment, rather than editing a file on the server.
#   3. **It regenerated nothing and rotated nothing** — the values were typed
#      by a human once and copied forever.
#
# Now the server owns both halves. `~/ds-education/config.env` is written once
# by a human; `~/ds-education/secrets.env` is generated by `deploy.sh` on first
# run and never regenerated. This workflow tells the host a commit and reads
# back what the host decided its own hostname is.
#
# ## And why it deploys from a git clone
#
# The host has the repository at `~/Repositories/…`, so a deploy is
# `git fetch && git checkout <sha>` rather than an `scp` of one directory. The
# host then has the migrations, `init-roles.sql` and the deploy scripts at the
# exact commit being deployed — and `git rev-parse HEAD` on the server answers
# "what is running?" without trusting this workflow's memory of it.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Commit to roll back to, short SHA (leave empty to deploy this commit)"
        required: false
        type: string

concurrency:
  # Never two deployments at once: the second would migrate against a database
  # the first is still moving.
  group: deploy-production
  cancel-in-progress: false

env:
  # `BatchMode` so a prompt is an error rather than a hang — there is no human
  # here to answer one, and a hang burns the job's whole budget while looking
  # exactly like slow work.
  #
  # `ServerAliveInterval` because the build step holds one connection open for
  # minutes with nothing to say; without it a NAT or a load balancer in the
  # middle can drop a live session and the deploy dies at an arbitrary point.
  SSH_OPTS: >-
    -o BatchMode=yes
    -o ConnectTimeout=20
    -o ServerAliveInterval=30
    -o ServerAliveCountMax=10

jobs:
  # ## One job, and why it used to be two
  #
  # There was a `preflight` job that SSHed in, ran `deploy.sh --check` and
  # published the host's API hostname as an output, and a `deploy` job that
  # `needs:`-ed it. The split read well: fail before a single byte reaches the
  # server, and keep the production environment gate off the cheap half.
  #
  # It cost a **second runner acquisition**, and that turned out to be the
  # expensive part. Three consecutive attempts to bring this deployment up
  # died there and never reached the server:
  #
  #   * one where every preflight step reported `success` and the job was
  #     killed at its 5-minute cap — which GitHub reports as `cancelled`, so
  #     `needs: preflight` skipped the deploy;
  #   * one where the job sat in `Set up job` for the full 15 minutes without
  #     executing a single step, and was killed again;
  #   * and a run before those where GitHub could not resolve action download
  #     info at all.
  #
  # Two jobs is two chances to lose that lottery, for a check that costs one
  # SSH round trip. So the check is now the **first step of the deploy job**:
  # same code path, same ordering guarantee — nothing is checked out, built or
  # migrated until `--check` has passed — and one runner instead of two.
  #
  # What is genuinely lost: the production environment gate now covers the
  # check as well as the deploy. That is arguably more correct, since the check
  # opens an SSH session to production either way.
  deploy:
    name: Deploy to production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The *first* build on a host has no layer cache at all — four images from
    # a cold `deps` stage — and without buildx compose falls back to the legacy
    # builder, which cannot share that stage between them. Twenty minutes was a
    # figure measured against a warm host and would kill the one deploy that
    # most needs to finish.
    timeout-minutes: 45
    # A GitHub environment, so production can require a manual approval and so
    # the deployment shows up in the repository's timeline.
    #
    # No `url:` any more. It used to be the preflight job's output, and a job
    # cannot reference its own steps in `environment:`. The API hostname is
    # printed by the step that asks the host for it, which is where somebody
    # debugging would look anyway.
    environment:
      name: production
    # Consumed by the `journey` job below, which drives the deployed hostnames
    # from outside rather than guessing at them (P68-03).
    outputs:
      api_domain: ${{ steps.derive.outputs.api_domain }}
      portal_domain: ${{ steps.derive.outputs.portal_domain }}
      admin_domain: ${{ steps.derive.outputs.admin_domain }}
      # Whether the host will file real Punktemeldungen (P113-01). The smoke
      # job refuses to run when this is "yes", and refuses just as loudly when
      # it is absent — see scripts/run-smoke.mjs.
      eiv_reports_live: ${{ steps.eiv.outputs.eiv_reports_live }}
    env:
      REPO_DIR: ${{ vars.DEPLOY_REPO_DIR || '~/Repositories/DigitalSpitalCMEModule' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Presence decides whether this run reaches the host over a private
      # network or straight over the internet — see "Join the tailnet" below.
      # A secrets expression cannot be used in a step-level `if`; an env var
      # derived from one can.
      TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      # ---------------------------------------------------------------------
      # What may reach production (P155-01)
      # ---------------------------------------------------------------------
      #
      # The job's `if:` accepts any `workflow_dispatch`, on any ref, with no CI
      # at all — and on 2026-09-02 run 33615653131 used it to put a feature
      # branch (`claude/…-3vgrqh` at `010fea6a`) on the production host, and
      # reported success. Nobody misused anything: the dropdown offered it.
      #
      # A manual deploy still has to exist — it is how a rollback runs — so the
      # rule is the narrowest one that keeps it: manual runs from the default
      # branch only. The decision is in `infra/deploy/release-guards.sh` so
      # that `release-guards.test.sh` can drive it, which a line of YAML cannot
      # be made to do.
      - name: Fetch the deploy guards
        uses: actions/checkout@v4
        with:
          sparse-checkout: infra/deploy
          sparse-checkout-cone-mode: false

      - name: This ref may be deployed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # The branch production is deployed from, as a literal (P175-01).
          #
          # It was `github.event.repository.default_branch`, and on this
          # repository that is **not** `main` — the default branch is currently
          # `claude/education-platform-roadmap-3vgrqh`, which the first run of
          # this guard printed and refused on:
          #
          #     TRIGGERING_BRANCH: main
          #     DEFAULT_BRANCH:    claude/education-platform-roadmap-3vgrqh
          #
          # So the guard rejected a deploy of `main` for not being the default
          # branch, and P155-01's manual-run arm — same expression — would have
          # *allowed* a manual deploy of the feature branch and refused `main`.
          #
          # The trigger's own `branches: [main]` filter names the branch as a
          # literal three dozen lines up. This is that same literal, so the two
          # halves of "only main reaches production" cannot disagree — and it no
          # longer depends on a repository setting that can be changed in the
          # UI, by somebody who is not thinking about deployment at all.
          DEPLOY_BRANCH: main
          # The branch CI actually ran on (P173-01).
          #
          # `github.ref` is the default branch on every `workflow_run` event,
          # whatever the triggering run was on — which is why the guard passed
          # three feature-branch deploys while reading it. This is the value
          # that distinguishes them, and it is empty on a `workflow_dispatch`,
          # where `REF` is the right question instead.
          TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -Eeuo pipefail
          # shellcheck source=../../infra/deploy/release-guards.sh
          source infra/deploy/release-guards.sh

          if ds_release_ref_allowed \
            "$EVENT_NAME" "$REF" "${DEPLOY_BRANCH:-main}" "${TRIGGERING_BRANCH:-}"; then
            echo "event=$EVENT_NAME ref=$REF ci-branch=${TRIGGERING_BRANCH:-n/a} — allowed"
            exit 0
          fi

          echo "::error::Refusing to deploy to production." \
               "event=${EVENT_NAME} ref=${REF} ci-branch=${TRIGGERING_BRANCH:-n/a}." \
               "Only ${DEPLOY_BRANCH:-main} reaches production:" \
               "CI passing on it is what deploys, and a manual run may name it and" \
               "nothing else. Merge the change first."
          exit 1

      - name: Required secrets are set
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set — see docs/deployment.md §4"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      # ---------------------------------------------------------------------
      # Reaching the host at all (P116-01)
      # ---------------------------------------------------------------------
      #
      # On 25.08 a firewall was added to the server and this workflow stopped
      # at its first SSH: `connect to host … port 22: Connection timed out`.
      # Nothing was deployed — the job fails before the checkout step, which is
      # the behaviour we want, but it is also a deploy pipeline that no longer
      # deploys.
      #
      # ## Why not allow-list GitHub's runner addresses
      #
      # They are published (`api.github.com/meta`, key `actions`) and it is the
      # obvious move, and it is a trap on three counts. The list is thousands of
      # CIDR blocks; it changes, so the allow-list rots and the deploy breaks
      # weeks later for no visible reason; and it is shared Azure space, so
      # "allow GitHub" means "allow anyone who can rent a VM in those ranges".
      # It is a large maintenance burden that buys close to no isolation.
      # Hetzner Cloud Firewalls also cap rules per firewall well below the
      # number of ranges, so it may not even fit.
      #
      # ## What this does instead
      #
      # The runner joins a private network and reaches the host over that. Port
      # 22 stays closed to the internet; the host answers only on its tailnet
      # address. Everything below this step is unchanged — same key, same
      # pinned host key, same commands — because the SSH design was never the
      # problem. Only the path to the host was.
      #
      # **Conditional on purpose.** With no `TS_OAUTH_CLIENT_ID` secret the step
      # is skipped and the workflow behaves exactly as it did before, so this
      # can be committed before the tailnet exists and there is no flag day. Set
      # the secrets and point `DEPLOY_HOST` at the tailnet name, and the next
      # run takes the private path.
      #
      # `tag:ci` should be an ACL tag that may reach the host and nothing else —
      # a deploy runner has no business anywhere but this one machine.
      - name: Join the tailnet
        if: env.TS_CLIENT_ID != ''
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # ## Why the reachability check is separate from the SSH step
      #
      # Every way the private path can be half-configured produces the *same*
      # symptom at the first `ssh`: a twenty-second timeout and
      # "Connection timed out", which is what an internet firewall looks like
      # too. That sent an hour into the wrong file once already, so the causes
      # are separated here while the tailnet is still the subject.
      #
      # The four, and all of them are silent:
      #
      #   * the host is not tagged, so the ACL granting `tag:ci` does not
      #     match it;
      #   * the ACL has no rule from `tag:ci` to the host at all;
      #   * `DEPLOY_HOST` still points at the public address, so the packets
      #     leave the tailnet and meet the firewall;
      #   * **the host's node key expired.** A machine registered under a user
      #     account expires on Tailscale's default schedule and drops off the
      #     tailnet on a day nobody chose. Tag the host, or disable key expiry
      #     on it — a server that logs itself out is §9.9a's shape: nothing
      #     failed, the file is right, and the thing stopped answering.
      #
      # `tailscale status` names which one. It is not a gate — the deploy fails
      # at the next step regardless — it is the difference between an error
      # about the network and an error about SSH.
      #
      # ## Why not `tailscale ping`
      #
      # Because it asks a different question, and the first run of this step
      # proved it by failing on a healthy tailnet. `tailscale ping` defaults to
      # `--until-direct`, so it keeps going until it gets a **direct** pong and
      # exits non-zero if it only ever gets a relayed one. A peer showing
      # `active; relay "nue"` is perfectly reachable — DERP relaying is the
      # designed fallback when inbound UDP 41641 is closed, which it is on a
      # host behind a cloud firewall.
      #
      # So the check was red on a working system, which is §9.1's other
      # direction and worse than useless: it blocks a correct deploy and it
      # trains whoever sees it to ignore this step.
      #
      # What actually has to be true is that **TCP 22 opens over the tailnet**,
      # so that is what is asserted — the same thing the next step needs, one
      # layer down from SSH's own error message. `/dev/tcp` rather than `nc` to
      # depend on nothing the runner image might drop.
      - name: The host is reachable over the tailnet
        if: env.TS_CLIENT_ID != ''
        run: |
          host='${{ secrets.DEPLOY_HOST }}'
          if timeout 10 bash -c "exec 3<>/dev/tcp/${host}/22" 2>/dev/null; then
            echo "tailnet: ${host}:22 accepts connections"
            tailscale status || true
            exit 0
          fi

          echo "::error::the runner joined the tailnet but cannot reach ${host}."
          echo "Not an SSH problem — the packets are not arriving. One of:"
          echo "  * the host is not tagged, so the tag:ci ACL rule does not match it"
          echo "  * there is no ACL rule from tag:ci to this host"
          echo "  * DEPLOY_HOST is still the public address, so this left the tailnet"
          echo "  * the host's node key expired and it is no longer on the tailnet"
          echo "  * sshd is not listening on the tailnet interface"
          echo
          echo "A peer listed below as 'active; relay \"...\"' IS reachable —"
          echo "relaying is the fallback when inbound UDP 41641 is closed, not a fault."
          echo
          echo "What this runner can see:"
          tailscale status || true
          exit 1

      # Nothing from this runner reaches the server: the host has the
      # repository and fetches the commit itself.
      #
      # There *is* a checkout now, of `infra/deploy` only, and it is read by
      # this job and never copied anywhere (P155-01). The property this comment
      # is about is unchanged — what runs on the host comes from the host's own
      # fetch of `$SHA` — but the sentence used to say "no checkout" and would
      # now be read as a promise the file no longer keeps.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key rather than StrictHostKeyChecking=no. Accepting any
          # key on first sight means a deploy can be man-in-the-middled into
          # running whatever whoever answers on port 22 would like it to run.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # ## Why this is checked here and not left to ssh
          #
          # A `known_hosts` entry is keyed by the **name you connect to**, not
          # by the key. The host's key does not change when the route to it
          # does — but moving `DEPLOY_HOST` from the public address to the
          # tailnet name means nothing in the file matches any more, and ssh
          # says only:
          #
          #     Host key verification failed.
          #
          # Which is the same sentence it prints when a key has genuinely
          # changed — the one case where the right response is to stop and
          # investigate rather than to update the pin. Two very different
          # situations, one message, no mention of the name that was looked up
          # (§9.4). This says which it is while the fix is still cheap.
          if ! ssh-keygen -F "${{ secrets.DEPLOY_HOST }}" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no entry for the host named in DEPLOY_HOST."
            echo "Not a changed key — a missing one. known_hosts is looked up by name,"
            echo "so a DEPLOY_HOST that moved (a public address to a tailnet name, say)"
            echo "no longer matches the pin, however unchanged the server's key is."
            echo
            echo "On the host, print the lines for the new name:"
            echo
            echo "  for f in /etc/ssh/ssh_host_*_key.pub; do"
            echo "    printf '%s %s\n' \"\$(hostname -f)\" \"\$(cut -d\" \" -f1,2 \"\$f\")\""
            echo "  done"
            echo
            echo "and APPEND them to DEPLOY_KNOWN_HOSTS, keeping the existing lines so"
            echo "the old address still verifies if you ever deploy over it again."
            exit 1
          fi

      # The host's own preflight, over SSH, before anything is checked out or
      # built. `--check` runs the whole thing — the generated credentials, the
      # derived domains and their mutual consistency — and changes nothing.
      - id: derive
        name: The host's configuration is complete and consistent
        run: |
          ssh $SSH_OPTS -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${REPO_DIR}/infra/deploy && ./deploy.sh --check"

          # Ask the host what it believes its own API hostname is, rather than
          # rebuilding the derivation here from a copy of the configuration
          # this workflow no longer holds. The smoke test then cannot disagree
          # with the server about where the server is.
          api_domain=$(ssh $SSH_OPTS -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${REPO_DIR}/infra/deploy && . ./domains.sh && \
             set -a && . \$HOME/ds-education/config.env && set +a && \
             ds_derive_domains && printf '%s' \"\$API_DOMAIN\"")

          [ -n "$api_domain" ] || { echo "::error::the host reported no API domain"; exit 1; }
          echo "API domain: ${api_domain}"
          echo "api_domain=${api_domain}" >> "$GITHUB_OUTPUT"

          # The other two hostnames, for the same reason and from the same
          # place: the post-deploy journey drives the portal and the console,
          # and a smoke test that guessed at their names would be testing a
          # deployment nobody made (P68-03).
          other_domains=$(ssh $SSH_OPTS -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${REPO_DIR}/infra/deploy && . ./domains.sh && \
             set -a && . \$HOME/ds-education/config.env && set +a && \
             ds_derive_domains && printf '%s %s' \"\$PORTAL_DOMAIN\" \"\$ADMIN_DOMAIN\"")

          portal_domain=${other_domains%% *}
          admin_domain=${other_domains##* }
          [ -n "$portal_domain" ] && [ -n "$admin_domain" ] || {
            echo "::error::the host reported no portal or admin domain"; exit 1; }
          echo "Portal domain: ${portal_domain}"
          echo "Admin domain: ${admin_domain}"

          # And the one thing this workflow never asked the host: does it file
          # Punktemeldungen for real? (P113-01)
          #
          # The post-deploy journey publishes an accredited Fortbildung and
          # completes it, which queues a submission. The guard against that
          # reaching the Ärztekammer used to read `EIV_ALLOW_LIVE` in the
          # runner — a variable only ever set in the host's config.env. It was
          # therefore always empty, always concluded "not live", and could not
          # fire (CLAUDE.md §9.1).
          #
          # Asked the same way as the hostnames above, and for the same reason:
          # the host's own `ds_eiv_worker_will_file_live`, over the host's own
          # settings, so the smoke cannot disagree with the server about what
          # the server does.
          #
          # Those settings moved from config.env into `platform_settings`
          # (P180-01), so this reads them with psql instead of sourcing a file.
          # The query is `ds_eiv_settings_sql` — one definition, used by the
          # deploy script and by this, because two readings of "is the worker
          # armed" is exactly the shape that lets a smoke run against a host
          # that files for real.
          #
          # Fails **closed**: an unreadable answer is `yes`, which stops the
          # journey. A missing table on the deploy that introduces it, a psql
          # that is not there, a container still starting — none of those is
          # evidence that nothing will be filed, and the old version's habit of
          # concluding "not live" from an empty variable is the defect this
          # comment block was written for.
          # The EIV posture is read AFTER the deploy — see the step of its own
          # below. It used to be read here, and here is before the stack is
          # necessarily up (P182-09).
          echo "portal_domain=${portal_domain}" >> "$GITHUB_OUTPUT"
          echo "admin_domain=${admin_domain}" >> "$GITHUB_OUTPUT"

      # Detached at an exact commit, not a branch tip. A `git pull` would
      # deploy whatever `main` had become in the twenty minutes since CI went
      # green, which is a different commit from the one that was tested.
      - name: Check the commit out on the host
        run: |
          ssh $SSH_OPTS -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             cd ${REPO_DIR}
             git fetch --quiet origin
             git checkout --quiet --force ${SHA}
             # Anything left behind by a previous deploy would be running now.
             git status --porcelain | grep . && { echo 'working tree is dirty'; exit 1; } || true
             echo \"deploying \$(git rev-parse --short HEAD)\""

      # Nothing is passed but the command. The host knows its own configuration
      # and computes its own image tag from the commit it just checked out.
      #
      # `-tt` forces a TTY so the build's progress reaches the workflow log as
      # it happens; a ten-minute step with no output is indistinguishable from
      # a hang.
      - name: Deploy
        run: |
          ssh -tt $SSH_OPTS -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${REPO_DIR}/infra/deploy && \
             ./deploy.sh ${{ inputs.rollback_tag && format('--rollback {0}', inputs.rollback_tag) || '' }}"

      # ---------------------------------------------------------------------
      # Will this installation file real Punktemeldungen? (P113-01, P182-09)
      # ---------------------------------------------------------------------
      #
      # The post-deploy journey publishes an accredited Fortbildung and
      # completes it, which queues a submission. Its VNR is reserved and belongs
      # to no Veranstaltung, so on an installation that reports for real every
      # such submission is refused by the Ärztekammer and raises an alert
      # somebody has to dismiss — once per deploy, for ever. So the journey does
      # not run when the answer is yes.
      #
      # Asked of the host's own `ds_eiv_worker_will_file_live` over the host's
      # own `platform_settings`, through `ds_eiv_settings_sql` — one definition,
      # shared with deploy.sh, because two readings of "is the worker armed" is
      # what lets a smoke run against a host that files for real.
      #
      # ## Why after the deploy and not before (P182-09)
      #
      # It ran in `derive`, before `deploy.sh` had done anything — and `derive`
      # is before the deploy brings postgres up. On run 113 the read came back
      # empty, the guard failed closed to "yes", the journey was skipped, and
      # the deploy's own reading of the same table sixty-four seconds later said
      # `endpoint=mock armed=false live-consent=false`. Two opposite answers
      # about one host, and the wrong one was the one that decided.
      #
      # Failing closed was right and stays. What was wrong was asking while the
      # answer could not be given. Here the stack is up, the migrations have
      # run, and the row read is the one the code now serving will act on.
      #
      # ## And it says which of the two "yes" answers this is
      #
      # An unreadable answer and an armed installation are not the same fact,
      # and a guard that renders them identically is §9.6 in a workflow: the
      # missing answer is indistinguishable from the real one. The raw settings
      # string is printed — `endpoint|worker|consent`, no secret in it — so the
      # log says which happened.
      - name: Will this installation file Punktemeldungen for real?
        id: eiv
        run: |
          # `bash -lc`, and the error kept (P189-01).
          #
          # This read answered `unreadable` on the first deploy it ever ran on,
          # so the journey was skipped by a guard failing closed — and
          # `2>/dev/null` meant the log could not say why. That is §9.1's third
          # form (green because of what it is not looking at) sitting on the one
          # decision about whether the product gets driven at all, and §9.4 on
          # top: the message named the symptom and nothing actionable.
          #
          # Two changes, and the second matters more than the first:
          #
          #   * a **login shell**. The step that reads this table successfully —
          #     `deploy.sh`, over `ssh -tt` — gets one, and these reads did not.
          #     That is the difference I can see; it is a candidate cause, not a
          #     diagnosis, and it is not why this change is safe to make.
          #   * the psql stderr is **captured and printed**. Whether or not the
          #     login shell is the cause, the next run states it rather than
          #     leaving the next person where this one left me.
          #
          # `-tt` itself would be the wrong fix: it allocates a TTY, whose
          # carriage returns and login banner would land in the string parsed
          # below.
          answer=$(ssh $SSH_OPTS -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash -lc 'cd ${REPO_DIR}/infra/deploy && . ./eiv-endpoint.sh && \
             set -a && . \$HOME/ds-education/config.env && set +a && \
             err=\$(docker compose -f docker-compose.prod.yml exec -T \
               -e PGPASSWORD=\"\${POSTGRES_SUPERUSER_PASSWORD}\" postgres \
               psql -tAX -U \"\${POSTGRES_SUPERUSER}\" -d \"\${POSTGRES_DB}\" \
               -c \"\$(ds_eiv_settings_sql)\" 2>&1 >/tmp/ds-eiv-posture || true) && \
             settings=\$(tr -d \"\\n\" </tmp/ds-eiv-posture) && \
             if [ -z \"\$settings\" ]; then \
               printf \"yes unreadable:%s\" \"\$(printf %s \"\$err\" | tr -d \"\\n\" | cut -c1-300)\"; \
             elif ds_eiv_worker_will_file_live \
               \"\${settings%%|*}\" \
               \"\$(printf %s \"\$settings\" | cut -d\"|\" -f2)\" \
               \"\${settings##*|}\" \
               \"\${EIV_MOCK_BASE_URL:-}\"; then \
               printf \"yes %s\" \"\$settings\"; \
             else \
               printf \"no %s\" \"\$settings\"; \
             fi'")

          verdict="${answer%% *}"
          detail="${answer#* }"

          # Never fails this job. It runs **after** the container swap, so an
          # exit here would mark a successful deploy as failed — and the
          # "Report failure" step below would then say "the previous version is
          # still running", which would be false (§9.4: a message that is wrong
          # about the state is worse than none).
          #
          # Its whole job is to decide whether the journey runs, so an
          # unanswerable question fails closed to "yes" — the journey is
          # skipped — and says so.
          case "${verdict}" in
            yes|no) ;;
            *)
              echo "::warning::the host gave no usable answer for EIV reporting posture ('${answer}'). Failing closed: the journey will not run. The deploy itself succeeded."
              verdict=yes
              detail=unreachable
              ;;
          esac

          case "${detail}" in
            unreadable*)
              echo "::warning::platform_settings could not be read on the host — psql said: ${detail#unreadable:}. This run fails closed and treats the installation as reporting live, so the journey will not run. That is NOT evidence that it is reporting — it is evidence that the question could not be answered."
              ;;
          esac

          echo "Files Punktemeldungen live: ${verdict} (platform_settings: ${detail})"
          echo "eiv_reports_live=${verdict}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Which sender will carry a Teilnahmebescheinigung? (P188-03)
      # ---------------------------------------------------------------------
      #
      # "Which sender is this installation on?" was a question nobody could
      # answer without opening a psql session, and it decides whether a
      # physician who finishes a Fortbildung receives their certificate.
      #
      # A project sends as itself when it has both a host and a From address;
      # otherwise the platform's, when that is complete; otherwise nothing at
      # all — `deliverySender` in `@ds/domain`, and this reports the same three
      # answers over the host's own rows.
      #
      # ## Why it is here rather than only in the console
      #
      # §9.9's corollary: the repository's state is not the installation's. Both
      # halves of this can be true on one host and false on another, and both
      # fail **silently** — a certificate abandoned "no SMTP host configured" is
      # a row nobody reads. The deploy is where the operator already is.
      #
      # ## What it prints, and what it does not
      #
      # Counts and the platform's From address. No host, no username, and above
      # all no password: an address a certificate arrives from is on every one
      # of those certificates already, and the credential is not on this log.
      #
      # Never fails the job. It reports a fact about configuration, and a
      # deployment whose customers have not set up mail is a working deployment
      # with a gap somebody should know about — an exit here would mark a
      # successful swap as failed, which §9.4 says is worse than saying nothing.
      - name: Which sender will carry a Teilnahmebescheinigung?
        continue-on-error: true
        run: |
          # A login shell and the error kept, for the reason the EIV step above
          # gives at length. The query lives in `mail-posture.sh` rather than
          # here: an empty SQL string literal is `''`, which cannot appear
          # inside the single-quoted `bash -lc '...'`, and the escape that
          # avoids it is unreviewable. `eiv-endpoint.sh` already solved this for
          # the EIV posture; `mail-posture.test.sh` drives the result.
          source infra/deploy/mail-posture.sh

          answer=$(ssh $SSH_OPTS -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash -lc 'cd ${REPO_DIR}/infra/deploy && . ./mail-posture.sh && \
             set -a && . \$HOME/ds-education/config.env && set +a && \
             err=\$(docker compose -f docker-compose.prod.yml exec -T \
               -e PGPASSWORD=\"\${POSTGRES_SUPERUSER_PASSWORD}\" postgres \
               psql -tAX -U \"\${POSTGRES_SUPERUSER}\" -d \"\${POSTGRES_DB}\" \
               -c \"\$(ds_mail_posture_sql)\" 2>&1 >/tmp/ds-mail-posture || true) && \
             printf \"%s@@%s\" \"\$(tr -d \"\\n\" </tmp/ds-mail-posture)\" \
                               \"\$(printf %s \"\$err\" | tr -d \"\\n\" | cut -c1-300)\"'")

          # `<three fields>@@<stderr>`. `@@` and not `|`, which the answer's own
          # fields use — a separator that can appear in the payload is how a
          # parse silently reads one field as another.
          reason="${answer##*@@}"
          answer="${answer%%@@*}"

          if [ -z "${answer}" ]; then
            echo "::warning::The host's mail posture could not be read — psql said:" \
                 "${reason:-nothing}. That is not evidence that mail is" \
                 "unconfigured; it is evidence that the question could not be answered."
            exit 0
          fi

          own="${answer%%|*}"
          total="$(printf '%s' "${answer}" | cut -d'|' -f2)"
          platform="${answer##*|}"

          if ! fallback="$(ds_mail_posture_fallback_count "${own}" "${total}")"; then
            echo "::warning::The host's mail posture came back unparseable" \
                 "('${answer}'). Not evidence about the configuration."
            exit 0
          fi

          echo "Projects sending as themselves: ${own} of ${total}"
          if [ -n "${platform}" ]; then
            echo "Platform sender: ${platform} — carries the other ${fallback}"
          else
            echo "Platform sender: not configured"
          fi

          {
            echo "### Teilnahmebescheinigungen"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Projects with their own SMTP | ${own} of ${total} |"
            if [ -n "${platform}" ]; then
              echo "| Platform sender | \`${platform}\` |"
              echo "| Carried by the platform | ${fallback} |"
            else
              echo "| Platform sender | **not configured** |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # The one state where a certificate is issued and silently never sent.
          # Said as a warning rather than left in a table, because it is the
          # difference between a physician receiving their Bescheinigung and
          # having to know to go and download it.
          if [ -z "${platform}" ] && [ "${fallback}" -gt 0 ]; then
            echo "::warning::${fallback} project(s) have no SMTP of their own and" \
                 "the platform has no sender either. Their Teilnahmebescheinigungen" \
                 "are issued and abandoned undelivered — they stay downloadable in" \
                 "the portal. Configure Sicherheit -> E-Mail-Versand der Plattform."
          fi

      - name: Smoke-test the deployment, and record what is now live
        run: |
          # From outside the host entirely, over public DNS and real TLS. The
          # deploy script already checked this from the host; this checks that
          # the internet agrees.
          health="$(curl --fail --silent --show-error --max-time 20 \
            "https://${{ steps.derive.outputs.api_domain }}/health")"
          echo "$health"
          echo "$health" | grep -q '"status"'

          # The version and commit the *running API* reports, not the ones this
          # workflow believes it deployed (P47-01). Those are different claims,
          # and only the first one is evidence: a deploy that swapped nothing
          # would still let this job report the commit it was triggered for.
          #
          # `sed` rather than `jq`, which is not guaranteed on the runner image
          # and would be a dependency for two field reads.
          version="$(echo "$health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          commit="$(echo "$health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')"

          {
            echo "### Deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${version:-unknown}\` |"
            echo "| Commit | \`${commit:-unknown}\` |"
            echo "| API | https://${{ steps.derive.outputs.api_domain }} |"
            echo
            echo "The version increments with every deploy of new commits —"
            echo "\`major.minor\` from package.json, patch from the commit count."
            echo "It is shown in the console's and the portal's footer."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$version" ] || [ "$version" = "unknown" ]; then
            echo "::warning::The API reports no version. This is expected for the" \
                 "first deploy that introduces P47-01 and a problem after that —" \
                 "check that DS_VERSION reached the container."
          fi

          # And now compare the two, which is the part that was missing (P155-02).
          #
          # The comment above has said since P47-01 that the served commit is
          # the only evidence, "a deploy that swapped nothing would still let
          # this job report the commit it was triggered for" — and then nothing
          # compared it. So a deploy that swapped nothing was green, and the
          # workflow could not answer the one question a "merged but not
          # visible" report asks: which commit is this host serving?
          # shellcheck source=../../infra/deploy/release-guards.sh
          source infra/deploy/release-guards.sh

          if ! ds_release_commit_matches "$SHA" "$commit"; then
            echo "::error::${{ steps.derive.outputs.api_domain }} is serving" \
                 "commit '${commit:-none}', not the ${SHA} this run deployed." \
                 "The containers did not swap, or an older deploy overtook this" \
                 "one. Nothing has been rolled back — check the host before" \
                 "re-running."
            exit 1
          fi
          echo "Serving ${commit}, which is ${SHA} — verified from outside the host."

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deployment failed. The previous version is still running —"
          echo "::error::deploy.sh exits non-zero without swapping if any step fails."
          echo "::error::To roll back explicitly: run this workflow with rollback_tag set."

  # ---------------------------------------------------------------------------
  # The whole journey, in a browser, against what was just deployed (P68-03)
  # ---------------------------------------------------------------------------
  #
  # `/health` answering is not evidence that a physician can earn a CME point.
  # Every defect the client found on 12.08 was downstream of a healthy API: a
  # CSP header that blocked every upload, a cookie collision that refused every
  # enrolment, a tenant whose seed had never run. This job signs in as an
  # operator, builds a Fortbildung with a real video upload, publishes it, and
  # then completes it as a physician and downloads the Bescheinigung — on the
  # hostnames the client looks at, through the real Caddy, against the real
  # bucket.
  #
  # It runs from a GitHub runner rather than on the host, deliberately: the
  # point is to see the deployment the way the internet sees it, and a browser
  # inside the machine would miss exactly the layer that broke.
  #
  # A failure here fails the workflow run. A deploy that cannot enrol a learner
  # is not a successful deploy, and the previous images are still on disk —
  # `deploy.sh --rollback <tag>` is the way back.
  journey:
    name: The whole journey, in a browser
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Only Chromium. The suite runs one project and a full browser matrix
      # would triple a job whose value is the round trip, not the engine.
      #
      # From `apps/e2e`, and with `pnpm exec` rather than `npx`: `@playwright/test`
      # is that workspace's dependency, not the root's, and pnpm does not hoist
      # it — so `npx playwright` at the root resolved to nothing and the job died
      # with `sh: 1: playwright: not found` on its first real run. The job caught
      # it the way it is supposed to, by failing the deploy rather than passing.
      - name: Install Chromium
        working-directory: apps/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Drive the deployed installation
        env:
          E2E_PORTAL_URL: https://${{ needs.deploy.outputs.portal_domain }}
          E2E_ADMIN_URL: https://${{ needs.deploy.outputs.admin_domain }}
          E2E_API_URL: https://${{ needs.deploy.outputs.api_domain }}
          # Must match what the host seeded the DS Test operator with. Unset
          # here and unset there means both use the seed's own default, which is
          # self-describing rather than realistic on purpose (P33-02).
          SEED_TEST_STAFF_PASSWORD: ${{ secrets.SEED_TEST_STAFF_PASSWORD || 'ds-test-operator-2026' }}
          # From the host, not from this runner (P113-01). `run-smoke.mjs`
          # refuses on "yes", and refuses on anything else — including unset,
          # which is what the variable this replaced always was.
          EIV_REPORTS_LIVE: ${{ needs.deploy.outputs.eiv_reports_live }}
        run: pnpm test:smoke

      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journey-trace
          path: apps/e2e/test-results/
          retention-days: 7
