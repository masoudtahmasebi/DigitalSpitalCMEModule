# Build, publish and deploy (P10-04).
#
# Runs only after CI has passed on the same commit — `workflow_run` rather than
# `push`, so a red build cannot deploy. Manual dispatch exists for redeploying
# an unchanged commit and for rollbacks.
#
# ## Why images are built here and not on the host
#
# Building on the target means the production host needs a toolchain, a
# checkout and enough RAM to run tsc — and a failed build takes the site with
# it. Building here means the host only ever pulls an artefact that already
# exists, and a rollback is a tag change rather than a rebuild.
#
# ## What this workflow knows
#
# Four secrets, and nothing that unlocks anything on its own:
#
#   DEPLOY_HOST            hostname or IP of the Hetzner box
#   DEPLOY_USER            SSH user (not root; see the deploy runbook)
#   DEPLOY_SSH_KEY         private key for that user
#   DEPLOY_KNOWN_HOSTS     output of `ssh-keyscan <host>` — pinning, not TOFU
#
# And one optional repository *variable*:
#
#   DEPLOY_REPO_DIR        the clone on the server.
#                          Default ~/Repositories/DigitalSpitalCMEModule
#
# ## What it deliberately does not know (P17-01)
#
# `PRODUCTION_ENV` — the whole production environment, database passwords and
# encryption key included — used to be a repository secret this workflow wrote
# to the host on every deploy. Three things were wrong with that:
#
#   1. **It made GitHub a credential store for the database.** Anyone who could
#      read the repository's secrets held the platform.
#   2. **It put the configuration one step further from the thing it
#      configures.** Changing a domain meant editing a blob in a browser and
#      running a deployment, rather than editing a file on the server.
#   3. **It regenerated nothing and rotated nothing** — the values were typed
#      by a human once and copied forever.
#
# Now the server owns both halves. `~/ds-education/config.env` is written once
# by a human; `~/ds-education/secrets.env` is generated by `deploy.sh` on first
# run and never regenerated. This workflow builds images, tells the host which
# ones, and reads back what the host decided its own hostname is.
#
# ## And why it deploys from a git clone
#
# The host has the repository at `~/Repositories/…`, so a deploy is
# `git fetch && git checkout <sha>` rather than an `scp` of one directory. The
# host then has the migrations, `init-roles.sql` and the deploy scripts at the
# exact commit being deployed — and `git rev-parse HEAD` on the server answers
# "what is running?" without trusting this workflow's memory of it.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Image tag to roll back to (leave empty to deploy this commit)"
        required: false
        type: string

concurrency:
  # Never two deployments at once: the second would migrate against a database
  # the first is still moving.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Everything that can be wrong before a single byte reaches the server.
  #
  # A deploy that fails halfway is recoverable — deploy.sh leaves the previous
  # version running — but it is still twenty minutes and a fright. Most first
  # deployments fail on a missing secret, and a missing secret is knowable
  # here, in eight seconds, without SSH.
  preflight:
    name: Check the deployment configuration
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # What the *host* says its API hostname is. Published so the smoke test
      # and the GitHub environment URL cannot disagree with the server about
      # where the server is.
      api_domain: ${{ steps.derive.outputs.api_domain }}
    steps:
      - name: Required secrets are set
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set — see docs/deployment.md §4"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      # The host's own preflight, over SSH, before a single image is built.
      #
      # The configuration lives on the server now, so this is where it has to be
      # checked — and `deploy.sh --check` is the same code path the real deploy
      # runs, so a green check here means the next twenty minutes will not end
      # on a missing variable.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key rather than StrictHostKeyChecking=no.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - id: derive
        name: The host's configuration is complete and consistent
        env:
          REPO_DIR: ${{ vars.DEPLOY_REPO_DIR || '~/Repositories/DigitalSpitalCMEModule' }}
        run: |
          # `--check` runs the whole preflight — the generated credentials, the
          # derived domains and their mutual consistency — and changes nothing.
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${REPO_DIR}/infra/deploy && ./deploy.sh --check"

          # Ask the host what it believes its own API hostname is, rather than
          # rebuilding the derivation here from a copy of the configuration this
          # workflow no longer holds. The smoke test and the environment URL
          # then cannot disagree with the server about where the server is.
          api_domain=$(ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${REPO_DIR}/infra/deploy && . ./domains.sh && \
             set -a && . \$HOME/ds-education/config.env && set +a && \
             ds_derive_domains && printf '%s' \"\$API_DOMAIN\"")

          [ -n "$api_domain" ] || { echo "::error::the host reported no API domain"; exit 1; }
          echo "API domain: ${api_domain}"
          echo "api_domain=${api_domain}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish images
    # `workflow_run` fires for failures too, and `preflight` carries the same
    # condition — depending on it is what stops a red build reaching
    # production, and what stops a green one reaching a misconfigured server.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, check out the commit CI actually tested, not the
          # branch head — which may have moved since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # No build arguments. The console reads its API base and project slug from
      # /config.js at container start (P16-02), so this image is the same
      # artifact whatever environment it lands in — and a rollback is a tag
      # change rather than a hunt for the build that had the right domain in it.
      - name: Build and push the admin console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

      # Likewise. The portal's Keycloak client — a learner-facing public client,
      # not the console's — is configured at runtime with everything else.
      - name: Build and push the portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/portal:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/portal:latest
          cache-from: type=gha,scope=portal
          cache-to: type=gha,scope=portal,mode=max

      - name: Build and push the widget
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/widget/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/widget:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/widget:latest
          cache-from: type=gha,scope=widget
          cache-to: type=gha,scope=widget,mode=max

      # The bundle a WordPress site can drop straight into the plugin, for a
      # customer who prefers shipping it over loading it from our domain.
      - name: Attach the widget bundle as a build artifact
        run: |
          container=$(docker create "${REGISTRY}/${{ github.repository }}/widget:${{ steps.meta.outputs.tag }}")
          docker cp "$container:/usr/share/nginx/html/ds-lms.js" ./ds-lms.js
          docker rm "$container" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ds-lms-widget-${{ steps.meta.outputs.tag }}
          path: ds-lms.js
          retention-days: 30

  deploy:
    name: Deploy to production
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A GitHub environment, so production can require a manual approval and so
    # the deployment shows up in the repository's timeline.
    environment:
      name: production
      url: https://${{ needs.preflight.outputs.api_domain }}
    env:
      REPO_DIR: ${{ vars.DEPLOY_REPO_DIR || '~/Repositories/DigitalSpitalCMEModule' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # No checkout: nothing from this runner reaches the server any more. The
      # host has the repository and fetches the commit itself.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key rather than StrictHostKeyChecking=no. Accepting any
          # key on first sight means a deploy can be man-in-the-middled into
          # running whatever whoever answers on port 22 would like it to run.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Detached at an exact commit, not a branch tip. A `git pull` would
      # deploy whatever `main` had become in the twenty minutes since CI went
      # green, which is a different commit from the one that was tested.
      - name: Check the commit out on the host
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             cd ${REPO_DIR}
             git fetch --quiet origin
             git checkout --quiet --force ${SHA}
             # Anything left behind by a previous deploy would be running now.
             git status --porcelain | grep . && { echo 'working tree is dirty'; exit 1; } || true
             echo \"deploying \$(git rev-parse --short HEAD)\""

      - name: Log the host in to the registry
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'docker login ghcr.io -u ${{ github.actor }} --password-stdin'

      # The image tags are the only thing this workflow tells the host. Passed
      # in the environment of the one command rather than written to a file:
      # they are not secret, they change every deploy, and a file would be one
      # more piece of state to disagree with `deploy.sh`'s own record.
      - name: Deploy
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${REPO_DIR}/infra/deploy && \
             IMAGE_API=ghcr.io/${REPO}/api:${TAG} \
             IMAGE_ADMIN=ghcr.io/${REPO}/admin:${TAG} \
             IMAGE_PORTAL=ghcr.io/${REPO}/portal:${TAG} \
             IMAGE_WIDGET=ghcr.io/${REPO}/widget:${TAG} \
             ./deploy.sh ${{ inputs.rollback_tag && format('--rollback {0}', inputs.rollback_tag) || '' }}"

      - name: Smoke-test the deployment
        run: |
          # From outside the host entirely, over public DNS and real TLS. The
          # deploy script already checked this from the host; this checks that
          # the internet agrees.
          curl --fail --silent --show-error --max-time 20 \
            "https://${{ needs.preflight.outputs.api_domain }}/health" | tee /dev/stderr | grep -q '"status"'

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deployment failed. The previous version is still running —"
          echo "::error::deploy.sh exits non-zero without swapping if any step fails."
          echo "::error::To roll back explicitly: run this workflow with rollback_tag set."
