name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Weekly, against a repository nobody has pushed to (P18-05).
  #
  # The security audit is a gate on *changes*, which leaves the case it was
  # built for uncovered: a CVE published against a dependency that has not
  # moved. The lockfile is identical, the code is identical, and nothing runs —
  # so the advisory sits there until the next unrelated commit.
  #
  # Monday 05:00 UTC, an hour before Dependabot's window, so the audit's
  # verdict is already on the default branch when the update pull requests
  # arrive.
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  # Not keyed on the run: a scheduled run and a push to the same ref would
  # otherwise cancel each other, and the one that loses is the one nobody
  # notices was never run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

permissions:
  contents: read

jobs:
  # Fast feedback: everything that needs no infrastructure. Fails in ~1 minute.
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ADR-0006 layer boundaries are enforced here, not in review.
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The WordPress plugin's security properties (P6-01/02), executed against
      # a stub WordPress. This one guards a file that will run on MEDICE's
      # production login path, so "it was reviewed" is not enough.
      - name: WordPress plugin security tests
        run: pnpm test:wp

      # The deploy scripts run on the production host, so they are tested and
      # linted like anything else. `domains.sh` in particular decides the staff
      # cookie's scope and the CORS allow-list — a TypeScript reimplementation
      # tested in vitest would leave the version that actually runs untested.
      - name: Shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck infra/nginx/ds-runtime-config.sh
          (cd infra/deploy && shellcheck -x deploy.sh domains.sh domains.test.sh \
             deploy-vars.test.sh secrets.sh secrets.test.sh dsc)
          ./infra/deploy/domains.test.sh
          # The URL encoder. A base64 password contains `/`, and an unencoded
          # `/` in a connection string's userinfo is what killed the first
          # deploy that reached the server.
          ./infra/deploy/secrets.test.sh
          # Every variable deploy.sh reads is one somebody guarantees. Static,
          # because `--check` exits two thirds of the way down the script and
          # `set -u` only complains at the line that reads the name — which,
          # past that exit, is after the database has already been migrated.
          ./infra/deploy/deploy-vars.test.sh

      - name: Build
        run: pnpm build

      # P2-06: the SDK is generated, never hand-edited.
      - name: Verify generated SDK matches the contract
        run: |
          if [ -f contracts/openapi.yaml ]; then
            pnpm --filter @ds/sdk generate
            if ! git diff --quiet -- packages/sdk; then
              echo "::error::Generated SDK is out of date with contracts/openapi.yaml. Run 'pnpm --filter @ds/sdk generate'."
              git diff -- packages/sdk
              exit 1
            fi
          fi

  # packages/domain decides whether a physician earns a CME point. It is the one
  # place where coverage is expected to be effectively total (CLAUDE.md §6), so
  # it gets its own gate rather than being averaged into a repo-wide number.
  domain-coverage:
    name: Domain coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Coverage (thresholds enforced in vitest.config.ts)
        run: pnpm --filter @ds/domain test:coverage

  # Integration tests need a real Postgres: RLS cannot be verified against a
  # mock, and a mock would happily "prove" an isolation guarantee that does not
  # exist (ADR-0002).
  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ds_education
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ds_app:ds_app_dev@127.0.0.1:5432/ds_education
      # Must be ds_migrator, not the postgres superuser: `ALTER DEFAULT
      # PRIVILEGES FOR ROLE ds_migrator` (infra/postgres/init-roles.sql) only
      # grants ds_app access to objects *ds_migrator* creates. Migrating as
      # the superuser silently leaves ds_app with zero grants — "permission
      # denied", not RLS-filtered rows — which looks like isolation working
      # until you check which error it actually is.
      MIGRATION_DATABASE_URL: postgres://ds_migrator:ds_migrator_dev@127.0.0.1:5432/ds_education
      # Integration test fixture seeding only (BYPASSRLS) — see .env.example.
      POSTGRES_SUPERUSER_URL: postgres://postgres:postgres@127.0.0.1:5432/ds_education
      REDIS_URL: redis://127.0.0.1:6379
      # Truncate before every test file (P32-02). Safe here and nowhere else:
      # the Postgres above is a container created for this job and discarded
      # with it. The suites ask for this explicitly rather than doing it by
      # default, so the same command at a developer's terminal cannot empty the
      # database they develop against.
      INTEGRATION_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The backup restore drill runs the real `pg_dump` and `pg_restore`
      # (P23-03). The runner's own client is whatever Ubuntu ships, and a
      # `pg_dump` older than the server refuses outright — "server version
      # 16.x; pg_dump version 14.x" — so the major version is pinned to match
      # the `postgres:16` service above. They have to move together.
      - name: Install the PostgreSQL 16 client (pg_dump for the restore drill)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: Create roles (ds_app is not BYPASSRLS — ADR-0002)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ds_education \
            -f infra/postgres/init-roles.sql
      # `db/migrate.ts` imports `@ds/migrator`, and a workspace package resolves
      # to its `dist/`. `pnpm db:migrate` is a plain script rather than a turbo
      # task, so nothing builds that for it — the job failed with
      # `ERR_MODULE_NOT_FOUND … @ds/migrator/dist/index.js`, which reads as a
      # missing dependency and is a missing build.
      #
      # The integration tests themselves never hit this: `test:integration`
      # declares `dependsOn: ["^build"]`, so turbo builds their dependencies
      # first. The migrate step ran before them and had no such protection.
      - name: Build what the migrator needs
        run: pnpm --filter @ds/migrator... build

      - name: Migrate
        run: pnpm db:migrate
      # `test:integration:ci`, not `test:integration` (P32-01).
      #
      # `pnpm test:integration` is the developer's command: it provisions an
      # isolated `ds_education_test` database, builds, and truncates before
      # running, because a developer's cluster is long-lived and the suite used
      # to leave ~50 customers per run in the database they also run the
      # console against.
      #
      # None of that applies here. The Postgres above is a fresh container that
      # exists for this job and is discarded with it, and the steps that
      # provision it are named steps that fail visibly — which is the right
      # shape in CI and the wrong shape at a terminal. Running the developer's
      # command here would create a second database, migrate it a second time,
      # and test something other than the database the seed steps below check.
      #
      # So CI takes the turbo path, against the database it just migrated.
      - name: Integration tests
        run: pnpm test:integration:ci

      # Both seeds, against the same real Postgres, **after** the integration
      # tests rather than before (P20-01).
      #
      # After, because a seed rewrites reference data and the suite has its own
      # fixtures; running it first would have the tests asserting against
      # whatever the seed last wrote.
      #
      # At all, because a seed is a program with SQL in it and nothing else
      # executes it. `pnpm db:seed` was written once, worked once, and every
      # later migration could have broken it silently — a column renamed, a
      # constraint added, a check tightened. It would then fail on the day
      # somebody set up a demo, which is the worst possible day.
      #
      # Twice each: the seeds claim to be idempotent, and a second run is the
      # only thing that checks the claim. The MEDICE one runs first because the
      # DS tenant's whole point is being a *second* customer — if the ordering
      # mattered, that is a tenancy bug worth failing on.
      - name: Seeds run, and run twice
        env:
          MIGRATION_DATABASE_URL: postgres://ds_migrator:ds_migrator_dev@127.0.0.1:5432/ds_education
        run: |
          pnpm db:seed
          pnpm db:seed
          pnpm db:seed:ds
          pnpm db:seed:ds

      # And the second customer is genuinely separate — asserted here rather
      # than believed, because "two customers exist" and "two customers are
      # isolated" are different claims and only the first is obvious.
      - name: The two tenants are distinct
        run: |
          # About the two **seeded** tenants, not about the database.
          #
          # The first version of this counted `DISTINCT customer_id` across
          # every course and expected 2. It failed, correctly: the integration
          # suite runs first and leaves its own fixture tenants behind, so the
          # database holds more than the seeds put there. An assertion that is
          # true only on an empty database is an assertion that fails on the
          # first day somebody adds a test.
          #
          # What is actually being claimed is narrower and is the claim worth
          # making: MEDICE's course and the DS tenant's courses belong to
          # different customers.
          rows=$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ds_education -tAX -c \
            "SELECT count(DISTINCT customer_id) FROM courses
              WHERE slug IN ('adhs-akademie-adult', 'ds-cme-demo', 'ds-ohne-punkte')")
          [ "$rows" = "2" ] || { echo "::error::the seeded courses span ${rows} customer(s), expected 2"; exit 1; }

          seeded=$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ds_education -tAX -c \
            "SELECT count(*) FROM courses
              WHERE slug IN ('adhs-akademie-adult', 'ds-cme-demo', 'ds-ohne-punkte')")
          [ "$seeded" = "3" ] || { echo "::error::expected 3 seeded courses, found ${seeded}"; exit 1; }

          # A course with no points, no VNR and no accreditation body — the
          # case the client asked for and the one nothing else exercises.
          free=$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ds_education -tAX -c \
            "SELECT count(*) FROM courses
              WHERE slug = 'ds-ohne-punkte'
                AND cme_points IS NULL AND vnr IS NULL AND accreditation_body IS NULL")
          [ "$free" = "1" ] || { echo "::error::the point-free demo course is not point-free"; exit 1; }

  # Every image, on every branch — because the alternative was finding out at
  # deploy time, and that is exactly what happened.
  #
  # Images were built only by deploy.yml, which runs on `workflow_run` after CI
  # succeeds. So a Dockerfile could be broken for as long as nobody deployed,
  # and two were: the API image failed at install (a hand-maintained list of
  # workspace manifests had gone stale, so `packages/mail`'s dependencies were
  # never installed) and then again at the production prune (`pnpm deploy`
  # cannot take a `...` filter, and pnpm 10 requires `--legacy`). A green CI
  # meant nothing about whether the thing could be shipped.
  #
  # Build only — nothing is pushed. The point is that `docker build` succeeds.
  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: false
          load: true
          tags: ds-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Three entrypoints ship in this image and only one of them is the
      # default. `dist/db-migrate.js` runs on every deploy and would be noticed;
      # `dist/bootstrap-admin.js` runs **once**, on the first deploy of a new
      # environment, which is the worst possible moment to discover it was not
      # compiled into the image.
      #
      # Each is invoked in the way that makes it refuse: no environment, no
      # arguments. What is being asserted is that the file exists and is the
      # program it claims to be — a missing one exits with a module-resolution
      # error instead.
      - name: The image carries its operational entrypoints
        run: |
          for entry in dist/main.js dist/db-migrate.js dist/bootstrap-admin.js; do
            docker run --rm --entrypoint node ds-api:ci -e \
              "import('node:fs').then(fs => process.exit(fs.existsSync('/app/${entry}') ? 0 : 1))" \
              || { echo "::error::${entry} is missing from the API image"; exit 1; }
          done

          # And that the bootstrap refuses rather than doing something on no
          # arguments — it is the one command that creates an account which can
          # do everything.
          if docker run --rm --entrypoint node ds-api:ci dist/bootstrap-admin.js 2>/dev/null; then
            echo "::error::bootstrap-admin.js succeeded with no arguments"
            exit 1
          fi

      # No build arguments: the frontends read their configuration from
      # /config.js at container start (P16-02), so these images carry no
      # hostname at all and are deployable to any environment.
      #
      # All four targets come from the one root Dockerfile and share its `deps`
      # stage, so the workspace is installed once for all of them — here and,
      # more importantly, on the deployment host, which builds them now
      # (ADR-0013). This job is what verifies that file before a server ever
      # runs it.
      - name: Build the admin console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: admin
          push: false
          load: true
          tags: ds-admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

      - name: Build the portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: portal
          push: false
          cache-from: type=gha,scope=portal
          cache-to: type=gha,scope=portal,mode=max

      # The runtime config is the thing that replaced five build arguments, and
      # it fails in a browser rather than in a build — so it is exercised here.
      - name: The console's runtime config is generated, and refuses bad input
        run: |
          out=$(docker run --rm \
            -e DS_API_BASE=https://api.example.invalid \
            -e DS_PROJECT_SLUG=ci \
            --entrypoint /docker-entrypoint.d/20-ds-runtime-config.sh \
            -e DS_CONFIG_PATH=/tmp/config.js \
            ds-admin:ci >/dev/null && echo written)
          [ "$out" = "written" ] || { echo "::error::config generation failed"; exit 1; }

          # A value that could end the JavaScript string it is written into.
          # Refused rather than escaped: these are origins and slugs, and
          # anything outside that character set is a typo worth stopping for.
          if docker run --rm \
            -e DS_API_BASE='https://x";alert(1);//' \
            -e DS_PROJECT_SLUG=ci \
            -e DS_CONFIG_PATH=/tmp/config.js \
            --entrypoint /docker-entrypoint.d/20-ds-runtime-config.sh \
            ds-admin:ci 2>/dev/null; then
            echo "::error::runtime config accepted a value containing a quote"
            exit 1
          fi

          # And a missing one stops the container rather than producing a
          # console that loads and then fails every request.
          if docker run --rm \
            -e DS_PROJECT_SLUG=ci \
            -e DS_CONFIG_PATH=/tmp/config.js \
            --entrypoint /docker-entrypoint.d/20-ds-runtime-config.sh \
            ds-admin:ci 2>/dev/null; then
            echo "::error::runtime config accepted a missing DS_API_BASE"
            exit 1
          fi

      - name: Build the widget image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: widget
          push: false
          cache-from: type=gha,scope=widget
          cache-to: type=gha,scope=widget,mode=max

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gitleaks diffs from the pre-push SHA to HEAD, which can span several
      # commits. actions/checkout's default fetch-depth: 1 only has HEAD
      # itself, so that diff fails with "unknown revision" the moment a push
      # carries more than one commit — full history avoids depending on
      # guessing the right depth.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Hard gate on what actually ships. A vulnerable linter is a real finding
      # but not a production exposure, so dev-only advisories are reported
      # without failing the build — otherwise the gate gets disabled the first
      # time it blocks a release for a transitive dev dependency.
      - name: Audit production dependencies (blocking)
        run: pnpm audit --prod --audit-level=moderate

      - name: Audit all dependencies (advisory)
        run: pnpm audit --audit-level=moderate || true

      # Catches a committed secret before it reaches the default branch. The VNR
      # password and SMTP credentials must never enter git (CLAUDE.md §4).
      # A configuration variable documented in a template with no reader, or
      # read by something and in no template. Both have shipped: two dead slugs
      # that `deploy.sh` still *required* of a fresh install, and an
      # ALLOWED_ORIGINS the compose file spelled differently — which arrived
      # empty and had every MEDICE request refused by CORS, with no
      # server-side trace at all.
      - name: Configuration drift
        run: node scripts/env-audit.mjs

      # A screen the console draws for a role the API refuses. Three of these
      # shipped in one week and every one was found by a person clicking:
      # `course_editor` met "keine Berechtigung" on its first request, and its
      # Organisation entry — then `department_admin`'s, then that role's
      # Teilnehmende and Bescheinigungen — could only ever render an error.
      # Four roles by nine screens is thirty-six answers, all derivable from
      # source, and none of them worth finding in production.
      - name: Screens every role can actually open
        run: node scripts/role-matrix.mjs

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
